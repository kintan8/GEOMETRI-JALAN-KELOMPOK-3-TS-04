  // Convert decimal degrees to DMS components & string
  const toDMS = (val, isLat = true) => {
    if (val === null || val === undefined || isNaN(val)) {
      return { deg: 0, min: 0, sec: 0, dir: isLat ? 'LS' : 'BT', text: '-' };
    }
    const dir = isLat ? (val < 0 ? 'LS' : 'LU') : (val < 0 ? 'BB' : 'BT');
    const absVal = Math.abs(val);
    const deg = Math.floor(absVal);
    const remMin = (absVal - deg) * 60;
    const min = Math.floor(remMin);
    const sec = parseFloat(((remMin - min) * 60).toFixed(2));
    const text = `${deg}° ${min}' ${sec.toFixed(2)}" ${dir}`;
    return { deg, min, sec, dir, text };
  };

  // Convert DMS components to decimal degrees
  const fromDMS = (deg, min, sec, dir) => {
    const d = parseFloat(deg) || 0;
    const m = parseFloat(min) || 0;
    const s = parseFloat(sec) || 0;
    let val = d + m / 60 + s / 3600;
    if (dir === 'LS' || dir === 'S' || dir === 'BB' || dir === 'W') {
      val = -val;
    }
    return parseFloat(val.toFixed(6));
  };

  // Convert Lat/Lon to UTM Zone & Coordinates (WGS-84 Transverse Mercator)
  const latLonToUtm = (lat, lon) => {
    if (lat === null || lat === undefined || lon === null || lon === undefined) {
      return { zoneStr: 'Zona 49S', easting: 0, northing: 0, cm: 111, bounds: '108° - 114° BT', provinceDesc: 'Jawa Tengah' };
    }
    const a = 6378137.0;
    const f = 1 / 298.257223563;
    const b = a * (1 - f);
    const e2 = (a * a - b * b) / (a * a);
    const e_prime2 = (a * a - b * b) / (b * b);
    const k0 = 0.9996;

    const zoneNum = Math.floor((lon + 180) / 6) + 1;
    const hemi = lat < 0 ? 'S' : 'N';
    const cm = (zoneNum - 1) * 6 - 180 + 3;
    const cm_rad = (cm * Math.PI) / 180;

    const lat_rad = (lat * Math.PI) / 180;
    const lon_rad = (lon * Math.PI) / 180;

    const N = a / Math.sqrt(1 - e2 * Math.sin(lat_rad) * Math.sin(lat_rad));
    const T = Math.tan(lat_rad) * Math.tan(lat_rad);
    const C = e_prime2 * Math.cos(lat_rad) * Math.cos(lat_rad);
    const A = (lon_rad - cm_rad) * Math.cos(lat_rad);

    const M = a * ((1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * Math.pow(e2, 3) / 256) * lat_rad
      - (3 * e2 / 8 + 3 * e2 * e2 / 32 + 45 * Math.pow(e2, 3) / 1024) * Math.sin(2 * lat_rad)
      + (15 * e2 * e2 / 256 + 45 * Math.pow(e2, 3) / 1024) * Math.sin(4 * lat_rad)
      - (35 * Math.pow(e2, 3) / 3072) * Math.sin(6 * lat_rad));

    let easting = k0 * N * (A + (1 - T + C) * Math.pow(A, 3) / 6 + (5 - 18 * T + T * T + 72 * C - 58 * e_prime2) * Math.pow(A, 5) / 120) + 500000.0;
    let northing = k0 * (M + N * Math.tan(lat_rad) * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * Math.pow(A, 4) / 24 + (61 - 58 * T + T * T + 600 * C - 330 * e_prime2) * Math.pow(A, 6) / 720));
    if (lat < 0) {
      northing += 10000000.0;
    }

    // Match zone info
    const matched = UTM_ZONES_INDONESIA.find(z => z.number === zoneNum) || {
      provinces: "Wilayah Indonesia",
      timezone: hemi === 'S' ? "WIB/WITA" : "WIB"
    };

    return {
      zoneStr: `Zona ${zoneNum}${hemi}`,
      zoneNumber: zoneNum,
      hemisphere: hemi,
      centralMeridian: cm,
      bounds: `${cm - 3}° BT - ${cm + 3}° BT`,
      provinces: matched.provinces,
      timezone: matched.timezone,
      easting: parseFloat(easting.toFixed(2)),
      northing: parseFloat(northing.toFixed(2))
    };
  };

        delta: 11.5,
        Ls: 60,
        Vd: 60,
        name: "Detail Tikungan (F-C)"
      });
      const [cadScale, setCadScale] = useState(5000);
      const [paperSize, setPaperSize] = useState('A4'); // 'A4', 'A3', 'OFF'
      const [cadLayers, setCadLayers] = useState({
        GARIS_UTAMA: true,
        GARIS_SUMBU: true,
        GARIS_POTONG: true,
        DIMENSI_NOTASI: true,
        TITIK_KONTROL: true,
        KOP_ETIKET: true
      });
      const [selectedEntity, setSelectedEntity] = useState(null);
      const [showCadStudio, setShowCadStudio] = useState(false);
      const [cadPan, setCadPan] = useState({ x: 0, y: 0 });
      const [cadZoom, setCadZoom] = useState(1.0);
      const [cursorCadCoords, setCursorCadCoords] = useState({ x: 519.08, y: 7.19 });
      const [cadIsFullscreen, setCadIsFullscreen] = useState(false);
      const cadCanvasRef = useRef(null);
      const cadContainerRef = useRef(null);
      const isDraggingCad = useRef(false);
      const dragStartPos = useRef({ x: 0, y: 0 });
      const lastPanPos = useRef({ x: 0, y: 0 });
      const cadHitEntitiesRef = useRef([]);

      // Modal Expert Advice
      const [showExpertModal, setShowExpertModal] = useState(false);

      // Accordion open states
      const [accordionHorizOpen, setAccordionHorizOpen] = useState(false);
      const [accordionVertOpen, setAccordionVertOpen] = useState(false);
      const [accordionSightOpen, setAccordionSightOpen] = useState(false);

      // Apply Dark Mode Class to HTML
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      // Active UTM Zone info based on the first anchor PI
      const activeUtm = useMemo(() => {
        const first = piList[0] || geoAnchor;
        return latLonToUtm(first.lat, first.lon);
      }, [piList, geoAnchor]);

      // --- CALCULATIONS ENGINE BASED ON PDGJ 2021 & SILVIA SUKIRMAN ---

      // --- CAD INTERACTIVE ENGINE HELPERS ---
      const openPiInCad = (piItem) => {
        let ct = 'FC';
        if (piItem.curveType && piItem.curveType.includes('S-C-S')) ct = 'SCS';
        else if (piItem.curveType && piItem.curveType.includes('S-S')) ct = 'SS';
        else if (piItem.curveType && piItem.curveType.includes('F-C')) ct = 'FC';

        setCadCurveType(ct);
        setCadParams({
          R: piItem.R || 1000,
          delta: piItem.deltaDeg || 11.5,
          Ls: piItem.Ls || 60,
          Vd: Vd || 60,
          name: `${piItem.piName || 'PI'} (${ct})`
        });
        setSelectedEntity(null);
        setCadPan({ x: 0, y: 0 });
        setCadZoom(1.0);
        setActiveTab('cad');
      };

      // Computed CAD Geometry for the active curve
      const cadGeom = useMemo(() => {
        const R = Math.max(50, parseFloat(cadParams.R) || 1000);
        const deltaDeg = Math.max(0.5, Math.min(179, parseFloat(cadParams.delta) || 11.5));
        const deltaRad = (deltaDeg * Math.PI) / 180;
        const alpha = deltaRad / 2;
        const Ls_in = Math.max(10, parseFloat(cadParams.Ls) || 60);

        if (cadCurveType === 'FC') {
          const Tc = R * Math.tan(alpha);
          const Ec = R * (1 / Math.cos(alpha) - 1);
          const Lc = R * deltaRad;
          return {
            type: 'FC',
            typeName: 'Full Circle (F-C)',
            R,
            deltaDeg,
            deltaRad,
            alpha,
            Tc,
            Ts: Tc,
            Ec,
            Es: Ec,
            Lc,
            Ltot: Lc,
            Ls: 0,
            thetaS_deg: 0,
            deltaC_deg: deltaDeg,
            p: 0,
            k: 0
          };
        } else if (cadCurveType === 'SCS') {
          const Ls = Ls_in;
          const thetaS_rad = Ls / (2 * R);
          const thetaS_deg = (thetaS_rad * 180) / Math.PI;
          const deltaC_deg = Math.max(0, deltaDeg - 2 * thetaS_deg);
          const deltaC_rad = (deltaC_deg * Math.PI) / 180;
          const Lc = R * deltaC_rad;
          const p = (Ls * Ls) / (24 * R);
          const k = Ls - Math.pow(Ls, 3) / (40 * R * R);
          const Ts = (R + p) * Math.tan(alpha) + k;
          const Es = (R + p) / Math.cos(alpha) - R;
          const Ltot = Lc + 2 * Ls;
          return {
            type: 'SCS',
            typeName: 'Spiral-Circle-Spiral (S-C-S)',
            R,
            deltaDeg,
            deltaRad,
            alpha,
            Tc: Ts,
            Ts,
            Ec: Es,
            Es,
            Lc,
            Ls,
            Ltot,
            thetaS_deg: thetaS_deg,
            deltaC_deg: deltaC_deg,
            p,
            k
          };
        } else {
          // Spiral-Spiral (S-S)
          const thetaS_rad = alpha;
          const thetaS_deg = deltaDeg / 2;
          const Ls = 2 * R * thetaS_rad;
          const p = (Ls * Ls) / (24 * R);
          const k = Ls - Math.pow(Ls, 3) / (40 * R * R);
          const Ts = (R + p) * Math.tan(alpha) + k;
          const Es = (R + p) / Math.cos(alpha) - R;
          const Ltot = 2 * Ls;
          return {
            type: 'SS',
            typeName: 'Spiral-Spiral (S-S)',
            R,
            deltaDeg,
            deltaRad,
            alpha,
            Tc: Ts,
            Ts,
            Ec: Es,
            Es,
            Lc: 0,
            Ls,
            Ltot,
            thetaS_deg: thetaS_deg,
            deltaC_deg: 0,
            p,
            k
          };
        }
      }, [cadCurveType, cadParams]);

      // --- KANVAS CAD RENDERING HOOK ---
      useEffect(() => {
        const canvas = cadCanvasRef.current;
        if (!canvas || activeTab !== 'cad') return;

        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;

        const ctx = canvas.getContext('2d');
        ctx.resetTransform();
        ctx.scale(dpr, dpr);

        const w = rect.width;
        const h = rect.height;

        // Reset hit entities
        cadHitEntitiesRef.current = [];

        // 1. Draw Paper Sheet Background & Margins
        if (paperSize !== 'OFF') {
          // Canvas backdrop
          ctx.fillStyle = darkMode ? '#0f172a' : '#f1f5f9';
          ctx.fillRect(0, 0, w, h);

          // Paper Sheet (A4 / A3 portrait or landscape)
          const paperMargin = 16;
          const pw = w - paperMargin * 2;
          const ph = h - paperMargin * 2;
          const px = paperMargin;
          const py = paperMargin;

          // Drop shadow
          ctx.shadowColor = darkMode ? 'rgba(0,0,0,0.6)' : 'rgba(0,0,0,0.12)';
          ctx.shadowBlur = 12;
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = 4;

          // Paper White Sheet
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(px, py, pw, ph);
          ctx.shadowColor = 'transparent';

          // Outer border
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(px, py, pw, ph);

          // Inner drafting margin
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 0.8;
          ctx.strokeRect(px + 8, py + 8, pw - 16, ph - 16);

          // Kop Etiket / Title Block (Bottom Right)
          if (cadLayers.KOP_ETIKET) {
            const kbW = Math.min(260, pw * 0.45);
            const kbH = 68;
            const kbX = px + pw - 8 - kbW;
            const kbY = py + ph - 8 - kbH;

            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(kbX, kbY, kbW, kbH);
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 1;
            ctx.strokeRect(kbX, kbY, kbW, kbH);

            // Inner divider lines
            ctx.beginPath();
            ctx.moveTo(kbX, kbY + 22);
            ctx.lineTo(kbX + kbW, kbY + 22);
            ctx.moveTo(kbX, kbY + 44);
            ctx.lineTo(kbX + kbW, kbY + 44);
            ctx.moveTo(kbX + kbW * 0.58, kbY + 44);
            ctx.lineTo(kbX + kbW * 0.58, kbY + kbH);
            ctx.stroke();

            // Text in Kop
            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 9px "Plus Jakarta Sans", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('UNIVERSITAS TIDAR - TEKNIK SIPIL', kbX + 6, kbY + 14);

            ctx.font = 'bold 10px "Plus Jakarta Sans", sans-serif';
            ctx.fillText(`DETAIL TIKUNGAN (${cadCurveType === 'FC' ? 'F-C' : cadCurveType === 'SCS' ? 'S-C-S' : 'S-S'})`, kbX + 6, kbY + 36);

            ctx.font = '8px "JetBrains Mono", monospace';
            ctx.fillText(`SKALA 1 : ${cadScale}`, kbX + 6, kbY + 58);
            ctx.fillText(`KLMPK 3 TS-04`, kbX + kbW * 0.62, kbY + 58);
          }
        } else {
          // Paper OFF: Clean infinite CAD workspace
          ctx.fillStyle = darkMode ? '#090d16' : '#ffffff';
          ctx.fillRect(0, 0, w, h);

          // Subtle dot grid
          ctx.fillStyle = darkMode ? '#1e293b' : '#e2e8f0';
          const gridStep = 30;
          for (let gx = 0; gx < w; gx += gridStep) {
            for (let gy = 0; gy < h; gy += gridStep) {
              ctx.fillRect(gx, gy, 1.5, 1.5);
            }
          }
        }

        // 2. CAD Coordinate Transformations & Math
        const origX = w / 2 + cadPan.x;
        const origY = h * 0.32 + cadPan.y;
        const baseScale = (w / 1400) * (5000 / cadScale) * cadZoom;

        const toScr = (wx, wy) => ({
          x: origX + wx * baseScale,
          y: origY - wy * baseScale
        });

        const toWld = (sx, sy) => ({
          x: (sx - origX) / baseScale,
          y: (origY - sy) / baseScale
        });

        // Geometry parameters
        const g = cadGeom;
        const R = g.R;
        const deltaDeg = g.deltaDeg;
        const alpha = g.alpha; // half delta
        const sinA = Math.sin(alpha);
        const cosA = Math.cos(alpha);

        let T = g.Tc;
        let E = g.Ec;
        let O_y = -R / cosA;
        let TC_pt, CT_pt, Pin_pt, Pout_pt, SC_pt, CS_pt, SS_pt;

        // Tangent extension beyond TC/CT for standard CAD appearance
        const Lext = T * 0.32;

        if (cadCurveType === 'FC') {
          TC_pt = { x: -T * cosA, y: -T * sinA };
          CT_pt = { x: T * cosA, y: -T * sinA };
          Pin_pt = { x: -(T + Lext) * cosA, y: -(T + Lext) * sinA };
          Pout_pt = { x: (T + Lext) * cosA, y: -(T + Lext) * sinA };
        } else if (cadCurveType === 'SCS') {
          T = g.Ts;
          E = g.Es;
          const p = g.p;
          O_y = -(R + p) / cosA;
          const thS = (g.thetaS_deg * Math.PI) / 180;

          TC_pt = { x: -T * cosA, y: -T * sinA }; // TS
          CT_pt = { x: T * cosA, y: -T * sinA }; // ST
          Pin_pt = { x: -(T + Lext) * cosA, y: -(T + Lext) * sinA };
          Pout_pt = { x: (T + Lext) * cosA, y: -(T + Lext) * sinA };

          // SC and CS on shifted circle
          SC_pt = { x: -R * Math.sin(alpha - thS), y: O_y + R * Math.cos(alpha - thS) };
          CS_pt = { x: R * Math.sin(alpha - thS), y: O_y + R * Math.cos(alpha - thS) };
        } else {
          // SS
          T = g.Ts;
          E = g.Es;
          const p = g.p;
          O_y = -(R + p) / cosA;

          TC_pt = { x: -T * cosA, y: -T * sinA }; // TS
          CT_pt = { x: T * cosA, y: -T * sinA }; // ST
          Pin_pt = { x: -(T + Lext) * cosA, y: -(T + Lext) * sinA };
          Pout_pt = { x: (T + Lext) * cosA, y: -(T + Lext) * sinA };
          SS_pt = { x: 0, y: -E };
        }

        const O_pt = { x: 0, y: O_y };
        const PI_pt = { x: 0, y: 0 };
        const Apex_pt = { x: 0, y: -E };

        // Convert key points to screen
        const scrPI = toScr(PI_pt.x, PI_pt.y);
        const scrTC = toScr(TC_pt.x, TC_pt.y);
        const scrCT = toScr(CT_pt.x, CT_pt.y);
        const scrPin = toScr(Pin_pt.x, Pin_pt.y);
        const scrPout = toScr(Pout_pt.x, Pout_pt.y);
        const scrO = toScr(O_pt.x, O_pt.y);
        const scrApex = toScr(Apex_pt.x, Apex_pt.y);

        // Helper: distance point to line segment
        const distToSegment = (px, py, x1, y1, x2, y2) => {
          const l2 = (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1);
          if (l2 === 0) return Math.hypot(px - x1, py - y1);
          let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
          t = Math.max(0, Math.min(1, t));
          return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
        };

        // 3. LAYER: GARIS_SUMBU (Centerline Axis Dash-Dot)
        if (cadLayers.GARIS_SUMBU) {
          ctx.save();
          ctx.strokeStyle = '#475569';
          ctx.lineWidth = 1.2;
          ctx.setLineDash([14, 4, 3, 4]); // Dash-dot pattern

          // Vertical centerline through PI and O
          const scrAxisTop = toScr(0, 40);
          const scrAxisBottom = toScr(0, O_y - 40);
          ctx.beginPath();
          ctx.moveTo(scrAxisTop.x, scrAxisTop.y);
          ctx.lineTo(scrAxisBottom.x, scrAxisBottom.y);
          ctx.stroke();
          ctx.restore();

          cadHitEntitiesRef.current.push({
            id: 'sumbu_utama',
            name: 'Garis Sumbu Bagi (Centerline Axis)',
            layer: 'GARIS_SUMBU',
            value: `Panjang Axis = ${(Math.abs(O_y) + 80).toFixed(2)} m`,
            formula: 'Garis Bagi Sudut PI (Bisector)',
            desc: 'Sumbu simetri geometrik tikungan yang menghubungkan titik perpotongan (PI) dengan titik pusat kelengkungan lingkaran (O).',
            standard: 'PDGJ 2021 & Prof. Silvia Sukirman',
            hitDist: (sx, sy) => distToSegment(sx, sy, scrAxisTop.x, scrAxisTop.y, scrAxisBottom.x, scrAxisBottom.y)
          });
        }

        // 4. LAYER: GARIS_POTONG (Radial Dashed Lines to O)
        if (cadLayers.GARIS_POTONG) {
          ctx.save();
          ctx.strokeStyle = '#64748b';
          ctx.lineWidth = 1.0;
          ctx.setLineDash([6, 4]); // Dashed line

          // Left radial line to TC / SC
          const scrRadLeftTarget = cadCurveType === 'SCS' ? toScr(SC_pt.x, SC_pt.y) : scrTC;
          ctx.beginPath();
          ctx.moveTo(scrO.x, scrO.y);
          ctx.lineTo(scrRadLeftTarget.x, scrRadLeftTarget.y);
          ctx.stroke();

          // Right radial line to CT / CS
          const scrRadRightTarget = cadCurveType === 'SCS' ? toScr(CS_pt.x, CS_pt.y) : scrCT;
          ctx.beginPath();
          ctx.moveTo(scrO.x, scrO.y);
          ctx.lineTo(scrRadRightTarget.x, scrRadRightTarget.y);
          ctx.stroke();

          // Horizontal centerline at O
          const scrOHorizL = toScr(-R * 0.25, O_y);
          const scrOHorizR = toScr(R * 0.25, O_y);
          ctx.beginPath();
          ctx.moveTo(scrOHorizL.x, scrOHorizL.y);
          ctx.lineTo(scrOHorizR.x, scrOHorizR.y);
          ctx.stroke();
          ctx.restore();

          cadHitEntitiesRef.current.push({
            id: 'garis_radial_R',
            name: 'Garis Jari-Jari Radial (R)',
            layer: 'GARIS_POTONG',
            value: `R = ${R.toFixed(2)} meter`,
            formula: 'Rmin = Vd² / (127 × (emax + fmax))',
            desc: 'Garis radial penentu titik pusat kelengkungan busur lingkaran. Titik potong radial dengan tangen membentuk sudut siku-siku 90° tepat di titik TC / CT.',
            standard: 'PDGJ 2021 & Prof. Silvia Sukirman',
            hitDist: (sx, sy) => Math.min(
              distToSegment(sx, sy, scrO.x, scrO.y, scrRadLeftTarget.x, scrRadLeftTarget.y),
              distToSegment(sx, sy, scrO.x, scrO.y, scrRadRightTarget.x, scrRadRightTarget.y)
            )
          });
        }

        // 5. LAYER: GARIS_UTAMA (Tangents, Circular Arc, Transition Spirals)
        if (cadLayers.GARIS_UTAMA) {
          ctx.save();
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 2.4;
          ctx.setLineDash([]); // Solid CAD line

          // Tangents
          ctx.beginPath();
          ctx.moveTo(scrPin.x, scrPin.y);
          ctx.lineTo(scrPI.x, scrPI.y);
          ctx.lineTo(scrPout.x, scrPout.y);
          ctx.stroke();

          // Register Tangent Hit Entity
          cadHitEntitiesRef.current.push({
            id: 'tangen_utama',
            name: cadCurveType === 'FC' ? 'Tangen Luar (Tc)' : 'Tangen Luar (Ts)',
            layer: 'GARIS_UTAMA',
            value: `${T.toFixed(2)} meter`,
            formula: cadCurveType === 'FC' ? 'Tc = R × tan(Δ / 2)' : 'Ts = (R + p) tan(Δ / 2) + k',
            desc: 'Jarak dari Titik Perpotongan (PI) ke titik awal/akhir tikungan (TC/TS). Menurut pedoman PDGJ 2021 dan Prof. Silvia Sukirman, nilai Ts tidak boleh melebihi setengah panjang tangen antar-PI guna mencegah risiko tumpang tindih (overlapping) tikungan.',
            standard: 'Bina Marga PDGJ 2021 & Prof. Silvia Sukirman',
            hitDist: (sx, sy) => Math.min(
              distToSegment(sx, sy, scrPin.x, scrPin.y, scrPI.x, scrPI.y),
              distToSegment(sx, sy, scrPI.x, scrPI.y, scrPout.x, scrPout.y)
            )
          });

          // Curve Arcs & Spirals
          if (cadCurveType === 'FC') {
            // Full Circle arc from TC to CT
            const startAngle = Math.PI / 2 + alpha;
            const endAngle = Math.PI / 2 - alpha;

            // In screen coordinates: Y is inverted
            ctx.beginPath();
            ctx.arc(scrO.x, scrO.y, R * baseScale, -startAngle, -endAngle, false);
            ctx.stroke();

            cadHitEntitiesRef.current.push({
              id: 'lengkung_lingkaran_fc',
              name: 'Busur Lingkaran Penuh (Lc)',
              layer: 'GARIS_UTAMA',
              value: `${g.Lc.toFixed(2)} meter`,
              formula: 'Lc = (Δ × π × R) / 180',
              desc: 'Panjang busur lingkaran murni tikungan Full Circle di mana kemiringan melintang jalan (superelevasi normal/e) dipertahankan stabil di sepanjang lengkung.',
              standard: 'PDGJ 2021 & Prof. Silvia Sukirman',
              hitDist: (sx, sy) => {
                const distFromO = Math.hypot(sx - scrO.x, sy - scrO.y);
                return Math.abs(distFromO - R * baseScale);
              }
            });
          } else if (cadCurveType === 'SCS') {
            // Spiral Entry (TS -> SC)
            const thS = (g.thetaS_deg * Math.PI) / 180;
            const steps = 24;

            ctx.beginPath();
            ctx.moveTo(scrTC.x, scrTC.y);
            for (let i = 1; i <= steps; i++) {
              const u = i / steps; // 0 to 1
              const l = u * g.Ls;
              // Local spiral coordinates (Euler clothoid approximation)
              const xl = l - Math.pow(l, 5) / (40 * R * R * g.Ls * g.Ls);
              const yl = Math.pow(l, 3) / (6 * R * g.Ls);
              // Transform to world along incoming tangent:
              // Origin is TC, tangent direction is (cosA, sinA)
              const wx = TC_pt.x + xl * cosA - yl * sinA;
              const wy = TC_pt.y + xl * sinA + yl * cosA;
              const sp = toScr(wx, wy);
              ctx.lineTo(sp.x, sp.y);
            }
            ctx.stroke();

            // Circular Arc (SC -> CS)
            const scrSC = toScr(SC_pt.x, SC_pt.y);
            const scrCS = toScr(CS_pt.x, CS_pt.y);
            const scAngle = Math.PI / 2 + alpha - thS;
            const csAngle = Math.PI / 2 - alpha + thS;

            ctx.beginPath();
            ctx.arc(scrO.x, scrO.y, R * baseScale, -scAngle, -csAngle, false);
            ctx.stroke();

            // Spiral Exit (CS -> ST)
            ctx.beginPath();
            ctx.moveTo(scrCS.x, scrCS.y);
            for (let i = steps - 1; i >= 0; i--) {
              const u = i / steps;
              const l = (1 - u) * g.Ls;
              const xl = l - Math.pow(l, 5) / (40 * R * R * g.Ls * g.Ls);
              const yl = Math.pow(l, 3) / (6 * R * g.Ls);
              // Along outgoing tangent backwards from CT
              const wx = CT_pt.x - xl * cosA - yl * sinA;
              const wy = CT_pt.y + xl * sinA - yl * cosA;
              const sp = toScr(wx, wy);
              ctx.lineTo(sp.x, sp.y);
            }
            ctx.lineTo(scrCT.x, scrCT.y);
            ctx.stroke();

            // Register hit entities for SCS
            cadHitEntitiesRef.current.push({
              id: 'lengkung_busur_scs',
              name: 'Busur Lingkaran S-C-S (Lc)',
              layer: 'GARIS_UTAMA',
              value: `${g.Lc.toFixed(2)} meter`,
              formula: 'Lc = (Δc × π × R) / 180',
              desc: 'Panjang busur lingkaran murni di mana superelevasi maksimum dipertahankan penuh. Sesuai standar PDGJ 2021, Lc disyaratkan minimal 25 meter atau ditempuh ≥ 1.5 detik pada kecepatan rencana.',
              standard: 'Bina Marga PDGJ 2021',
              hitDist: (sx, sy) => Math.abs(Math.hypot(sx - scrO.x, sy - scrO.y) - R * baseScale)
            });

            cadHitEntitiesRef.current.push({
              id: 'spiral_scs',
              name: 'Lengkung Peralihan Spiral (Ls)',
              layer: 'GARIS_UTAMA',
              value: `${g.Ls.toFixed(2)} meter`,
              formula: 'Ls = max(Ls_modifikasi, Ls_waktu, Ls_superelevasi)',
              desc: 'Lengkung transisi bertingkat dengan kelengkungan linear dari R=∞ di TS ke R di SC. Berfungsi mengalirkan gaya sentrifugal secara bertahap dan menyediakan area pencapaian kemiringan (superelevasi runoff).',
              standard: 'Prof. Silvia Sukirman & PDGJ 2021',
              hitDist: (sx, sy) => Math.min(
                distToSegment(sx, sy, scrTC.x, scrTC.y, scrSC.x, scrSC.y),
                distToSegment(sx, sy, scrCS.x, scrCS.y, scrCT.x, scrCT.y)
              )
            });
          } else {
            // Spiral-Spiral (S-S)
            const scrSS = toScr(SS_pt.x, SS_pt.y);
            const steps = 30;

            // Spiral 1: TS -> SS
            ctx.beginPath();
            ctx.moveTo(scrTC.x, scrTC.y);
            for (let i = 1; i <= steps; i++) {
              const u = i / steps;
              const l = u * g.Ls;
              const xl = l - Math.pow(l, 5) / (40 * R * R * g.Ls * g.Ls);
              const yl = Math.pow(l, 3) / (6 * R * g.Ls);
              const wx = TC_pt.x + xl * cosA - yl * sinA;
              const wy = TC_pt.y + xl * sinA + yl * cosA;
              const sp = toScr(wx, wy);
              ctx.lineTo(sp.x, sp.y);
            }
            ctx.stroke();

            // Spiral 2: SS -> ST
            ctx.beginPath();
            ctx.moveTo(scrSS.x, scrSS.y);
            for (let i = steps - 1; i >= 0; i--) {
              const u = i / steps;
              const l = (1 - u) * g.Ls;
              const xl = l - Math.pow(l, 5) / (40 * R * R * g.Ls * g.Ls);
              const yl = Math.pow(l, 3) / (6 * R * g.Ls);
              const wx = CT_pt.x - xl * cosA - yl * sinA;
              const wy = CT_pt.y + xl * sinA - yl * cosA;
              const sp = toScr(wx, wy);
              ctx.lineTo(sp.x, sp.y);
            }
            ctx.lineTo(scrCT.x, scrCT.y);
            ctx.stroke();

            cadHitEntitiesRef.current.push({
              id: 'spiral_ss',
              name: 'Lengkung Spiral-Spiral Penuh (Ltot = 2×Ls)',
              layer: 'GARIS_UTAMA',
              value: `Ltot = ${g.Ltot.toFixed(2)} meter (Ls = ${g.Ls.toFixed(2)} m)`,
              formula: 'θs = Δ / 2 | Lc = 0 | Ls = (Δ × π × R) / 180',
              desc: 'Tikungan khusus Spiral-Spiral di mana busur lingkaran habis (Lc = 0). Dua spiral bertemu langsung di puncak SS. Digunakan pada medan perbukitan/pegunungan dengan sudut belokan kecil atau ruang terbatas.',
              standard: 'PDGJ 2021 & Prof. Silvia Sukirman',
              hitDist: (sx, sy) => Math.min(
                distToSegment(sx, sy, scrTC.x, scrTC.y, scrSS.x, scrSS.y),
                distToSegment(sx, sy, scrSS.x, scrSS.y, scrCT.x, scrCT.y)
              )
            });
          }
          ctx.restore();
        }

        // 6. LAYER: DIMENSI_NOTASI (Engineering Dimension Lines & Labels)
        if (cadLayers.DIMENSI_NOTASI) {
          ctx.save();
          ctx.strokeStyle = '#0f172a';
          ctx.fillStyle = '#0f172a';
          ctx.lineWidth = 1.0;
          ctx.font = 'bold 9px "Plus Jakarta Sans", sans-serif';

          // Helper: Draw dimension arrow / tick
          const drawDimLine = (x1, y1, x2, y2, labelText) => {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            // Slashes at ends
            const angle = Math.atan2(y2 - y1, x2 - x1);
            const tickL = 5;
            ctx.beginPath();
            ctx.moveTo(x1 - tickL * Math.cos(angle + Math.PI / 4), y1 - tickL * Math.sin(angle + Math.PI / 4));
            ctx.lineTo(x1 + tickL * Math.cos(angle + Math.PI / 4), y1 + tickL * Math.sin(angle + Math.PI / 4));
            ctx.moveTo(x2 - tickL * Math.cos(angle + Math.PI / 4), y2 - tickL * Math.sin(angle + Math.PI / 4));
            ctx.lineTo(x2 + tickL * Math.cos(angle + Math.PI / 4), y2 + tickL * Math.sin(angle + Math.PI / 4));
            ctx.stroke();

            // Centered text
            const mx = (x1 + x2) / 2;
            const my = (y1 + y2) / 2;
            ctx.save();
            ctx.translate(mx, my);
            ctx.rotate(angle);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(labelText, 0, -3);
            ctx.restore();
          };

          // A. Tangent Dimension (Ts / Tc)
          const dimOffset = 22;
          const normX = -Math.sin(alpha);
          const normY = Math.cos(alpha);
          const dt1 = { x: scrTC.x - normX * dimOffset, y: scrTC.y - normY * dimOffset };
          const dt2 = { x: scrPI.x - normX * dimOffset, y: scrPI.y - normY * dimOffset };

          // Extension lines
          ctx.beginPath();
          ctx.moveTo(scrTC.x, scrTC.y);
          ctx.lineTo(dt1.x, dt1.y);
          ctx.moveTo(scrPI.x, scrPI.y);
          ctx.lineTo(dt2.x, dt2.y);
          ctx.stroke();

          const tangenLabel = cadCurveType === 'FC' ? `Tc: ${T.toFixed(2)} m` : `Ts: ${T.toFixed(2)} m`;
          drawDimLine(dt1.x, dt1.y, dt2.x, dt2.y, tangenLabel);

          // B. External Distance Dimension (Ec / Es)
          const de1 = scrPI;
          const de2 = scrApex;
          ctx.beginPath();
          ctx.moveTo(de1.x, de1.y);
          ctx.lineTo(de2.x, de2.y);
          ctx.stroke();
          // Dimension text along vertical axis
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          const ecLabel = cadCurveType === 'FC' ? `Ec: ${E.toFixed(3)} m` : `Es: ${E.toFixed(3)} m`;
          ctx.fillText(ecLabel, de1.x + 5, (de1.y + de2.y) / 2);

          // C. Deflection Angle (Δ) Arc at PI
          const arcR = 32;
          ctx.beginPath();
          ctx.arc(scrPI.x, scrPI.y, arcR, Math.PI / 2 - alpha, Math.PI / 2 + alpha, false);
          ctx.stroke();
          ctx.textAlign = 'center';
          ctx.fillText(`Δ: ${deltaDeg.toFixed(1)}°`, scrPI.x + 36, scrPI.y + 16);

          // D. Curve Length Dimension (Lc / Ltot) below curve
          const scrLc1 = scrTC;
          const scrLc2 = scrCT;
          const lcOffsetY = 24;
          const dlc1 = { x: scrLc1.x, y: scrLc1.y + lcOffsetY };
          const dlc2 = { x: scrLc2.x, y: scrLc2.y + lcOffsetY };

          ctx.beginPath();
          ctx.moveTo(scrLc1.x, scrLc1.y);
          ctx.lineTo(dlc1.x, dlc1.y);
          ctx.moveTo(scrLc2.x, scrLc2.y);
          ctx.lineTo(dlc2.x, dlc2.y);
          ctx.stroke();

          const lcLabel = cadCurveType === 'FC' 
            ? `Lc : ${g.Lc.toFixed(2)} m` 
            : (cadCurveType === 'SCS' ? `Lc: ${g.Lc.toFixed(2)} m | Ls: ${g.Ls.toFixed(2)} m` : `Ltot: ${g.Ltot.toFixed(2)} m`);
          drawDimLine(dlc1.x, dlc1.y, dlc2.x, dlc2.y, lcLabel);

          // E. Radius Dimension (R)
          const midArcScr = toScr(0, O_y + R);
          const radMidScr = toScr(R * 0.15, O_y + R * 0.5);
          ctx.save();
          ctx.textAlign = 'left';
          ctx.fillText(`R: ${R.toFixed(0)} m`, radMidScr.x + 10, radMidScr.y);
          ctx.restore();

          ctx.restore();

          cadHitEntitiesRef.current.push({
            id: 'dimensi_notasi_all',
            name: 'Anotasi & Notasi Dimensi CAD',
            layer: 'DIMENSI_NOTASI',
            value: `Ts=${T.toFixed(2)}m, Es=${E.toFixed(3)}m, Lc=${g.Lc.toFixed(2)}m, R=${R}m, Δ=${deltaDeg.toFixed(1)}°`,
            formula: 'Format Dimensi Gambar Kerja Standar ISO / Bina Marga',
            desc: 'Dimensi resmi untuk pembacaan gambar kerja oleh kontraktor dan pengawas lapangan dalam menentukan titik staking out.',
            standard: 'PDGJ 2021 & Gambar Standar Bina Marga',
            hitDist: (sx, sy) => Math.min(
              distToSegment(sx, sy, dt1.x, dt1.y, dt2.x, dt2.y),
              distToSegment(sx, sy, dlc1.x, dlc1.y, dlc2.x, dlc2.y),
              Math.hypot(sx - scrPI.x, sy - scrPI.y)
            )
          });
        }

        // 7. LAYER: TITIK_KONTROL (Control Points & Crosshairs)
        if (cadLayers.TITIK_KONTROL) {
          ctx.save();
          ctx.fillStyle = '#0f172a';
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 1.2;
          ctx.font = 'bold 10px "Plus Jakarta Sans", sans-serif';

          const drawPointMarker = (pt, label, align = 'center', baseline = 'bottom') => {
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
            ctx.fill();

            // Crosshair
            ctx.beginPath();
            ctx.moveTo(pt.x - 5, pt.y);
            ctx.lineTo(pt.x + 5, pt.y);
            ctx.moveTo(pt.x, pt.y - 5);
            ctx.lineTo(pt.x, pt.y + 5);
            ctx.stroke();

            ctx.textAlign = align;
            ctx.textBaseline = baseline;
            ctx.fillText(label, pt.x, pt.y - 7);
          };

          drawPointMarker(scrPI, 'PI', 'center', 'bottom');

          if (cadCurveType === 'FC') {
            drawPointMarker(scrTC, 'TC', 'right', 'bottom');
            drawPointMarker(scrCT, 'CT', 'left', 'bottom');
          } else if (cadCurveType === 'SCS') {
            drawPointMarker(scrTC, 'TS', 'right', 'bottom');
            drawPointMarker(scrCT, 'ST', 'left', 'bottom');
            const scrSC = toScr(SC_pt.x, SC_pt.y);
            const scrCS = toScr(CS_pt.x, CS_pt.y);
            drawPointMarker(scrSC, 'SC', 'right', 'bottom');
            drawPointMarker(scrCS, 'CS', 'left', 'bottom');
          } else {
            drawPointMarker(scrTC, 'TS', 'right', 'bottom');
            drawPointMarker(scrCT, 'ST', 'left', 'bottom');
            drawPointMarker(scrApex, 'SS', 'center', 'bottom');
          }

          drawPointMarker(scrO, 'O (Pusat R)', 'center', 'top');
          ctx.restore();

          cadHitEntitiesRef.current.push({
            id: 'titik_kontrol_group',
            name: 'Titik Kontrol Staking Out (PI, TC/TS, CT/ST, O)',
            layer: 'TITIK_KONTROL',
            value: `Koordinat Relatif PI (0, 0)`,
            formula: 'Staking Out Titik Tangen & Pusat Tikungan',
            desc: 'Titik-titik kontrol geodesi utama yang dipatok di lapangan menggunakan Total Station atau GPS Geodetik saat pelaksanaan konstruksi jalan raya.',
            standard: 'PDGJ 2021 & Spesifikasi Umum Bina Marga',
            hitDist: (sx, sy) => Math.min(
              Math.hypot(sx - scrPI.x, sy - scrPI.y),
              Math.hypot(sx - scrTC.x, sy - scrTC.y),
              Math.hypot(sx - scrCT.x, sy - scrCT.y),
              Math.hypot(sx - scrO.x, sy - scrO.y)
            )
          });
        }

        // 8. LAYER: KOP_ETIKET - DETAIL TITLE & SURVEYOR EMBLEM (Bottom Left / Center)
        if (cadLayers.KOP_ETIKET) {
          ctx.save();
          // Emblem position at lower left
          const embX = Math.max(70, w * 0.32 + cadPan.x * 0.3);
          const embY = Math.min(h - 55, h * 0.88 + cadPan.y * 0.3);
          const embR = 14;

          // Surveyor North / Detail Circular Emblem (4 quadrants, 2 black filled)
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(embX, embY, embR, 0, Math.PI * 2);
          ctx.stroke();

          ctx.fillStyle = '#0f172a';
          // Top-Left quadrant
          ctx.beginPath();
          ctx.moveTo(embX, embY);
          ctx.arc(embX, embY, embR, Math.PI, 1.5 * Math.PI);
          ctx.fill();

          // Bottom-Right quadrant
          ctx.beginPath();
          ctx.moveTo(embX, embY);
          ctx.arc(embX, embY, embR, 0, 0.5 * Math.PI);
          ctx.fill();

          // Cross lines inside circle
          ctx.beginPath();
          ctx.moveTo(embX - embR, embY);
          ctx.lineTo(embX + embR, embY);
          ctx.moveTo(embX, embY - embR);
          ctx.lineTo(embX, embY + embR);
          ctx.stroke();

          // Double horizontal underline
          const textStartX = embX + embR + 10;
          const lineEndX = textStartX + 180;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(textStartX, embY + 2);
          ctx.lineTo(lineEndX, embY + 2);
          ctx.moveTo(textStartX, embY + 5);
          ctx.lineTo(lineEndX, embY + 5);
          ctx.stroke();

          // Title & Scale text
          ctx.font = 'bold 11px "Plus Jakarta Sans", sans-serif';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'bottom';
          ctx.fillText(`DETAIL TIKUNGAN (${cadCurveType === 'FC' ? 'F-C' : cadCurveType === 'SCS' ? 'S-C-S' : 'S-S'})`, textStartX, embY - 1);

          ctx.font = 'bold 9px "JetBrains Mono", monospace';
          ctx.textBaseline = 'top';
          ctx.fillText(`1 : ${cadScale}`, textStartX, embY + 8);

          ctx.restore();
        }

        // 9. Highlight Selected Entity (Glowing halo / golden indicator)
        if (selectedEntity) {
          ctx.save();
          ctx.strokeStyle = '#f59e0b';
          ctx.fillStyle = '#f59e0b';
          ctx.lineWidth = 3.5;
          ctx.shadowColor = '#f59e0b';
          ctx.shadowBlur = 8;

          // Draw highlight ring on selected
          if (selectedEntity.id.includes('tangen')) {
            ctx.beginPath();
            ctx.moveTo(scrPin.x, scrPin.y);
            ctx.lineTo(scrPI.x, scrPI.y);
            ctx.lineTo(scrPout.x, scrPout.y);
            ctx.stroke();
          } else if (selectedEntity.id.includes('lengkung') || selectedEntity.id.includes('spiral')) {
            ctx.beginPath();
            ctx.arc(scrO.x, scrO.y, R * baseScale, -Math.PI / 2 - alpha, -Math.PI / 2 + alpha, false);
            ctx.stroke();
          } else if (selectedEntity.id.includes('garis_radial')) {
            ctx.beginPath();
            ctx.moveTo(scrO.x, scrO.y);
            ctx.lineTo(scrTC.x, scrTC.y);
            ctx.moveTo(scrO.x, scrO.y);
            ctx.lineTo(scrCT.x, scrCT.y);
            ctx.stroke();
          } else if (selectedEntity.id.includes('titik')) {
            ctx.beginPath();
            ctx.arc(scrPI.x, scrPI.y, 8, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.restore();
        }

      }, [activeTab, cadCurveType, cadParams, cadScale, paperSize, cadLayers, cadPan, cadZoom, selectedEntity, darkMode, cadGeom]);

      // 1. Koefisien Gesek Melintang Maksimum fmax (Sukirman: 0.19 - 0.00065*Vd atau PDGJ 2021)
      const fmax = useMemo(() => {
        const val = 0.192 - 0.00065 * Vd;
        return Math.max(0.11, Math.min(0.17, parseFloat(val.toFixed(4))));
      }, [Vd]);

      // 2. R_min Matematis
      const Rmin = useMemo(() => {
        // R_min = Vd^2 / (127 * (emax + fmax))
        return Math.ceil((Vd * Vd) / (127 * (emax + fmax)));
      }, [Vd, emax, fmax]);

      // 3. R_min untuk Full Circle (tanpa lengkung peralihan / superelevasi e <= en)
      const RminFC = useMemo(() => {
        // Berdasarkan PDGJ 2021 / Silvia Sukirman: saat e = en (2%), R sangat besar
        // R_fc ~ Vd^2 / (127 * (en + 0.03))
        return Math.ceil((Vd * Vd) / (127 * (en + 0.03)));
      }, [Vd, en]);

      // 4. Jarak Pandang Henti (JPH) & Jarak Pandang Mendahului (JPM)
      const sightDistances = useMemo(() => {
        // Koefisien gesek memanjang ban-aspal (f_l) menurut Silvia Sukirman & PDGJ
        const fl = 0.40 - 0.001 * Vd;
        // Waktu reaksi standar t = 2.5 detik
        const d1 = 0.278 * Vd * 2.5; // Jarak sadar/reaksi
        const d2 = (Vd * Vd) / (254 * fl); // Jarak pengereman di jalan datar
        const JPH = Math.ceil(d1 + d2);

        // JPM (Jarak Pandang Mendahului) menurut PDGJ 2021 (tabel/rumus 4 fasa)
        // Estimasi standar: Vd=40: 200m; Vd=60: 350m; Vd=80: 550m; Vd=100: 700m
        let JPM = 350;
        if (Vd <= 40) JPM = 200;
        else if (Vd <= 50) JPM = 275;
        else if (Vd <= 60) JPM = 350;
        else if (Vd <= 70) JPM = 450;
        else if (Vd <= 80) JPM = 550;
        else if (Vd <= 100) JPM = 675;
        else JPM = 800;

        return { d1: d1.toFixed(1), d2: d2.toFixed(1), JPH, JPM, fl: fl.toFixed(3) };
      }, [Vd]);

      // 5. Rekomendasi Kelandaian Relatif (1/m)
      const kelandaianRelatifM = useMemo(() => {
        // PDGJ 2021: Vd=40->100, Vd=60->125, Vd=80->150, Vd=100->175
        if (Vd <= 40) return 100;
        if (Vd <= 60) return 125;
        if (Vd <= 80) return 150;
        if (Vd <= 100) return 175;
        return 200;
      }, [Vd]);

      // 6. Evaluasi Alinyemen Horizontal
      const horizCalc = useMemo(() => {
        let results = [];
        let runningSta = 0;

        for (let i = 0; i < piList.length - 1; i++) {
          const p1 = piList[i];
          const p2 = piList[i + 1];
          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const azimuth = calcAzimuth(dx, dy);

          results.push({
            segmentIndex: i,
            from: p1.name,
            to: p2.name,
            dx,
            dy,
            dist,
            azimuth
          });
        }

        // Hitung sudut tikungan delta pada setiap PI antara (bukan titik awal/akhir)
        let curveResults = [];
        for (let i = 1; i < piList.length - 1; i++) {
          const pi = piList[i];
          const segPrev = results[i - 1];
          const segNext = results[i];

          // Sudut defleksi delta
          let azDiff = segNext.azimuth - segPrev.azimuth;
          if (azDiff > 180) azDiff -= 360;
          if (azDiff < -180) azDiff += 360;

          const turnDirection = azDiff >= 0 ? "Kanan" : "Kiri";
          const deltaDeg = Math.abs(azDiff);
          const deltaRad = (deltaDeg * Math.PI) / 180;

          const R = Math.max(10, pi.R || Rmin);

          // Superelevasi butuh (Bina Marga Method 5 / Silvia Sukirman)
          // e_butuh = emax * (Rmin / R) * (2 - Rmin / R) jika R > Rmin
          let e_butuh = emax;
          if (R >= Rmin) {
            const ratio = Rmin / R;
            e_butuh = emax * ratio * (2 - ratio);
            if (e_butuh < en) e_butuh = en;
          } else {
            e_butuh = emax;
          }

          // Perhitungan 3 Kriteria Ls:
          // Kriteria 1: Rumus Modifikasi Shortt
          // Ls1 = 0.022 * Vd^3 / (R * C) - 2.727 * (Vd * e_butuh / C)
          const Ls1_raw = (0.022 * Math.pow(Vd, 3)) / (R * C) - (2.727 * Vd * e_butuh) / C;
          const Ls1 = Math.max(15, Math.ceil(Ls1_raw));

          // Kriteria 2: Kelandaian Relatif
          // Ls2 = (e_butuh - en) * laneWidth * m
          const Ls2_raw = Math.max(0, (e_butuh - en) * laneWidth * kelandaianRelatifM);
          const Ls2 = Math.max(15, Math.ceil(Ls2_raw));

          // Kriteria 3: Waktu tempuh 3 detik
          // Ls3 = (Vd / 3.6) * 3
          const Ls3 = Math.ceil((Vd / 3.6) * 3);

          const Ls_rec = Math.ceil(Math.max(Ls1, Ls2, Ls3) / 5) * 5;
          const Ls = pi.Ls > 0 ? pi.Ls : Ls_rec;

          // Perhitungan Spiral-Circle-Spiral
          const thetaS_rad = Ls / (2 * R);
          const thetaS_deg = (thetaS_rad * 180) / Math.PI;

          const deltaC_deg = deltaDeg - 2 * thetaS_deg;
          const deltaC_rad = (deltaC_deg * Math.PI) / 180;

          let curveType = "Spiral-Circle-Spiral (S-C-S)";
          let isWarning = false;
          let warningNote = "";

          if (deltaC_deg <= 0) {
            curveType = "Spiral-Spiral (S-S)";
            isWarning = true;
            warningNote = "Sudut lengkung lingkaran habis (Δc ≤ 0). Gunakan tipe Spiral-Spiral atau perbesar jari-jari R.";
          } else if (e_butuh <= en && R >= RminFC) {
            curveType = "Full Circle (F-C)";
          }

          // Lc (panjang busur lingkaran)
          const Lc = deltaC_deg > 0 ? (deltaC_deg * Math.PI * R) / 180 : 0;

          // Geseran busur lingkaran (p) dan absis (k)
          const p = (Ls * Ls) / (24 * R);
          const k = Ls - Math.pow(Ls, 3) / (40 * R * R);

          // Tangen Luar (Ts) dan Jarak Eksternal (Es)
          const Ts = (R + p) * Math.tan(deltaRad / 2) + k;
          const Es = (R + p) / Math.cos(deltaRad / 2) - R;

          // Panjang Tikungan Total
          const Ltot = curveType === "Full Circle (F-C)" ? (deltaDeg * Math.PI * R) / 180 : Lc + 2 * Ls;

          // Evaluasi Syarat Standar PDGJ & Silvia Sukirman
          if (curveType === "Spiral-Circle-Spiral (S-C-S)" && Lc < 25) {
            isWarning = true;
            warningNote = "Lc < 25 meter. Waktu tempuh di busur lingkaran sangat singkat (< 1.5 detik). Disarankan menyesuaikan R atau Ls.";
          }
          if (Ts > segPrev.dist / 2 || Ts > segNext.dist / 2) {
            isWarning = true;
            warningNote = "Tangen total Ts sangat panjang dibandingkan panjang antar PI. Risiko overlap dengan tikungan tetangga!";
          }

          curveResults.push({
            piName: pi.name,
            turnDirection,
            deltaDeg,
            R,
            e_butuh: (e_butuh * 100).toFixed(2),
            Ls1,
            Ls2,
            Ls3,
            Ls_rec,
            Ls,
            thetaS_deg: thetaS_deg.toFixed(3),
            deltaC_deg: deltaC_deg.toFixed(3),
            Lc: Lc.toFixed(2),
            p: p.toFixed(3),
            k: k.toFixed(3),
            Ts: Ts.toFixed(2),
            Es: Es.toFixed(2),
            Ltot: Ltot.toFixed(2),
            curveType,
            isWarning,
            warningNote
          });
        }

        // --- PERHITUNGAN STATIONING (STA) ALINYEMEN HORIZONTAL KONTINU (PDGJ 2021 & SILVIA SUKIRMAN) ---
        let criticalStations = [];
        let currentSTA = 0;

        if (piList.length > 0) {
          criticalStations.push({
            code: "Awal (" + piList[0].name + ")",
            piName: piList[0].name,
            pointType: "Awal",
            sta: 0,
            staFormatted: formatSTA(0),
            lat: piList[0].lat,
            lon: piList[0].lon,
            x: piList[0].x,
            y: piList[0].y,
            partialDist: 0,
            cumulativeDist: 0,
            desc: "Titik Awal Trase Jalan"
          });
        }

        for (let i = 0; i < curveResults.length; i++) {
          const c = curveResults[i];
          const piIndex = i + 1;
          const piObj = piList[piIndex];
          const prevDist = results[i].dist;
          const Ts = parseFloat(c.Ts);
          const Ls = parseFloat(c.Ls);
          const Lc = parseFloat(c.Lc);

          const prevTs = i === 0 ? 0 : parseFloat(curveResults[i - 1].Ts);
          const tangentDist = Math.max(0, prevDist - prevTs - Ts);

          const staTS = currentSTA + tangentDist;
          const staPI = currentSTA + (prevDist - prevTs);
          const staSC = staTS + Ls;
          const staCS = staSC + Lc;
          const staST = staCS + Ls;

          c.staTS = staTS;
          c.staSC = staSC;
          c.staCS = staCS;
          c.staST = staST;
          c.staPI = staPI;
          c.staTSFormatted = formatSTA(staTS);
          c.staSCFormatted = formatSTA(staSC);
          c.staCSFormatted = formatSTA(staCS);
          c.staSTFormatted = formatSTA(staST);
          c.staPIFormatted = formatSTA(staPI);

          currentSTA = staST;

          criticalStations.push({
            code: `TS-${piIndex}`,
            piName: c.piName,
            pointType: "TS (Tangent to Spiral)",
            sta: staTS,
            staFormatted: formatSTA(staTS),
            lat: piObj.lat,
            lon: piObj.lon,
            partialDist: tangentDist,
            cumulativeDist: staTS,
            desc: `Peralihan Tangen ke Spiral Masuk (${c.piName})`
          });

          criticalStations.push({
            code: `SC-${piIndex}`,
            piName: c.piName,
            pointType: "SC (Spiral to Circle)",
            sta: staSC,
            staFormatted: formatSTA(staSC),
            lat: piObj.lat,
            lon: piObj.lon,
            partialDist: Ls,
            cumulativeDist: staSC,
            desc: `Peralihan Spiral ke Busur Lingkaran Penuh (R=${c.R}m)`
          });

          criticalStations.push({
            code: `CS-${piIndex}`,
            piName: c.piName,
            pointType: "CS (Circle to Spiral)",
            sta: staCS,
            staFormatted: formatSTA(staCS),
            lat: piObj.lat,
            lon: piObj.lon,
            partialDist: Lc,
            cumulativeDist: staCS,
            desc: `Peralihan Busur Lingkaran ke Spiral Keluar`
          });

          criticalStations.push({
            code: `ST-${piIndex}`,
            piName: c.piName,
            pointType: "ST (Spiral to Tangent)",
            sta: staST,
            staFormatted: formatSTA(staST),
            lat: piObj.lat,
            lon: piObj.lon,
            partialDist: Ls,
            cumulativeDist: staST,
            desc: `Peralihan Spiral ke Tangen Keluar`
          });
        }

        let totalSTA = currentSTA;
        if (piList.length > 1) {
          const lastIdx = piList.length - 1;
          const lastPI = piList[lastIdx];
          const lastDist = results[results.length - 1].dist;
          const lastTs = curveResults.length > 0 ? parseFloat(curveResults[curveResults.length - 1].Ts) : 0;
          const finalTangentDist = Math.max(0, lastDist - lastTs);
          totalSTA = currentSTA + finalTangentDist;

          criticalStations.push({
            code: "Akhir (" + lastPI.name + ")",
            piName: lastPI.name,
            pointType: "Akhir",
            sta: totalSTA,
            staFormatted: formatSTA(totalSTA),
            lat: lastPI.lat,
            lon: lastPI.lon,
            x: lastPI.x,
            y: lastPI.y,
            partialDist: finalTangentDist,
            cumulativeDist: totalSTA,
            desc: "Titik Akhir Trase Proyek Jalan"
          });
        }

        return { segments: results, curves: curveResults, criticalStations, totalSTA };
      }, [piList, Vd, emax, en, laneWidth, C, kelandaianRelatifM, Rmin, RminFC]);

      // 7. Evaluasi Alinyemen Vertikal
      const vertCalc = useMemo(() => {
        let results = [];
        let curves = [];

        // Hitung kelandaian g antar PVI
        for (let i = 0; i < pviList.length - 1; i++) {
          const p1 = pviList[i];
          const p2 = pviList[i + 1];
          const dSta = p2.sta - p1.sta;
          const dZ = p2.zDesign - p1.zDesign;
          const g = dSta !== 0 ? (dZ / dSta) * 100 : 0; // dalam persen (%)

          results.push({
            index: i,
            from: p1.name,
            to: p2.name,
            dSta,
            dZ,
            g: g.toFixed(2),
            gVal: g
          });
        }

        // Hitung lengkung vertikal di setiap PVI antara
        for (let i = 1; i < pviList.length - 1; i++) {
          const pvi = pviList[i];
          const g1 = results[i - 1].gVal;
          const g2 = results[i].gVal;
          const A = Math.abs(g1 - g2); // Beda aljabar kelandaian (%)
          const isCrest = g1 > g2; // Cembung jika g1 > g2, Cekung jika g1 < g2
          const curveType = isCrest ? "Cembung (Crest)" : "Cekung (Sag)";

          // Kebutuhan Lv berdasarkan Waktu Tempuh 3 detik (Kenyamanan visual)
          const Lv_visual = Math.ceil((Vd * 3) / 3.6);

          // Kebutuhan Lv berdasarkan Jarak Pandang Henti (JPH)
          const S = sightDistances.JPH;
          let Lv_JPH = 0;
          if (isCrest) {
            // Cembung PDGJ: Lv = (A * S^2) / 658
            Lv_JPH = Math.ceil((A * S * S) / 658);
          } else {
            // Cekung PDGJ (Lampu sorot mobil h=0.6m, pancaran 1 deg): Lv = (A * S^2) / (120 + 3.5 * S)
            Lv_JPH = Math.ceil((A * S * S) / (120 + 3.5 * S));
          }

          // Syarat drainase lengkung datar (A kecil)
          const Lv_min_std = Math.max(Lv_visual, Math.min(300, Math.ceil(A * 15)));
          const Lv_rec = Math.max(Lv_min_std, Lv_JPH);

          const Lv = pvi.Lv > 0 ? pvi.Lv : Math.ceil(Lv_rec / 10) * 10;

          // Pergeseran vertikal titik puncak/lembah Ev
          // Ev = (A * Lv) / 800 (dalam meter)
          const Ev = (A * Lv) / 800;

          // Stationing PLV dan PTV
          const staPLV = pvi.sta - Lv / 2;
          const staPTV = pvi.sta + Lv / 2;

          // Elevasi PLV dan PTV
          const zPLV = pvi.zDesign - (g1 / 100) * (Lv / 2);
          const zPTV = pvi.zDesign + (g2 / 100) * (Lv / 2);

          // Jarak titik ekstrim (puncak/lembah) dari PLV
          // xm = (g1 * Lv) / (g1 - g2)
          let xm = 0;
          let zEkstrim = null;
          let staEkstrim = null;
          if (g1 * g2 < 0) { // Berbeda tanda -> terdapat titik puncak/lembah
            xm = (Math.abs(g1) * Lv) / A;
            staEkstrim = staPLV + xm;
            // Elevasi pada xm: y = (A / (200 * Lv)) * xm^2
            const y = (A / (200 * Lv)) * xm * xm;
            zEkstrim = isCrest ? zPLV + (g1 / 100) * xm - y : zPLV + (g1 / 100) * xm + y;
          }

          // Validasi & Peringatan Standar
          let isWarning = false;
          let warningMsg = [];

          if (Lv < Lv_visual) {
            isWarning = true;
            warningMsg.push(`Lv (${Lv}m) < batas kenyamanan visual 3 detik (${Lv_visual}m).`);
          }
          if (Lv < Lv_JPH) {
            isWarning = true;
            warningMsg.push(`Lv (${Lv}m) < batas Jarak Pandang Henti (${Lv_JPH}m). Bahaya titik buta!`);
          }
          if (staPLV < pviList[i - 1].sta || staPTV > pviList[i + 1].sta) {
            isWarning = true;
            warningMsg.push("Panjang Lv melebihi jarak antar PVI (tumpang tindih vertikal)!");
          }

          curves.push({
            pviName: pvi.name,
            staPVI: pvi.sta,
            zPVI: pvi.zDesign,
            g1: g1.toFixed(2),
            g2: g2.toFixed(2),
            A: A.toFixed(2),
            curveType,
            Lv,
            Lv_rec,
            Lv_visual,
            Lv_JPH,
            Ev: Ev.toFixed(3),
            staPLV,
            staPTV,
            zPLV: zPLV.toFixed(3),
            zPTV: zPTV.toFixed(3),
            staEkstrim: staEkstrim !== null ? formatSTA(staEkstrim) : null,
            zEkstrim: zEkstrim !== null ? zEkstrim.toFixed(3) : null,
            isWarning,
            warningMsg
          });
        }

        return { segments: results, curves };
      }, [pviList, Vd, sightDistances]);

      // 8. Stationing-by-Stationing Profile & Cut/Fill Calculations
      const profileData = useMemo(() => {
        if (pviList.length < 2) return [];

        const totalSta = pviList[pviList.length - 1].sta;
        let points = [];
        const interval = 50; // interval 50m

        // Kumpulkan semua sta penting (interval + PVI + PLV + PTV)
        let staSet = new Set();
        for (let s = 0; s <= totalSta; s += interval) {
          staSet.add(s);
        }
        staSet.add(totalSta);
        pviList.forEach(p => staSet.add(p.sta));
        vertCalc.curves.forEach(c => {
          if (c.staPLV >= 0 && c.staPLV <= totalSta) staSet.add(Math.round(c.staPLV));
          if (c.staPTV >= 0 && c.staPTV <= totalSta) staSet.add(Math.round(c.staPTV));
        });

        const sortedSta = Array.from(staSet).sort((a, b) => a - b);

        sortedSta.forEach(s => {
          // Cari elevasi tanah asli Zground dengan interpolasi linier antar PVI
          let zGround = 0;
          for (let i = 0; i < pviList.length - 1; i++) {
            if (s >= pviList[i].sta && s <= pviList[i + 1].sta) {
              const ratio = (s - pviList[i].sta) / (pviList[i + 1].sta - pviList[i].sta);
              zGround = pviList[i].zGround + ratio * (pviList[i + 1].zGround - pviList[i].zGround);
              break;
            }
          }

          // Hitung Elevasi Rencana Jalan Zdesign
          let zDesign = 0;
          // Cari apakah sta ini berada dalam lengkung vertikal
          let inCurve = null;
          for (const c of vertCalc.curves) {
            if (s >= c.staPLV && s <= c.staPTV) {
              inCurve = c;
              break;
            }
          }

          if (inCurve) {
            // Rumus parabola lengkung vertikal:
            // x = s - staPLV
            // z(x) = zPLV + (g1 / 100) * x + (A / (200 * Lv)) * x^2 * sign
            const x = s - inCurve.staPLV;
            const g1 = parseFloat(inCurve.g1);
            const g2 = parseFloat(inCurve.g2);
            const Lv = inCurve.Lv;
            const zPLV = parseFloat(inCurve.zPLV);
            // Parabola: z = zPLV + (g1/100)*x + ((g2 - g1) / (200 * Lv)) * x^2
            zDesign = zPLV + (g1 / 100) * x + ((g2 - g1) / (200 * Lv)) * x * x;
          } else {
            // Pada garis tangen
            for (let i = 0; i < pviList.length - 1; i++) {
              if (s >= pviList[i].sta && s <= pviList[i + 1].sta) {
                const g = vertCalc.segments[i].gVal;
                zDesign = pviList[i].zDesign + (g / 100) * (s - pviList[i].sta);
                break;
              }
            }
          }

          const deltaZ = zDesign - zGround;
          const status = deltaZ > 0.05 ? "Timbunan (Fill)" : deltaZ < -0.05 ? "Galian (Cut)" : "Pass (Sesuai)";

          points.push({
            sta: s,
            staFormatted: formatSTA(s),
            zGround: parseFloat(zGround.toFixed(2)),
            zDesign: parseFloat(zDesign.toFixed(2)),
            deltaZ: parseFloat(deltaZ.toFixed(2)),
            absDeltaZ: Math.abs(parseFloat(deltaZ.toFixed(2))),
            status
          });
        });

        return points;
      }, [pviList, vertCalc]);

      // Total Cut and Fill Volume Estimate (Perhitungan Kasar Volume Penampang Tipikal)
      const earthworkVolume = useMemo(() => {
        let totalCut = 0;
        let totalFill = 0;
        const b = laneWidth * 2 + 3.0; // Lebar badan jalan + bahu (misal 2 lajur + bahu 1.5m x 2)

        for (let i = 0; i < profileData.length - 1; i++) {
          const p1 = profileData[i];
          const p2 = profileData[i + 1];
          const L = p2.sta - p1.sta;

          // Luas penampang trapesium sederhana: A = b*h + m*h^2 (slope 1:1.5)
          const calcArea = (h) => {
            if (h <= 0) return 0;
            return b * h + 1.25 * h * h;
          };

          const h1Cut = p1.deltaZ < 0 ? Math.abs(p1.deltaZ) : 0;
          const h2Cut = p2.deltaZ < 0 ? Math.abs(p2.deltaZ) : 0;
          const aCut = (calcArea(h1Cut) + calcArea(h2Cut)) / 2;
          totalCut += aCut * L;

          const h1Fill = p1.deltaZ > 0 ? p1.deltaZ : 0;
          const h2Fill = p2.deltaZ > 0 ? p2.deltaZ : 0;
          const aFill = (calcArea(h1Fill) + calcArea(h2Fill)) / 2;
          totalFill += aFill * L;
        }

        return {
          totalCut: Math.round(totalCut),
          totalFill: Math.round(totalFill)
        };
      }, [profileData, laneWidth]);

      // --- CANVAS DRAWING (LONGITUDINAL PROFILE) ---
      const profileCanvasRef = useRef(null);
      const [hoverPoint, setHoverPoint] = useState(null);

      useEffect(() => {
        const canvas = profileCanvasRef.current;
        if (!canvas || profileData.length === 0) return;
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        ctx.clearRect(0, 0, width, height);

        const padLeft = 85;
        const padRight = 40;
        const padTop = 40;
        const padBottom = 65;

        const maxSta = profileData[profileData.length - 1].sta;
        const minZ = Math.floor(Math.min(...profileData.map(p => Math.min(p.zGround, p.zDesign))) - 3);
        const maxZ = Math.ceil(Math.max(...profileData.map(p => Math.max(p.zGround, p.zDesign))) + 4);

        const mapX = (s) => padLeft + ((s / maxSta) * (width - padLeft - padRight));
        const mapY = (z) => height - padBottom - (((z - minZ) / (maxZ - minZ)) * (height - padTop - padBottom));

        // Draw Background & Grid
        ctx.fillStyle = darkMode ? '#0f172a' : '#ffffff';
        ctx.fillRect(0, 0, width, height);

        // Horizontal Grid (Elevation)
        ctx.lineWidth = 1;
        ctx.strokeStyle = darkMode ? '#1e293b' : '#e2e8f0';
        ctx.fillStyle = darkMode ? '#94a3b8' : '#64748b';
        ctx.font = '11px JetBrains Mono';
        ctx.textAlign = 'right';

        const zStep = Math.max(2, Math.round((maxZ - minZ) / 8));
        for (let z = minZ; z <= maxZ; z += zStep) {
          const y = mapY(z);
          ctx.beginPath();
          ctx.moveTo(padLeft, y);
          ctx.lineTo(width - padRight, y);
          ctx.stroke();
          ctx.fillText(`${z.toFixed(1)} m`, padLeft - 10, y + 4);
        }

        // Vertical Grid (Stationing)
        ctx.textAlign = 'center';
        const staStep = maxSta > 3000 ? 500 : 250;
        for (let s = 0; s <= maxSta; s += staStep) {
          const x = mapX(s);
          ctx.beginPath();
          ctx.moveTo(x, padTop);
          ctx.lineTo(x, height - padBottom);
          ctx.stroke();
          ctx.fillText(formatSTA(s), x, height - padBottom + 20);
        }

        // Axis Lines
        ctx.strokeStyle = darkMode ? '#475569' : '#94a3b8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(padLeft, padTop);
        ctx.lineTo(padLeft, height - padBottom);
        ctx.lineTo(width - padRight, height - padBottom);
        ctx.stroke();

        // Shading for Cut (Red/Orange) & Fill (Emerald/Green)
        for (let i = 0; i < profileData.length - 1; i++) {
          const p1 = profileData[i];
          const p2 = profileData[i + 1];
          const x1 = mapX(p1.sta);
          const x2 = mapX(p2.sta);
          const y1Design = mapY(p1.zDesign);
          const y2Design = mapY(p2.zDesign);
          const y1Ground = mapY(p1.zGround);
          const y2Ground = mapY(p2.zGround);

          ctx.beginPath();
          ctx.moveTo(x1, y1Design);
          ctx.lineTo(x2, y2Design);
          ctx.lineTo(x2, y2Ground);
          ctx.lineTo(x1, y1Ground);
          ctx.closePath();

          if (p1.deltaZ > 0 || p2.deltaZ > 0) {
            ctx.fillStyle = darkMode ? 'rgba(16, 185, 129, 0.25)' : 'rgba(16, 185, 129, 0.35)'; // Timbunan
          } else {
            ctx.fillStyle = darkMode ? 'rgba(239, 68, 68, 0.25)' : 'rgba(239, 68, 68, 0.35)'; // Galian
          }
          ctx.fill();
        }

        // Ground Line (dashed orange/amber)
        ctx.beginPath();
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2.5;
        ctx.setLineDash([5, 4]);
        profileData.forEach((p, idx) => {
          const x = mapX(p.sta);
          const y = mapY(p.zGround);
          if (idx === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
        ctx.setLineDash([]); // Reset dash

        // Design Road Elevation Line (Solid Blue)
        ctx.beginPath();
        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 3.5;
        profileData.forEach((p, idx) => {
          const x = mapX(p.sta);
          const y = mapY(p.zDesign);
          if (idx === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();

        // Draw PVI Markers
        pviList.forEach((p, idx) => {
          const x = mapX(p.sta);
          const y = mapY(p.zDesign);

          // Marker circle
          ctx.beginPath();
          ctx.arc(x, y, 5, 0, Math.PI * 2);
          ctx.fillStyle = '#dc2626';
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Label
          ctx.fillStyle = darkMode ? '#f8fafc' : '#1e293b';
          ctx.font = 'bold 11px Plus Jakarta Sans';
          ctx.textAlign = 'center';
          ctx.fillText(p.name, x, y - 12);
        });

        // Hover Indicator
        if (hoverPoint) {
          const hx = mapX(hoverPoint.sta);
          const hyDesign = mapY(hoverPoint.zDesign);
          const hyGround = mapY(hoverPoint.zGround);

          ctx.strokeStyle = darkMode ? '#cbd5e1' : '#334155';
          ctx.lineWidth = 1;
          ctx.setLineDash([3, 3]);
          ctx.beginPath();
          ctx.moveTo(hx, padTop);
          ctx.lineTo(hx, height - padBottom);
          ctx.stroke();
          ctx.setLineDash([]);

          // Circle on points
          ctx.fillStyle = '#0284c7';
          ctx.beginPath();
          ctx.arc(hx, hyDesign, 5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.arc(hx, hyGround, 5, 0, Math.PI * 2);
          ctx.fill();
        }

      }, [profileData, pviList, darkMode, hoverPoint]);

      // Handle Mouse Move over Profile Canvas
      const handleProfileMouseMove = (e) => {
        const canvas = profileCanvasRef.current;
        if (!canvas || profileData.length === 0) return;
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const padLeft = 85;
        const padRight = 40;
        const maxSta = profileData[profileData.length - 1].sta;

        const effectiveX = Math.max(padLeft, Math.min(canvas.width - padRight, mouseX));
        const estimatedSta = ((effectiveX - padLeft) / (canvas.width - padLeft - padRight)) * maxSta;

        // Find nearest point
        let nearest = profileData[0];
        let minDiff = Infinity;
        profileData.forEach(p => {
          const diff = Math.abs(p.sta - estimatedSta);
          if (diff < minDiff) {
            minDiff = diff;
            nearest = p;
          }
        });

        setHoverPoint(nearest);
      };

      // --- CANVAS DRAWING (HORIZONTAL ALIGNMENT PLAN) ---
      const horizCanvasRef = useRef(null);

      useEffect(() => {
        const canvas = horizCanvasRef.current;
        if (!canvas || piList.length === 0) return;
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        ctx.clearRect(0, 0, width, height);

        const pad = 60;
        const allX = piList.map(p => p.x);
        const allY = piList.map(p => p.y);
        const minX = Math.min(...allX);
        const maxX = Math.max(...allX);
        const minY = Math.min(...allY);
        const maxY = Math.max(...allY);

        const spanX = Math.max(100, maxX - minX);
        const spanY = Math.max(100, maxY - minY);

        // Aspect ratio maintain
        const scaleX = (width - 2 * pad) / spanX;
        const scaleY = (height - 2 * pad) / spanY;
        const scale = Math.min(scaleX, scaleY);

        const centerX = (minX + maxX) / 2;
        const centerY = (minY + maxY) / 2;

        const mapCoordX = (x) => width / 2 + (x - centerX) * scale;
        const mapCoordY = (y) => height / 2 - (y - centerY) * scale; // Invert Y for cartesian

        // Canvas Background
        ctx.fillStyle = darkMode ? '#0f172a' : '#f8fafc';
        ctx.fillRect(0, 0, width, height);

        // Grid Background
        ctx.strokeStyle = darkMode ? '#1e293b' : '#e2e8f0';
        ctx.lineWidth = 1;
        for (let x = 0; x < width; x += 50) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }
        for (let y = 0; y < height; y += 50) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }

        // Draw Tangent Lines (Dashed Gray)
        ctx.beginPath();
        ctx.strokeStyle = darkMode ? '#64748b' : '#94a3b8';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        piList.forEach((p, idx) => {
          const cx = mapCoordX(p.x);
          const cy = mapCoordY(p.y);
          if (idx === 0) ctx.moveTo(cx, cy);
          else ctx.lineTo(cx, cy);
        });
        ctx.stroke();
        ctx.setLineDash([]);

        // Draw Curved Road Centerline (Smooth Solid Blue)
        ctx.beginPath();
        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 4;
        piList.forEach((p, idx) => {
          const cx = mapCoordX(p.x);
          const cy = mapCoordY(p.y);
          if (idx === 0) {
            ctx.moveTo(cx, cy);
          } else if (idx === piList.length - 1) {
            ctx.lineTo(cx, cy);
          } else {
            // Approximating the curve arc using quadratic/bezier toward PI
            const prev = piList[idx - 1];
            const next = piList[idx + 1];
            const prevX = mapCoordX(prev.x);
            const prevY = mapCoordY(prev.y);
            const nextX = mapCoordX(next.x);
            const nextY = mapCoordY(next.y);

            const midPrevX = (prevX + cx) / 2;
            const midPrevY = (prevY + cy) / 2;
            const midNextX = (cx + nextX) / 2;
            const midNextY = (cy + nextY) / 2;

            ctx.lineTo(midPrevX, midPrevY);
            ctx.quadraticCurveTo(cx, cy, midNextX, midNextY);
          }
        });
        ctx.stroke();

        // Draw PI Points, Circles, & Labels
        piList.forEach((p, idx) => {
          const cx = mapCoordX(p.x);
          const cy = mapCoordY(p.y);

          // Dot
          ctx.beginPath();
          ctx.arc(cx, cy, 6, 0, Math.PI * 2);
          ctx.fillStyle = idx === 0 || idx === piList.length - 1 ? '#10b981' : '#ef4444';
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();

          // Label
          ctx.fillStyle = darkMode ? '#f8fafc' : '#0f172a';
          ctx.font = 'bold 12px Plus Jakarta Sans';
          ctx.textAlign = 'center';
          ctx.fillText(`${p.name}`, cx, cy - 14);

          // Sub-label (Coordinates & Radius)
          ctx.font = '10px JetBrains Mono';
          ctx.fillStyle = darkMode ? '#94a3b8' : '#64748b';
          const subText = p.R > 0 ? `(${p.x}, ${p.y}) R=${p.R}m` : `(${p.x}, ${p.y})`;
          ctx.fillText(subText, cx, cy + 20);
        });

        // Compass Rose / North Arrow
        const arrowX = width - 40;
        const arrowY = 45;
        ctx.beginPath();
        ctx.moveTo(arrowX, arrowY - 20);
        ctx.lineTo(arrowX - 8, arrowY + 12);
        ctx.lineTo(arrowX, arrowY + 6);
        ctx.lineTo(arrowX + 8, arrowY + 12);
        ctx.closePath();
        ctx.fillStyle = '#dc2626';
        ctx.fill();

        ctx.font = 'bold 11px Plus Jakarta Sans';
        ctx.fillStyle = darkMode ? '#f8fafc' : '#0f172a';
        ctx.textAlign = 'center';
        ctx.fillText('U', arrowX, arrowY - 25);

      }, [piList, darkMode]);

      // --- GEODETIC CONVERSION & GOOGLE EARTH INTEGRATION ---
      const getGeoCoord = (x, y) => {
        const match = piList.find(p => p.x === x && p.y === y);
        if (match && match.lat !== undefined && match.lon !== undefined) {
          return { lat: match.lat, lon: match.lon };
        }
        const pi0 = piList[0] || { x: 1000, y: 1000, lat: geoAnchor.lat, lon: geoAnchor.lon };
        const baseLat = pi0.lat || geoAnchor.lat;
        const baseLon = pi0.lon || geoAnchor.lon;
        const dx = x - pi0.x;
        const dy = y - pi0.y;
        const latRad = (baseLat * Math.PI) / 180;
        const m_per_deg_lat = 111132.954 - 559.822 * Math.cos(2 * latRad) + 1.175 * Math.cos(4 * latRad);
        const m_per_deg_lon = 111412.84 * Math.cos(latRad) - 93.5 * Math.cos(3 * latRad);
        return {
          lat: baseLat + dy / m_per_deg_lat,
          lon: baseLon + dx / m_per_deg_lon
        };
      };

      // Generate smooth path coordinates along the road alignment
      const getRoadCenterlineGeoPoints = () => {
        let geoPoints = [];
        if (piList.length < 2) return geoPoints;

        for (let i = 0; i < piList.length; i++) {
          const p = piList[i];
          if (i === 0 || i === piList.length - 1) {
            const geo = getGeoCoord(p.x, p.y);
            geoPoints.push({ x: p.x, y: p.y, lat: geo.lat, lon: geo.lon, name: p.name });
          } else {
            const prev = piList[i - 1];
            const next = piList[i + 1];
            const midPrevX = (prev.x + p.x) / 2;
            const midPrevY = (prev.y + p.y) / 2;
            const midNextX = (p.x + next.x) / 2;
            const midNextY = (p.y + next.y) / 2;

            const steps = 15;
            for (let t = 0; t <= 1; t += 1 / steps) {
              const u = 1 - t;
              const curX = u * u * midPrevX + 2 * u * t * p.x + t * t * midNextX;
              const curY = u * u * midPrevY + 2 * u * t * p.y + t * t * midNextY;
              const geo = getGeoCoord(curX, curY);
              geoPoints.push({ x: curX, y: curY, lat: geo.lat, lon: geo.lon, name: `Arc ${p.name}` });
            }
          }
        }
        return geoPoints;
      };

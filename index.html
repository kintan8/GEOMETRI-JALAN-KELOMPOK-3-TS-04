                                  <span className="text-slate-400">-</span>
                                )}
                              </td>

                              {/* AKSI */}
                              <td className="px-3 py-2.5 text-center">
                                <div className="flex items-center justify-center space-x-1">
                                  <a
                                    href={gmapsUrl}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 rounded text-slate-500 hover:text-emerald-600 transition"
                                    title="Buka titik ini di Google Maps"
                                  >
                                    📍
                                  </a>
                                  {!isEndpoint && (
                                    <button
                                      type="button"
                                      onClick={() => setPiList(piList.filter(p => p.id !== pi.id))}
                                      className="p-1.5 hover:bg-red-50 dark:hover:bg-red-950 rounded text-slate-400 hover:text-red-500 transition"
                                      title="Hapus Titik PI ini"
                                    >
                                      ✕
                                    </button>
                                  )}
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>

                </div>

                {/* JENDELA PRATINJAU POSISI KOORDINAT DI GOOGLE EARTH (LIVE PREVIEW WINDOW) */}
                <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-800">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-4 mb-4 border-b border-slate-100 dark:border-slate-800 gap-2">
                    <div>
                      <div className="flex items-center space-x-2">
                        <span className="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
                        <h4 className="text-base font-bold text-slate-900 dark:text-white">
                          Jendela Pratinjau Posisi Koordinat &amp; Denah Trase di Google Earth
                        </h4>
                        <span className="px-2 py-0.5 text-[10px] font-bold rounded bg-blue-100 text-blue-800 dark:bg-blue-900/60 dark:text-blue-300">
                          Live Satellite Window
                        </span>
                      </div>
                      <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                        Lihat langsung posisi koordinat yang Anda masukkan di atas citra satelit resolusi tinggi. <strong>Klik pada peta</strong> untuk menambah titik PI baru secara presisi!
                      </p>
                    </div>

                    <div className="flex items-center space-x-3 text-xs">
                      <div className="flex items-center space-x-1.5">
                        <span className="w-3.5 h-1 bg-amber-500 inline-block border-b border-dashed"></span>
                        <span className="text-slate-600 dark:text-slate-400">Garis Tangen</span>
                      </div>
                      <div className="flex items-center space-x-1.5">
                        <span className="w-3.5 h-1 bg-blue-600 inline-block"></span>
                        <span className="text-slate-600 dark:text-slate-400">Lengkung Jalan</span>
                      </div>
                    </div>
                  </div>

                  {/* MAP CONTAINER */}
                  <div className="relative rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-800 shadow-inner">
                    <div
                      ref={inputMapContainerRef}
                      style={{ height: '420px', width: '100%' }}
                      className="z-10"
                    ></div>

                    {/* LIVE CURSOR COORDINATE BAR */}
                    <div className="absolute bottom-2.5 left-2.5 z-20 bg-slate-900/85 text-white px-3 py-1.5 rounded-lg text-xs font-mono backdrop-blur pointer-events-none border border-slate-700/60 shadow">
                      {cursorCoords ? (
                        <span className="flex flex-wrap items-center gap-2">
                          <span>📍 <strong>{toDMS(cursorCoords.lat, true).text}</strong>, <strong>{toDMS(cursorCoords.lon, false).text}</strong></span>
                          <span className="px-1.5 py-0.5 rounded text-[10px] bg-indigo-900/80 text-indigo-200 font-bold border border-indigo-700 font-mono">
                            {latLonToUtm(cursorCoords.lat, cursorCoords.lon).zoneStr} | X: {latLonToUtm(cursorCoords.lat, cursorCoords.lon).easting.toFixed(0)}m E, Y: {latLonToUtm(cursorCoords.lat, cursorCoords.lon).northing.toFixed(0)}m N
                          </span>
                        </span>
                      ) : (
                        <span className="text-slate-400">Gerakkan mouse di atas peta untuk membaca koordinat Derajat (DMS) &amp; Zona UTM</span>
                      )}
                    </div>
                  </div>
                </div>

                {/* TABEL RANGKUMAN STATIONING TITIK-TITIK KRITIS ALINYEMEN HORIZONTAL */}
                <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-800">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-4 mb-4 border-b border-slate-100 dark:border-slate-800 gap-2">
                    <div>
                      <div className="flex items-center space-x-2">
                        <span className="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
                        <h4 className="text-base font-bold text-slate-900 dark:text-white">
                          Rangkuman Hasil Stationing (STA) Titik-Titik Kritis Trase Jalan
                        </h4>
                        <span className="px-2 py-0.5 text-[10px] font-bold rounded bg-indigo-100 text-indigo-800 dark:bg-indigo-900/60 dark:text-indigo-300">
                          PDGJ 2021 &amp; Sukirman
                        </span>
                      </div>
                      <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                        Daftar stasioning resmi sepanjang sumbu jalan mulai dari Titik Awal (0+000) hingga Titik Akhir ({formatSTA(horizCalc.totalSTA)}).
                      </p>
                    </div>

                    <div className="text-right">
                      <span className="text-xs text-slate-500 dark:text-slate-400 block">Panjang Total Sumbu Jalan:</span>
                      <strong className="text-base font-mono font-bold text-blue-600 dark:text-blue-400">
                        {horizCalc.totalSTA ? `${horizCalc.totalSTA.toFixed(2)} meter (${formatSTA(horizCalc.totalSTA)})` : '-'}
                      </strong>
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="min-w-full text-xs text-left">
                      <thead className="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 uppercase font-semibold">
                        <tr>
                          <th className="px-3.5 py-2.5 rounded-l-lg">Titik Kritis</th>
                          <th className="px-3.5 py-2.5">Tipe Titik</th>
                          <th className="px-3.5 py-2.5 font-bold text-blue-900 dark:text-blue-300">Stationing Resmi (STA)</th>
                          <th className="px-3.5 py-2.5">Jarak Parsial (m)</th>
                          <th className="px-3.5 py-2.5">Jarak Kumulatif (m)</th>
                          <th className="px-3.5 py-2.5">Latitude (WGS84)</th>
                          <th className="px-3.5 py-2.5">Longitude (WGS84)</th>
                          <th className="px-3.5 py-2.5 rounded-r-lg">Keterangan Teknis Geometrik</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                        {(horizCalc.criticalStations || []).map((cs, cIdx) => (
                          <tr key={cIdx} className="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                            <td className="px-3.5 py-2 font-bold text-slate-900 dark:text-white font-mono">
                              {cs.code}
                            </td>
                            <td className="px-3.5 py-2">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-semibold ${
                                cs.pointType.includes('Awal') || cs.pointType.includes('Akhir')
                                  ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300'
                                  : cs.pointType.includes('TS') || cs.pointType.includes('ST')
                                  ? 'bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300'
                                  : 'bg-blue-100 text-blue-800 dark:bg-blue-950/60 dark:text-blue-300'
                              }`}>
                                {cs.pointType}
                              </span>
                            </td>
                            <td className="px-3.5 py-2 font-mono font-bold text-blue-600 dark:text-blue-400">
                              {cs.staFormatted}
                            </td>
                            <td className="px-3.5 py-2 font-mono text-slate-600 dark:text-slate-400">
                              {cs.partialDist > 0 ? `${cs.partialDist.toFixed(2)} m` : '-'}
                            </td>
                            <td className="px-3.5 py-2 font-mono text-slate-800 dark:text-slate-200">
                              {cs.cumulativeDist.toFixed(2)} m
                            </td>
                            <td className="px-3.5 py-2 font-mono text-emerald-600 dark:text-emerald-400">
                              {cs.lat ? `${cs.lat.toFixed(6)}°` : '-'}
                            </td>
                            <td className="px-3.5 py-2 font-mono text-emerald-600 dark:text-emerald-400">
                              {cs.lon ? `${cs.lon.toFixed(6)}°` : '-'}
                            </td>
                            <td className="px-3.5 py-2 text-slate-600 dark:text-slate-300 text-[11px]">
                              {cs.desc}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* TABEL KOORDINAT PVI VERTIKAL */}
                <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-800">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-4 mb-4 border-b border-slate-100 dark:border-slate-800 gap-2">
                    <div>
                      <h3 className="text-base font-bold text-slate-900 dark:text-white flex items-center">
                        <span className="w-2.5 h-2.5 rounded-full bg-indigo-500 mr-2"></span>
                        Tabel Point of Vertical Intersection (PVI) & Elevasi
                      </h3>
                      <p className="text-xs text-slate-500 dark:text-slate-400">
                        Input Stationing (STA), Elevasi Rencana Jalan (Z Design), dan Elevasi Tanah Asli (Z Ground).
                      </p>
                    </div>
                    <button
                      onClick={handleAddPVI}
                      className="inline-flex items-center px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-50 text-indigo-700 hover:bg-indigo-100 dark:bg-indigo-900/40 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800 transition"
                    >
                      <IconPlus /> Tambah Titik PVI
                    </button>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="min-w-full text-xs text-left">
                      <thead className="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 uppercase font-semibold">
                        <tr>
                          <th className="px-3 py-2.5 rounded-l-lg">Titik PVI</th>
                          <th className="px-3 py-2.5">Stationing (STA m)</th>
                          <th className="px-3 py-2.5">Elevasi Rencana Z (m)</th>
                          <th className="px-3 py-2.5">Elevasi Tanah Asli Z (m)</th>
                          <th className="px-3 py-2.5">Panjang Lv (m)</th>
                          <th className="px-3 py-2.5 rounded-r-lg text-center">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                        {pviList.map((pvi, idx) => {
                          const isEndpoint = idx === 0 || idx === pviList.length - 1;
                          return (
                            <tr key={pvi.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                              <td className="px-3 py-2 font-bold text-slate-900 dark:text-white">
                                {pvi.name}
                              </td>
                              <td className="px-3 py-2">
                                <input
                                  type="number"
                                  value={pvi.sta}
                                  onChange={(e) => {
                                    const val = Number(e.target.value);
                                    setPviList(pviList.map(p => p.id === pvi.id ? { ...p, sta: val } : p));
                                  }}
                                  className="w-24 px-2 py-1 text-xs rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 font-mono"
                                />
                                <span className="text-[10px] text-slate-400 ml-1">({formatSTA(pvi.sta)})</span>
                              </td>
                              <td className="px-3 py-2">
                                <input
                                  type="number"
                                  step="0.1"
                                  value={pvi.zDesign}
                                  onChange={(e) => {
                                    const val = Number(e.target.value);
                                    setPviList(pviList.map(p => p.id === pvi.id ? { ...p, zDesign: val } : p));
                                  }}
                                  className="w-24 px-2 py-1 text-xs rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 font-mono"
                                />
                              </td>
                              <td className="px-3 py-2">
                                <input
                                  type="number"
                                  step="0.1"
                                  value={pvi.zGround}
                                  onChange={(e) => {
                                    const val = Number(e.target.value);
                                    setPviList(pviList.map(p => p.id === pvi.id ? { ...p, zGround: val } : p));
                                  }}
                                  className="w-24 px-2 py-1 text-xs rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 font-mono"
                                />
                              </td>
                              <td className="px-3 py-2">
                                {isEndpoint ? (
                                  <span className="text-slate-400 italic">- Titik Ujung -</span>
                                ) : (
                                  <input
                                    type="number"
                                    value={pvi.Lv}
                                    onChange={(e) => {
                                      const val = Number(e.target.value);
                                      setPviList(pviList.map(p => p.id === pvi.id ? { ...p, Lv: val } : p));
                                    }}
                                    className="w-24 px-2 py-1 text-xs rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 font-mono"
                                  />
                                )}
                              </td>
                              <td className="px-3 py-2 text-center">
                                {!isEndpoint && pviList.length > 3 && (
                                  <button
                                    onClick={() => setPviList(pviList.filter(p => p.id !== pvi.id))}
                                    className="p-1 hover:bg-red-50 dark:hover:bg-red-950 rounded"
                                    title="Hapus PVI"
                                  >
                                    <IconTrash />
                                  </button>
                                )}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>
            )}

            {/* TAB 2: SISTEM REKOMENDASI PAKAR (PROS-CONS EXPERT SYSTEM) */}
            {activeTab === 'expert' && (
              <div className="space-y-6">

                <div className="bg-gradient-to-br from-amber-500/10 via-amber-500/5 to-transparent border border-amber-300 dark:border-amber-800/80 rounded-2xl p-6 shadow-sm">
                  <div className="flex items-start space-x-3">
                    <div className="p-3 bg-amber-500 text-white rounded-xl shadow-md">
                      <IconBulb />
                    </div>
                    <div>
                      <h3 className="text-lg font-bold text-slate-900 dark:text-white">
                        Sistem Pakar Perencanaan Geometrik (PDGJ 2021 & Silvia Sukirman)
                      </h3>
                      <p className="text-sm text-slate-600 dark:text-slate-400 mt-1">
                        Modul inferensi otomatis mengevaluasi parameter pengguna berdasarkan batasan kinematika kendaraan, kestabilan dinamik, dan kriteria kenyamanan pengemudi.
                      </p>
                    </div>
                  </div>
                </div>

                {/* 4 EXPERT ADVICE CARDS */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">

                  {/* 1. Rekomendasi R_min */}
                  <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-800 flex flex-col justify-between">
                    <div>
                      <div className="flex items-center justify-between mb-3">
                        <span className="text-xs font-bold text-blue-600 dark:text-blue-400 uppercase tracking-wider">
                          Kriteria 1 • Radius Minimum
                        </span>
                        <span className="px-2 py-0.5 text-xs font-mono bg-blue-50 dark:bg-blue-950 text-blue-700 dark:text-blue-300 rounded">
                          R_min = {Rmin} m
                        </span>
                      </div>
                      <h4 className="text-base font-bold text-slate-900 dark:text-white mb-2">
                        Rekomendasi Jari-Jari Lengkung Horizontal (R)
                      </h4>
                      <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed mb-4">
                        Perhitungan matematis menunjukkan batas mutlak <strong>R_min = {Rmin} m</strong> pada Vd = {Vd} km/jam dan e_max = {(emax*100)}%. 
                        Sangat disarankan menggunakan <strong>R aktual yang jauh lebih besar dari {Rmin} m</strong> (misal {Math.ceil(Rmin * 1.5)} m hingga {Math.ceil(Rmin * 2.5)} m).
                      </p>
                    </div>

                    <div className="space-y-2 pt-3 border-t border-slate-100 dark:border-slate-800 text-xs">
                      <div className="p-2.5 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/60 rounded-xl">
                        <strong className="text-emerald-800 dark:text-emerald-300 font-bold block mb-0.5">👍 Keunggulan (Plus):</strong>
                        <span className="text-slate-700 dark:text-slate-300">
                          Kendaraan tidak murni mengandalkan gaya gesek melintang maksimum sehingga jauh lebih aman, nyaman, tingkat keausan ban rendah, dan kebutuhan superelevasi lebih landai (tidak ekstrim).
                        </span>
                      </div>
                      <div className="p-2.5 bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800/60 rounded-xl">
                        <strong className="text-rose-800 dark:text-rose-300 font-bold block mb-0.5">⚠️ Kelemahan (Minus):</strong>
                        <span className="text-slate-700 dark:text-slate-300">
                          Membutuhkan ruang pembebasan lahan yang lebih luas dan sering berbenturan dengan kontur jurang/tebing pada medan berbukit atau pegunungan.
                        </span>
                      </div>
                    </div>
                  </div>

                  {/* 2. Rekomendasi Ls 3 Kriteria */}
                  <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-800 flex flex-col justify-between">
                    <div>
                      <div className="flex items-center justify-between mb-3">
                        <span className="text-xs font-bold text-amber-600 dark:text-amber-400 uppercase tracking-wider">
                          Kriteria 2 • Panjang Peralihan Ls
                        </span>
                        <span className="px-2 py-0.5 text-xs font-mono bg-amber-50 dark:bg-amber-950 text-amber-700 dark:text-amber-300 rounded">
                          3 Kriteria Standar
                        </span>
                      </div>
                      <h4 className="text-base font-bold text-slate-900 dark:text-white mb-2">
                        Evaluasi 3 Kriteria Panjang Spiral (Ls)
                      </h4>
                      <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed mb-3">
                        Berdasarkan PDGJ 2021 dan Buku Silvia Sukirman, panjang lengkung peralihan Ls ditentukan dari nilai maksimum 3 kriteria teknis:
                      </p>

                      <div className="grid grid-cols-3 gap-2 mb-4 text-center">
                        <div className="p-2 bg-slate-50 dark:bg-slate-800 rounded-lg">
                          <span className="text-[10px] text-slate-400 block">Modifikasi Shortt</span>
                          <span className="text-xs font-bold font-mono text-slate-900 dark:text-white">
                            {horizCalc.curves[0] ? `${horizCalc.curves[0].Ls1} m` : '40 m'}
                          </span>
                        </div>
                        <div className="p-2 bg-slate-50 dark:bg-slate-800 rounded-lg">
                          <span className="text-[10px] text-slate-400 block">Kelandaian Relatif</span>
                          <span className="text-xs font-bold font-mono text-slate-900 dark:text-white">
                            {horizCalc.curves[0] ? `${horizCalc.curves[0].Ls2} m` : '35 m'}
                          </span>
                        </div>
                        <div className="p-2 bg-slate-50 dark:bg-slate-800 rounded-lg">
                          <span className="text-[10px] text-slate-400 block">Waktu 3 Detik</span>
                          <span className="text-xs font-bold font-mono text-slate-900 dark:text-white">
                            {Math.ceil((Vd / 3.6) * 3)} m
                          </span>
                        </div>
                      </div>
                    </div>

                    <div className="p-3 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/60 rounded-xl text-xs">
                      <strong className="text-amber-900 dark:text-amber-300 font-bold block mb-1">💡 Saran Pakar Sipil:</strong>
                      <span className="text-slate-700 dark:text-slate-300">
                        "Gunakan nilai Ls terbesar dari ketiga kriteria tersebut dan <strong>bulatkan ke atas ke kelipatan 5 atau 10 meter</strong> (contoh: bila didapat 46.2m, gunakan Ls = 50m) untuk kemudahan patok batas dan pelaksanaan konstruksi di lapangan."
                      </span>
                    </div>
                  </div>

                  {/* 3. Rekomendasi Tipe Tikungan (FC / SCS / SS) */}
                  <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-800 flex flex-col justify-between">
                    <div>
                      <div className="flex items-center justify-between mb-3">
                        <span className="text-xs font-bold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider">

                        </p>
                      </div>

                    </div>

                </div>

              </div>

                {/* CANVAS 2: DENAH TRASE HORIZONTAL 2D */}

                    <canvas
                      ref={horizCanvasRef}

                      height={400}
                      className="w-full h-auto block"></canvas>
                  </div>
                </div>

              </div>

                      <button

                      <button
                        onClick={() => {
                          setCadCurveType('SS');
                          setCadParams(prev => ({ ...prev, name: 'Detail Tikungan (S-S)' }));

                        className={`px-3 py-1 rounded-lg font-bold transition ${
                          cadCurveType === 'SS'
                            ? 'bg-white dark:bg-slate-900 text-blue-600 dark:text-blue-400 shadow-sm'
                            : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'

                      </button>

                    {/* Load from Alignment PI */}
                    {horizCalc && horizCalc.curves && horizCalc.curves.length > 0 && (

                        onChange={(e) => {
                          const val = e.target.value;
                          if (val !== '') {

                          }
                        }}
                        className="text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-1 text-slate-700 dark:text-slate-300 font-medium"
                        defaultValue=""
                      >
                        <option value="" disabled>Pilih dari Trase PI...</option>

                          <option key={idx} value={c.piName}>
                            {c.piName} - {c.curveType} (R={c.R}m)
                          </option>
                        ))}
                      </select>
                    )}
                  </div>

                  <div className="flex items-center space-x-2">
                    <button
                      onClick={() => {
                        // Preset demo modal or sample DXF prompt
                        const choice = prompt("Pilih template gambar CAD:\n1. Standar Bina Marga F-C (R=1999m, Δ=11.5°)\n2. Pegunungan S-C-S (R=800m, Δ=24°, Ls=80m)\n3. Lembah Curam S-S (R=600m, Δ=8°, Ls=120m)\n\nKetik 1, 2, atau 3:", "1");
                        if (choice === "1") {
                          setCadCurveType('FC');
                          setCadParams({ R: 1999, delta: 11.5, Ls: 60, Vd: 60, name: "Detail Tikungan (F-C)" });
                        } else if (choice === "2") {
                          setCadCurveType('SCS');
                          setCadParams({ R: 800, delta: 24.0, Ls: 80, Vd: 60, name: "Detail Tikungan (S-C-S)" });
                        } else if (choice === "3") {
                          setCadCurveType('SS');
                          setCadParams({ R: 600, delta: 8.0, Ls: 120, Vd: 50, name: "Detail Tikungan (S-S)" });
                        }
                        setCadPan({ x: 0, y: 0 });
                        setCadZoom(1.0);
                        setSelectedEntity(null);
                      }}
                      className="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl border border-slate-200 dark:border-slate-700 transition"
                      title="Impor DXF / Template Vektor"
                    >
                      Impor DXF / SVG
                    </button>
                    <button
                      onClick={() => {
                        setCadPan({ x: 0, y: 0 });
                        setCadZoom(1.0);
                        setSelectedEntity(null);
                      }}
                      className="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl border border-slate-200 dark:border-slate-700 transition"
                      title="Reset posisi dan zoom gambar"
                    >
                      Reset Gambar
                    </button>
                  </div>
                </div>

                {/* OPENCAD STUDIO DRAWER / PARAMETER TUNER (WHEN EXPANDED) */}
                {showCadStudio && (
                  <div className="bg-gradient-to-r from-blue-50 via-indigo-50 to-slate-50 dark:from-slate-900 dark:via-blue-950/30 dark:to-slate-900 rounded-2xl p-5 shadow-sm border border-blue-200 dark:border-blue-900/60 animate-fadeIn">
                    <div className="flex items-center justify-between pb-3 mb-3 border-b border-blue-200 dark:border-slate-800">
                      <div className="flex items-center space-x-2">

                        </span>
                        <span className="text-[11px] bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300 px-2.5 py-0.5 rounded-full font-semibold">
                          Live Parametric Drafting
                        </span>
                      </div>
                      <button
                        onClick={() => setShowCadStudio(false)}
                        className="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-white font-bold px-2 py-1"
                      >
                        ✕ Tutup Panel
                      </button>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 text-xs">
                      <div>
                        <label className="font-bold text-slate-700 dark:text-slate-300 block mb-1">
                          Jari-jari Lengkung R (m):
                        </label>
                        <input
                          type="number"
                          min="50"
                          max="5000"
                          step="10"
                          value={cadParams.R}
                          onChange={(e) => setCadParams(prev => ({ ...prev, R: parseFloat(e.target.value) || 1000 }))}
                          className="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-1.5 font-mono text-slate-900 dark:text-white font-bold"
                        />
                        <span className="text-[10px] text-slate-500 mt-0.5 block">Standar Rmin: {Rmin} m</span>
                      </div>

                      <div>
                        <label className="font-bold text-slate-700 dark:text-slate-300 block mb-1">
                          Sudut Defleksi Δ (°):
                        </label>
                        <input
                          type="number"
                          min="1"
                          max="160"
                          step="0.5"
                          value={cadParams.delta}
                          onChange={(e) => setCadParams(prev => ({ ...prev, delta: parseFloat(e.target.value) || 11.5 }))}
                          className="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-1.5 font-mono text-slate-900 dark:text-white font-bold"
                        />
                        <span className="text-[10px] text-slate-500 mt-0.5 block">Sudut belokan tikungan</span>
                      </div>

                      <div>
                        <label className="font-bold text-slate-700 dark:text-slate-300 block mb-1">
                          Panjang Spiral Ls (m):
                        </label>
                        <input
                          type="number"
                          min="10"
                          max="300"
                          step="5"
                          disabled={cadCurveType === 'FC'}
                          value={cadCurveType === 'FC' ? 0 : cadParams.Ls}
                          onChange={(e) => setCadParams(prev => ({ ...prev, Ls: parseFloat(e.target.value) || 60 }))}
                          className={`w-full border rounded-lg px-3 py-1.5 font-mono font-bold ${
                            cadCurveType === 'FC'
                              ? 'bg-slate-100 text-slate-400 dark:bg-slate-800/40 border-slate-200'
                              : 'bg-white dark:bg-slate-800 text-slate-900 dark:text-white border-slate-300 dark:border-slate-700'
                          }`}
                        />
                        <span className="text-[10px] text-slate-500 mt-0.5 block">
                          {cadCurveType === 'FC' ? 'Dinonaktifkan untuk F-C' : `Kebutuhan Ls: ~${sightDistances ? '50-100' : '60'} m`}
                        </span>
                      </div>

                      <div>
                        <label className="font-bold text-slate-700 dark:text-slate-300 block mb-1">
                          Kecepatan Rencana Vd:
                        </label>
                        <select
                          value={cadParams.Vd}
                          onChange={(e) => setCadParams(prev => ({ ...prev, Vd: parseFloat(e.target.value) || 60 }))}
                          className="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-1.5 font-mono text-slate-900 dark:text-white font-bold"
                        >
                          <option value="40">40 km/jam</option>
                          <option value="50">50 km/jam</option>
                          <option value="60">60 km/jam (Default)</option>
                          <option value="80">80 km/jam</option>
                          <option value="100">100 km/jam</option>
                        </select>
                        <span className="text-[10px] text-slate-500 mt-0.5 block">Kecepatan desain operasional</span>
                      </div>
                    </div>
                  </div>
                )}

                <div className="bg-white dark:bg-slate-900 rounded-2xl p-2.5 shadow-sm border border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2.5">
                  
                  {/* Left: Zoom & Scale Controls */}
                  <div className="flex flex-wrap items-center gap-2">
                    <button
                      onClick={() => {
                        setCadPan({ x: 0, y: 0 });
                        setCadZoom(1.0);

                      title="Pusatkan gambar ke layar penuh"
                    >
                      Zoom Extents
                    </button>

                    <div className="inline-flex rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 p-0.5 text-xs font-bold">
                      <button
                        onClick={() => setCadZoom(prev => Math.min(prev * 1.25, 6.0))}
                        className="px-2.5 py-1 rounded hover:bg-white dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200"
                        title="Perbesar Tampilan"
                      >
                        +
                      </button>
                      <button
                        onClick={() => setCadZoom(prev => Math.max(prev / 1.25, 0.2))}
                        className="px-2.5 py-1 rounded hover:bg-white dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200"
                        title="Perkecil Tampilan"
                      >
                        -
                      </button>
                    </div>

                    {/* Skala Input / Dropdown */}
                    <div className="flex items-center space-x-1.5 text-xs text-slate-600 dark:text-slate-300 font-medium ml-1">
                      <span>Skala 1:</span>
                      <input
                        type="number"
                        min="100"
                        max="20000"
                        step="500"
                        value={cadScale}
                        onChange={(e) => setCadScale(parseInt(e.target.value) || 5000)}
                        className="w-16 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 text-center font-mono font-bold text-slate-800 dark:text-white"
                      />
                      <select
                        value={cadScale}
                        onChange={(e) => setCadScale(parseInt(e.target.value))}
                        className="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 font-mono text-slate-700 dark:text-slate-300"
                      >
                        <option value="500">1:500</option>
                        <option value="1000">1:1000</option>
                        <option value="2000">1:2000</option>
                        <option value="5000">1:5000</option>
                        <option value="10000">1:10000</option>
                      </select>
                    </div>

                    <div className="h-5 w-px bg-slate-200 dark:bg-slate-700 mx-1 hidden sm:block"></div>

                          <button
                            key={p}
                            onClick={() => setPaperSize(p)}
                            className={`px-2.5 py-0.5 rounded text-[11px] font-bold transition ${
                              paperSize === p
                                ? 'bg-slate-900 text-white dark:bg-blue-600 shadow-sm'
                                : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'
                            }`}
                          >
                            {p}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Cursor Coordinate HUD */}
                    <div className="hidden md:flex items-center text-[11px] font-mono text-slate-500 bg-slate-50 dark:bg-slate-800/80 px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700 ml-1">
                      <span>X: {cursorCadCoords.x.toFixed(2)} &nbsp; Y: {cursorCadCoords.y.toFixed(2)}</span>

                      onClick={() => {

    // --- DEFAULT INITIAL PROJECT STATE (SIMPANG ARMADA / ARTOS MAGELANG) ---

      meta: {

        tipeLingkungan: "COM", // Komersial (COM), Permukiman (RES), Akses Terbatas (RAC)
        hambatanSamping: "Sedang", // Tinggi, Sedang, Rendah
        faseCount: 4, // 2, 3, atau 4 fase
        lat: -7.502850,

        analis: "Kintan Alifia Astari",
        instansi: "Jurusan Teknik Sipil Universitas Tidar",
        tanggal: new Date().toISOString().split('T')[0]
      },
      // 4 Pendekat: Utara (U/N), Timur (T/E), Selatan (S/S), Barat (B/W)
      pendekat: [
        {
          id: 'U',
          nama: 'Utara (Jl. Mayjen Bambang Soegeng - Kota)',
          tipe: 'P', // P (Terlindung/Protected) atau O (Terlawan/Opposed)
          faseIndex: 1, // Beroperasi pada Fase 1
          Wa: 9.0, // Lebar masuk (meter)
          Wout: 9.5, // Lebar keluar (meter)
          Wltor: 0.0, // Lebar lajur belok kiri langsung jika ada
          kelandaian: 0.0, // % grade
          // Arus lalu lintas kendaraan/jam

          }
        },
        {
          id: 'T',
          nama: 'Timur (Arah Mertoyudan / Purworejo)',
          tipe: 'P',
          faseIndex: 2,
          Wa: 7.5,
          Wout: 8.0,
          Wltor: 0.0,
          kelandaian: 1.0,
          aruskend: {
            LT: { KR: 140, KB: 15, SM: 310 },
            ST: { KR: 380, KB: 45, SM: 890 },
            RT: { KR: 160, KB: 10, SM: 290 }
          }
        },
        {
          id: 'S',
          nama: 'Selatan (Jl. Jend. Soedirman - Yogyakarta)',
          tipe: 'P',
          faseIndex: 3,
          Wa: 9.5,
          Wout: 10.0,
          Wltor: 0.0,
          kelandaian: 0.0,
          aruskend: {
            LT: { KR: 220, KB: 30, SM: 490 },
            ST: { KR: 520, KB: 80, SM: 1350 },
            RT: { KR: 190, KB: 20, SM: 360 }
          }
        },
        {
          id: 'B',
          nama: 'Barat (Arah Borobudur / Salaman)',
          tipe: 'P',
          faseIndex: 4,
          Wa: 8.0,
          Wout: 8.5,
          Wltor: 0.0,
          kelandaian: -0.5,
          aruskend: {
            LT: { KR: 160, KB: 25, SM: 340 },
            ST: { KR: 410, KB: 50, SM: 980 },
            RT: { KR: 175, KB: 15, SM: 310 }
          }
        }
      ]
    };

    // --- MAIN REACT APPLICATION COMPONENT ---
    function App() {
      // Dark Mode State
      const [darkMode, setDarkMode] = useState(() => {
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      });

      // Active Tab State
      const [activeTab, setActiveTab] = useState('input'); // 'input', 'map', 'reports', 'charts', 'simulation'

      // Master Project Data State
      const [project, setProject] = useState(() => {
        const saved = localStorage.getItem('simpasi_untidar_data');
        if (saved) {
          try {
            return JSON.parse(saved);
          } catch (e) {
            console.error("Gagal memuat local storage:", e);
          }
        }
        return DEFAULT_PROJECT;
      });

      // Simulation States
      const [simPlaying, setSimPlaying] = useState(true);
      const [simSpeed, setSimSpeed] = useState(1);
      const [simTime, setSimTime] = useState(0);

      // Accordion Formula Open State
      const [formulaOpen, setFormulaOpen] = useState(false);

      // Notification Toast State
      const [toastMsg, setToastMsg] = useState('');

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3500);
      };

      // Toggle Dark Mode Class
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      // --- SAVE AND LOAD LOCALSTORAGE ---
      const handleSaveSession = () => {
        try {
          localStorage.setItem('simpasi_untidar_data', JSON.stringify(project));
          showToast("💾 Sesi proyek SIMPASI berhasil disimpan di LocalStorage!");
        } catch (e) {
          alert("Gagal menyimpan ke LocalStorage: " + e.message);
        }
      };

      const handleLoadSession = () => {
        try {
          const saved = localStorage.getItem('simpasi_untidar_data');
          if (saved) {
            setProject(JSON.parse(saved));
            showToast("📂 Proyek berhasil dimuat kembali dari LocalStorage!");
          } else {
            showToast("Belum ada data tersimpan di LocalStorage.");
          }
        } catch (e) {
          alert("Gagal memuat proyek: " + e.message);
        }
      };

      // --- PKJI 2023 CALCULATION ENGINE ---
      const calcResults = useMemo(() => {
        const empKR = 1.0;
        const empKB = 1.3;
        // emp SM: PKJI 2023 = 0.2 untuk pendekat terlindung, 0.4 untuk terlawan
        const getEmpSM = (tipe) => (tipe === 'P' ? 0.2 : 0.4);

        // 1. FORMULIR SA-I: Konversi Arus Lalu Lintas (skru/jam)
        const pendekatCalc = project.pendekat.map(p => {
          const empSM = getEmpSM(p.tipe);

          const qLT_skru = p.aruskend.LT.KR * empKR + p.aruskend.LT.KB * empKB + p.aruskend.LT.SM * empSM;
          const qST_skru = p.aruskend.ST.KR * empKR + p.aruskend.ST.KB * empKB + p.aruskend.ST.SM * empSM;
          const qRT_skru = p.aruskend.RT.KR * empKR + p.aruskend.RT.KB * empKB + p.aruskend.RT.SM * empSM;

          const qTotal_skru = qLT_skru + qST_skru + qRT_skru;

          // Proporsi Belok
          const pLT = qTotal_skru > 0 ? qLT_skru / qTotal_skru : 0;
          const pRT = qTotal_skru > 0 ? qRT_skru / qTotal_skru : 0;

          // Lebar Efektif (We) PKJI 2023
          let We = p.Wa;
          if (p.Wltor > 2.0) {
            We = Math.max(2.5, p.Wa - p.Wltor);
          }

          // Arus Jenuh Dasar (S0)
          let S0 = 600 * We;
          if (p.tipe === 'O') {
            // Pendekat Terlawan
            S0 = (1060 + 263 * We) * 0.95;
          }

          // Faktor Penyesuaian PKJI 2023
          // FCS: Ukuran Kota
          let FCS = 0.90; // Default Magelang (~130rb - 500rb)
          if (project.meta.ukuranKota === 'Metropolitan') FCS = 1.00;
          else if (project.meta.ukuranKota === 'Besar') FCS = 0.95;
          else if (project.meta.ukuranKota === 'Sedang') FCS = 0.90;
          else if (project.meta.ukuranKota === 'Kecil') FCS = 0.82;

          // FSF: Hambatan Samping & Lingkungan
          let FSF = 0.94;
          if (project.meta.tipeLingkungan === 'COM') {
            FSF = project.meta.hambatanSamping === 'Tinggi' ? 0.88 : project.meta.hambatanSamping === 'Sedang' ? 0.92 : 0.96;
          } else if (project.meta.tipeLingkungan === 'RES') {
            FSF = project.meta.hambatanSamping === 'Tinggi' ? 0.90 : project.meta.hambatanSamping === 'Sedang' ? 0.94 : 0.98;
          } else {
            FSF = 1.00; // Akses Terbatas (RAC)
          }

          // FG: Kelandaian
          const FG = 1.0 - 0.01 * p.kelandaian;

          // FP: Parkir (asumsi tanpa parkir tepi jalan dekat stop line = 1.0)
          const FP = 1.0;

          // FLT: Belok Kiri
          let FLT = 1.0;
          if (p.Wltor <= 0 && pLT > 0) {
            FLT = 1.0 - 0.16 * pLT;
          }

          // FRT: Belok Kanan
          let FRT = 1.0;
          if (p.tipe === 'O') {
            FRT = Math.max(0.70, 1.0 - pRT * 0.35);
          }

          // Arus Jenuh Disesuaikan (S)
          const S = Math.round(S0 * FCS * FSF * FG * FP * FLT * FRT);

          // Rasio Arus (FR = Q / S)
          const FR = S > 0 ? qTotal_skru / S : 0;

          return {
            ...p,
            We,
            empSM,
            qLT_skru,
            qST_skru,
            qRT_skru,
            qTotal_skru,
            pLT,
            pRT,
            S0,
            FCS,
            FSF,
            FG,
            FP,
            FLT,
            FRT,
            S,
            FR
          };
        });

        // 2. FORMULIR SA-III: Penentuan Fase, Waktu Hilang Total & Waktu Siklus (Webster)
        const faseCount = project.meta.faseCount;
        let faseCritFR = {};
        for (let f = 1; f <= faseCount; f++) {
          const pendekatInFase = pendekatCalc.filter(p => p.faseIndex === f);
          const maxFR = pendekatInFase.length > 0 ? Math.max(...pendekatInFase.map(p => p.FR)) : 0;
          faseCritFR[f] = maxFR;
        }

        const IFR = Object.values(faseCritFR).reduce((sum, val) => sum + val, 0);

        // Waktu Hilang Total L = sum(kuning + merah semua) per fase = 5 detik per fase
        const L_total = faseCount * 5;

        // Waktu Siklus Optimum (Formula Webster PKJI 2023)
        // c = (1.5 * L + 5) / (1 - IFR)
        let c_opt = 60;
        if (IFR < 0.95) {
          c_opt = Math.round((1.5 * L_total + 5) / (1 - IFR));
        } else {
          c_opt = 140; // Batas atas siklus jenuh
        }
        // Batasi siklus sesuai PKJI: min 40s, max 140s
        const c_actual = Math.min(140, Math.max(40, c_opt));

        // Alokasi Waktu Hijau Efektif (g_i) per fase
        const greenTimeAvailable = c_actual - L_total;
        let faseGreen = {};
        for (let f = 1; f <= faseCount; f++) {
          const frCrit = faseCritFR[f] || 0;
          let g = IFR > 0 ? Math.round(greenTimeAvailable * (frCrit / IFR)) : Math.round(greenTimeAvailable / faseCount);
          g = Math.max(10, g); // Syarat minimal hijau pejalan kaki 10 detik
          faseGreen[f] = g;
        }

        // 3. FORMULIR SA-IV & SA-V: Kapasitas (C), Derajat Kejenuhan (DS), Antrian & Tundaan
        const resultsPerPendekat = pendekatCalc.map(p => {
          const g = faseGreen[p.faseIndex] || 15;
          const C = Math.round(p.S * (g / c_actual));
          const DS = C > 0 ? parseFloat((p.qTotal_skru / C).toFixed(3)) : 9.99;

          // Tundaan Lalu Lintas (DT) PKJI 2023
          const A_term = 0.5 * c_actual * Math.pow(1 - g / c_actual, 2);
          const B_term = 1 - (g / c_actual) * Math.min(1.0, DS);
          const DT1 = B_term > 0 ? A_term / B_term : 40;

          // Tundaan Penyesuaian Kepadatan DT2
          let DT2 = 0;
          if (DS > 0.5) {
            DT2 = 0.25 * c_actual * ((DS - 1) + Math.sqrt(Math.pow(DS - 1, 2) + (8 * (DS - 0.5)) / (Math.max(1, C))));
          }
          const DT = parseFloat((DT1 + DT2).toFixed(1));

          // Tundaan Geometrik (DG)
          const DG = parseFloat(((1 - DS * (g / c_actual)) * (p.pLT + p.pRT) * 6 + 4).toFixed(1));

          // Tundaan Total (D)
          const D = parseFloat((DT + DG).toFixed(1));

          // Panjang Antrian (NQ) PKJI 2023
          const NQ1 = DT2;
          const NQ2 = (c_actual * (1 - g / c_actual) * (p.qTotal_skru / 3600)) / (1 - (g / c_actual) * Math.min(1, DS));
          const NQ = parseFloat((NQ1 + NQ2).toFixed(1));
          const QL = Math.round((NQ * 20) / p.Wa); // Panjang antrian fisik dalam meter

          // Tingkat Pelayanan (LOS) per Pendekat
          let los = 'A';
          if (D <= 10) los = 'A';
          else if (D <= 20) los = 'B';
          else if (D <= 35) los = 'C';
          else if (D <= 55) los = 'D';
          else if (D <= 80) los = 'E';
          else los = 'F';

          return {
            ...p,
            greenTime: g,
            c_actual,
            C,
            DS,
            isJenuh: DS > 0.85,
            DT,
            DG,
            D,
            NQ,
            QL,
            los
          };
        });

        // 4. Kinerja Rata-Rata Simpang
        const totalQSimpang = resultsPerPendekat.reduce((sum, p) => sum + p.qTotal_skru, 0);
        const totalTundaanSimpang = resultsPerPendekat.reduce((sum, p) => sum + p.qTotal_skru * p.D, 0);
        const avgDelaySimpang = totalQSimpang > 0 ? parseFloat((totalTundaanSimpang / totalQSimpang).toFixed(1)) : 0;
        const maxDS = Math.max(...resultsPerPendekat.map(p => p.DS));

        let simpangLOS = 'A';
        if (avgDelaySimpang <= 10) simpangLOS = 'A';
        else if (avgDelaySimpang <= 20) simpangLOS = 'B';
        else if (avgDelaySimpang <= 35) simpangLOS = 'C';
        else if (avgDelaySimpang <= 55) simpangLOS = 'D';
        else if (avgDelaySimpang <= 80) simpangLOS = 'E';
        else simpangLOS = 'F';

        return {
          pendekat: resultsPerPendekat,
          faseCount,
          faseCritFR,
          IFR: parseFloat(IFR.toFixed(3)),
          L_total,
          c_actual,
          faseGreen,
          totalQSimpang: Math.round(totalQSimpang),
          avgDelaySimpang,
          maxDS,
          simpangLOS,
          isSimpangJenuh: maxDS > 0.85
        };
      }, [project]);

      // --- LEAFLET MAP EFFECT (TAB 2) ---
      const mapRef = useRef(null);
      const leafletMapInstance = useRef(null);
      const markerInstance = useRef(null);

      useEffect(() => {
        if (activeTab !== 'map') return;
        const container = mapRef.current;
        if (!container || !window.L) return;

        if (!leafletMapInstance.current) {
          const map = L.map(container).setView([project.meta.lat, project.meta.lon], 16);

          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors | UNTIDAR'
          }).addTo(map);

          const marker = L.marker([project.meta.lat, project.meta.lon], { draggable: true }).addTo(map);
          marker.bindPopup(`<b>${project.meta.namaSimpang}</b><br/>Koordinat Acuan APILL`).openPopup();

          marker.on('dragend', (e) => {
            const pos = e.target.getLatLng();
            setProject(prev => ({
              ...prev,
              meta: {
                ...prev.meta,
                lat: parseFloat(pos.lat.toFixed(6)),
                lon: parseFloat(pos.lng.toFixed(6))
              }
            }));
          });

          // Click to reposition
          map.on('click', (e) => {
            const { lat, lng } = e.latlng;
            marker.setLatLng([lat, lng]);
            marker.bindPopup(`<b>${project.meta.namaSimpang}</b><br/>Lat: ${lat.toFixed(6)}, Lon: ${lng.toFixed(6)}`).openPopup();
            setProject(prev => ({
              ...prev,
              meta: {
                ...prev.meta,
                lat: parseFloat(lat.toFixed(6)),
                lon: parseFloat(lng.toFixed(6))
              }
            }));
          });

          leafletMapInstance.current = map;
          markerInstance.current = marker;
        } else {
          leafletMapInstance.current.setView([project.meta.lat, project.meta.lon], 16);
          if (markerInstance.current) {
            markerInstance.current.setLatLng([project.meta.lat, project.meta.lon]);
          }
          setTimeout(() => {
            leafletMapInstance.current.invalidateSize();
          }, 200);
        }
      }, [activeTab, project.meta.lat, project.meta.lon]);

      // --- CHART.JS ANALYTICS EFFECT (TAB 4) ---
      const chartCanvasRef = useRef(null);
      const chartInstance = useRef(null);

      useEffect(() => {
        if (activeTab !== 'charts') return;
        const ctx = chartCanvasRef.current;
        if (!ctx || !window.Chart) return;

        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        const labels = calcResults.pendekat.map(p => p.nama);
        const dsValues = calcResults.pendekat.map(p => p.DS);
        const delayValues = calcResults.pendekat.map(p => p.D);

        const newChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [
              {
                label: 'Derajat Kejenuhan (DS)',
                data: dsValues,

                borderColor: dsValues.map(v => v > 0.85 ? '#b91c1c' : '#0369a1'),
                borderWidth: 1.5,
                yAxisID: 'y'
              },
              {
                label: 'Tundaan Rata-rata (detik/skru)',
                data: delayValues,
                type: 'line',
                borderColor: '#f59e0b',
                backgroundColor: 'rgba(245, 158, 11, 0.2)',
                borderWidth: 3,
                pointBackgroundColor: '#f59e0b',
                pointRadius: 5,
                yAxisID: 'y1'
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
              mode: 'index',
              intersect: false
            },
            plugins: {
              legend: {
                position: 'top',
                labels: {
                  font: { family: 'Plus Jakarta Sans', size: 12 }
                }
              },
              tooltip: {
                callbacks: {
                  afterBody: (items) => {
                    const ds = items[0].raw;
                    return ds > 0.85 ? '⚠️ Melebihi Batas Kritis PKJI (DS > 0.85)' : '✅ Memenuhi Syarat PKJI (DS <= 0.85)';
                  }
                }
              }
            },
            scales: {
              y: {
                type: 'linear',
                display: true,
                position: 'left',
                min: 0,
                max: Math.max(1.2, Math.ceil(Math.max(...dsValues) * 1.2)),
                title: { display: true, text: 'Derajat Kejenuhan (DS)' }
              },
              y1: {
                type: 'linear',
                display: true,
                position: 'right',
                min: 0,
                title: { display: true, text: 'Tundaan (detik/skru)' },
                grid: { drawOnChartArea: false }
              }
            }
          }
        });

        chartInstance.current = newChart;
      }, [activeTab, calcResults]);

      // --- 2D CANVAS TOP-DOWN SIMULATION ANIMATION ---
      const simCanvasRef = useRef(null);

      useEffect(() => {
        const canvas = simCanvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const cycle = calcResults.c_actual;
        const L_tot = calcResults.L_total;
        const faseCount = calcResults.faseCount;

        const render = () => {
          if (simPlaying) {
            setSimTime(prev => (prev + 0.05 * simSpeed) % cycle);
          }

          const width = canvas.width;
          const height = canvas.height;
          const cx = width / 2;
          const cy = height / 2;

          ctx.clearRect(0, 0, width, height);

          // Background Grass
          ctx.fillStyle = darkMode ? '#0f172a' : '#f1f5f9';
          ctx.fillRect(0, 0, width, height);

          // Determine Active Fase
          // Each phase has greenTime + 3s yellow + 2s red
          let currentPhase = 1;
          let accTime = 0;
          for (let f = 1; f <= faseCount; f++) {
            const green = calcResults.faseGreen[f] || 15;
            const phaseDuration = green + 5; // 5s clearance
            if (simTime >= accTime && simTime < accTime + phaseDuration) {
              currentPhase = f;
              break;
            }
            accTime += phaseDuration;
          }

          // Asphal Road Cross
          const roadWidthNS = (calcResults.pendekat[0].Wa + calcResults.pendekat[2].Wout) * 6;
          const roadWidthEW = (calcResults.pendekat[1].Wa + calcResults.pendekat[3].Wout) * 6;

          ctx.fillStyle = darkMode ? '#1e293b' : '#334155';
          // Vertical Road (Utara - Selatan)
          ctx.fillRect(cx - roadWidthNS / 2, 0, roadWidthNS, height);
          // Horizontal Road (Barat - Timur)
          ctx.fillRect(0, cy - roadWidthEW / 2, width, roadWidthEW);

          // Intersection Box
          ctx.fillStyle = darkMode ? '#334155' : '#475569';
          ctx.fillRect(cx - roadWidthNS / 2, cy - roadWidthEW / 2, roadWidthNS, roadWidthEW);

          // Center Dashed Lines & Markings
          ctx.strokeStyle = '#f8fafc';
          ctx.lineWidth = 2;
          ctx.setLineDash([8, 8]);

          // North center
          ctx.beginPath();
          ctx.moveTo(cx, 0);
          ctx.lineTo(cx, cy - roadWidthEW / 2);
          ctx.stroke();

          // South center
          ctx.beginPath();
          ctx.moveTo(cx, cy + roadWidthEW / 2);
          ctx.lineTo(cx, height);
          ctx.stroke();

          // West center
          ctx.beginPath();
          ctx.moveTo(0, cy);
          ctx.lineTo(cx - roadWidthNS / 2, cy);
          ctx.stroke();

          // East center
          ctx.beginPath();
          ctx.moveTo(cx + roadWidthNS / 2, cy);
          ctx.lineTo(width, cy);
          ctx.stroke();

          ctx.setLineDash([]); // Reset dash

          // Stop Lines
          ctx.fillStyle = '#ffffff';
          // North stop line
          ctx.fillRect(cx - roadWidthNS / 2, cy - roadWidthEW / 2 - 4, roadWidthNS / 2, 4);
          // South stop line
          ctx.fillRect(cx, cy + roadWidthEW / 2, roadWidthNS / 2, 4);
          // West stop line
          ctx.fillRect(cx - roadWidthNS / 2 - 4, cy, 4, roadWidthEW / 2);
          // East stop line
          ctx.fillRect(cx + roadWidthNS / 2, cy - roadWidthEW / 2, 4, roadWidthEW / 2);

          // Traffic Lights & Vehicles per Approach
          calcResults.pendekat.forEach((p, idx) => {
            const isActive = p.faseIndex === currentPhase;
            const lightColor = isActive ? '#10b981' : '#ef4444';

            // Coordinates for Traffic Light Pole
            let lx, ly;
            if (p.id === 'U') {
              lx = cx - roadWidthNS / 2 - 16;
              ly = cy - roadWidthEW / 2 - 20;
            } else if (p.id === 'T') {
              lx = cx + roadWidthNS / 2 + 16;
              ly = cy - roadWidthEW / 2 - 16;
            } else if (p.id === 'S') {
              lx = cx + roadWidthNS / 2 + 16;
              ly = cy + roadWidthEW / 2 + 20;
            } else {
              lx = cx - roadWidthNS / 2 - 16;
              ly = cy + roadWidthEW / 2 + 16;
            }

            // Draw Traffic Light Housing
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(lx - 7, ly - 7, 14, 14);
            ctx.beginPath();
            ctx.arc(lx, ly, 5, 0, Math.PI * 2);
            ctx.fillStyle = lightColor;
            ctx.fill();

            // Label Approach & Green Time
            ctx.font = 'bold 10px Plus Jakarta Sans';
            ctx.fillStyle = darkMode ? '#f8fafc' : '#0f172a';
            ctx.textAlign = 'center';
            ctx.fillText(`${p.id}: ${isActive ? 'HIJAU' : 'MERAH'} (${p.greenTime}s)`, lx, ly + 20);

            // Animated Vehicle Blocks
            const vehicleOffset = ((simTime * 25) % 180);
            ctx.fillStyle = isActive ? '#38bdf8' : '#f43f5e';

            if (p.id === 'U') {
              const vy = isActive ? cy - roadWidthEW / 2 + vehicleOffset : cy - roadWidthEW / 2 - 15;
              ctx.fillRect(cx - roadWidthNS / 4 - 5, vy, 10, 15);
            } else if (p.id === 'S') {
              const vy = isActive ? cy + roadWidthEW / 2 - vehicleOffset : cy + roadWidthEW / 2 + 15;
              ctx.fillRect(cx + roadWidthNS / 4 - 5, vy, 10, 15);
            } else if (p.id === 'B') {
              const vx = isActive ? cx - roadWidthNS / 2 + vehicleOffset : cx - roadWidthNS / 2 - 15;
              ctx.fillRect(vx, cy + roadWidthEW / 4 - 5, 15, 10);
            } else {
              const vx = isActive ? cx + roadWidthNS / 2 - vehicleOffset : cx + roadWidthNS / 2 + 15;
              ctx.fillRect(vx, cy - roadWidthEW / 4 - 5, 15, 10);
            }
          });

          // Simulation Info Overlay
          ctx.fillStyle = darkMode ? '#f8fafc' : '#0f172a';
          ctx.font = 'bold 11px JetBrains Mono';
          ctx.textAlign = 'left';
          ctx.fillText(`Waktu Siklus: ${simTime.toFixed(1)}s / ${cycle}s | Fase Aktif: ${currentPhase}`, 15, 25);

          animationFrameId = requestAnimationFrame(render);
        };

        animationFrameId = requestAnimationFrame(render);
        return () => cancelAnimationFrame(animationFrameId);
      }, [calcResults, simPlaying, simSpeed, simTime, darkMode]);

          // 5. TABEL FORMULIR SA-I: ARUS LALU LINTAS & GEOMETRI

          const sa1Body = calcResults.pendekat.map(p => [

          doc.autoTable({

            body: sa1Body,

          });

          // 6. TABEL FORMULIR SA-II & SA-III: ARUS JENUH & WAKTU SIKLUS
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(10);

          const sa2Body = calcResults.pendekat.map(p => [

          ]);

          doc.autoTable({

            head: [['Kode', 'Lebar We', 'S0 Dasar', 'F. Hambatan', 'F. Gradien', 'S Disesuaikan', 'Rasio Arus (FR)', 'Hijau (g)', 'Siklus (c)']],
            body: sa2Body,
            theme: 'grid',
            headStyles: { fillColor: [2, 132, 199], fontSize: 8, halign: 'center' },
            bodyStyles: { fontSize: 8, halign: 'center' }
          });

          // 7. TABEL FORMULIR SA-IV & SA-V: KAPASITAS, TUNDAAN, & TINGKAT PELAYANAN (LOS)
          doc.setFont('helvetica', 'bold');

            : `Simpang ${project.meta.namaSimpang} beroperasi sangat baik dan memenuhi standar PKJI 2023 dengan seluruh DS <= 0.85 (DS Maksimum = ${calcResults.maxDS}) dan Tundaan rata-rata ${calcResults.avgDelaySimpang} det/skru (LOS ${calcResults.simpangLOS}). Simpang berada dalam kondisi stabil.`;

          doc.text(doc.splitTextToSize(evaluasiText, 180), 14, doc.lastAutoTable.finalY + 14);

          // 9. WATERMARK IDENTITAS WAJIB DI FOOTER PDF
          const pageCount = doc.internal.getNumberOfPages();
          for (let i = 1; i <= pageCount; i++) {

            doc.text(`Halaman ${i} dari ${pageCount}`, 196, 287, { align: 'right' });
          }

                            <td className="px-3 py-2 border font-bold text-slate-900 dark:text-white">{p.S}</td>
                            <td className="px-3 py-2 border font-bold text-blue-600">{p.FR.toFixed(3)}</td>
                            <td className="px-3 py-2 border font-bold text-emerald-600 bg-emerald-50/40 dark:bg-emerald-950/20">{p.greenTime} det</td>
                            <td className="px-3 py-2 border">{calcResults.c_actual} det</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  <div className="mt-3 p-3 bg-slate-50 dark:bg-slate-800/60 rounded-xl text-xs flex flex-wrap items-center justify-between gap-3 font-mono">
                    <span>Rasio Arus Simpang (IFR = &sum;FRcrit): <strong>{calcResults.IFR}</strong></span>
                    <span>Waktu Hilang Total (L): <strong>{calcResults.L_total} detik</strong></span>
                    <span>Waktu Siklus Optimum (c): <strong>{calcResults.c_actual} detik</strong></span>
                  </div>
                </div>

                {/* FORMULIR SA-IV & SA-V */}
                <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-800">
                  <h4 className="text-sm font-bold text-slate-900 dark:text-white mb-3">
                    Formulir SA-IV &amp; SA-V: Kapasitas, Derajat Kejenuhan (DS), &amp; Kinerja Simpang
                  </h4>
                  <div className="overflow-x-auto">
                    <table className="min-w-full text-xs text-center border-collapse">
                      <thead className="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-semibold uppercase">
                        <tr>
                          <th className="px-3 py-2 border">Kode</th>
                          <th className="px-3 py-2 border">Kapasitas (C)</th>
                          <th className="px-3 py-2 border font-bold">Derajat Kejenuhan (DS)</th>
                          <th className="px-3 py-2 border">Status Standar PKJI</th>
                          <th className="px-3 py-2 border">Panjang Antrian (m)</th>
                          <th className="px-3 py-2 border">Tundaan DT</th>
                          <th className="px-3 py-2 border">Tundaan DG</th>
                          <th className="px-3 py-2 border font-bold">Tundaan Total (D)</th>
                          <th className="px-3 py-2 border font-bold">LOS</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800 font-mono">
                        {calcResults.pendekat.map(p => (
                          <tr key={p.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/40">
                            <td className="px-3 py-2 border font-bold">{p.id}</td>
                            <td className="px-3 py-2 border">{p.C}</td>
                            <td className={`px-3 py-2 border font-bold ${p.isJenuh ? 'text-red-600 bg-red-50 dark:bg-red-950/40' : 'text-emerald-600'}`}>
                              {p.DS.toFixed(3)}
                            </td>
                            <td className="px-3 py-2 border font-sans font-bold">
                              {p.isJenuh ? (
                                <span className="px-2 py-0.5 rounded bg-red-100 text-red-800 dark:bg-red-900/60 dark:text-red-300">TIDAK MEMENUHI (DS &gt; 0.85)</span>
                              ) : (
                                <span className="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 dark:bg-emerald-900/60 dark:text-emerald-300">MEMENUHI (DS &le; 0.85)</span>
                              )}
                            </td>
                            <td className="px-3 py-2 border">{p.QL} m</td>
                            <td className="px-3 py-2 border">{p.DT}</td>
                            <td className="px-3 py-2 border">{p.DG}</td>
                            <td className="px-3 py-2 border font-bold text-amber-600">{p.D} det</td>
                            <td className="px-3 py-2 border font-bold">{p.los}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* EXPLAINABLE ENGINE: RUMUS PKJI 2023 */}
                <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
                  <button
                    onClick={() => setFormulaOpen(!formulaOpen)}
                    className="w-full px-6 py-4 flex items-center justify-between text-left font-bold text-sm text-slate-900 dark:text-white hover:bg-slate-50 dark:hover:bg-slate-800/50 transition"
                  >
                    <span>📖 Lihat Rumus Matematika &amp; Narasi Standar PKJI 2023 (Explainable Engine)</span>
                    <span>{formulaOpen ? '▲ Sembunyikan' : '▼ Buka'}</span>
                  </button>

                  {formulaOpen && (
                    <div className="px-6 pb-6 pt-2 border-t border-slate-100 dark:border-slate-800 text-xs text-slate-600 dark:text-slate-300 space-y-4 font-mono">
                      <div className="p-3 bg-slate-50 dark:bg-slate-800/60 rounded-xl space-y-1">
                        <strong className="text-slate-900 dark:text-white font-sans block">1. Arus Jenuh Dasar (S0):</strong>
                        <div>S0 = 600 &times; We (skru/jam hijau) untuk Tipe Terlindung (P)</div>
                      </div>
                      <div className="p-3 bg-slate-50 dark:bg-slate-800/60 rounded-xl space-y-1">
                        <strong className="text-slate-900 dark:text-white font-sans block">2. Waktu Siklus Optimum (Webster PKJI 2023):</strong>
                        <div>c = (1.5 &times; L + 5) / (1 - IFR)</div>
                        <div className="text-slate-500 font-sans text-[11px]">Dengan L = total waktu hilang = n &times; 5 detik. Batas operasional: 40s &le; c &le; 140s.</div>
                      </div>
                      <div className="p-3 bg-slate-50 dark:bg-slate-800/60 rounded-xl space-y-1">
                        <strong className="text-slate-900 dark:text-white font-sans block">3. Kapasitas &amp; Derajat Kejenuhan (DS):</strong>
                        <div>C = S &times; (g / c)</div>
                        <div>DS = Q / C (Syarat Standar PKJI: DS &le; 0.85)</div>
                      </div>
                      <div className="p-3 bg-slate-50 dark:bg-slate-800/60 rounded-xl space-y-1">
                        <strong className="text-slate-900 dark:text-white font-sans block">4. Tundaan Rata-Rata (D):</strong>
                        <div>D = DT + DG (detik/skru)</div>
                      </div>
                    </div>
                  )}
                </div>

              </div>
            )}

            {/* TAB 4: GRAFIK ANALISIS KINERJA (CHART.JS) */}
            {activeTab === 'charts' && (
              <div className="space-y-6">
                <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-800 space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800 gap-2">
                    <div>
                      <h3 className="text-base font-bold text-slate-900 dark:text-white">
                        Visualisasi Kinerja Simpang: Derajat Kejenuhan (DS) &amp; Tundaan
                      </h3>
                      <p className="text-xs text-slate-500 dark:text-slate-400">
                        Batas merah menunjukkan ambang batas kritis PKJI 2023 ($DS = 0.85$). Pendekat dengan batang merah memerlukan penanganan geometrik / waktu APILL.
                      </p>
                    </div>
                  </div>

                  <div className="relative w-full" style={{ height: '420px' }}>
                    <canvas ref={chartCanvasRef}></canvas>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 5: SIMULASI VISUAL 2D TOP-DOWN */}
            {activeTab === 'simulation' && (
              <div className="space-y-6">
                <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-800 space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800 gap-3">
                    <div>
                      <h3 className="text-base font-bold text-slate-900 dark:text-white">
                        Simulasi Visual 2D Top-Down Lampu APILL &amp; Alur Kendaraan
                      </h3>
                      <p className="text-xs text-slate-500 dark:text-slate-400">
                        Animasi pergerakan lampu dan kendaraan disinkronkan secara presisi dengan alokasi waktu hijau ($g_i$) dan siklus ($c$).
                      </p>
                    </div>

                    {/* Simulation Controls */}
                    <div className="flex items-center space-x-2 text-xs">
                      <button
                        onClick={() => setSimPlaying(!simPlaying)}
                        className="px-3 py-1.5 rounded-lg border font-bold flex items-center bg-slate-100 dark:bg-slate-800"
                      >
                        {simPlaying ? <><IconPause /> Jeda</> : <><IconPlay /> Putar</>}
                      </button>

                      <button
                        onClick={() => setSimTime(0)}
                        className="px-2.5 py-1.5 rounded-lg border bg-slate-100 dark:bg-slate-800"
                      >
                        Reset
                      </button>

                      <div className="flex items-center space-x-1 pl-2 border-l">
                        <span className="text-slate-500">Kecepatan:</span>
                        {[1, 2, 5].map(spd => (
                          <button
                            key={spd}
                            onClick={() => setSimSpeed(spd)}
                            className={`px-2 py-1 rounded font-bold ${simSpeed === spd ? 'bg-blue-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}`}
                          >
                            {spd}x
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className="flex justify-center bg-slate-100 dark:bg-slate-950 p-4 rounded-2xl border border-slate-200 dark:border-slate-800">
                    <canvas
                      ref={simCanvasRef}
                      width={640}
                      height={480}
                      className="rounded-xl shadow-sm max-w-full h-auto bg-slate-50 dark:bg-slate-900"
                    ></canvas>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* WATERMARK TEKS IDENTITAS WAJIB DI FOOTER HALAMAN WEB */}
          <footer className="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6 mt-12 transition-colors">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 dark:text-slate-400 gap-3">
              <div className="flex items-center space-x-2">
                <img 
                  src="https://upload.wikimedia.org/wikipedia/commons/4/43/Logo_UNTIDAR_%28Universitas_Tidar%29_Magelang.png" 
                  alt="Logo Untidar" 
                  className="h-6 w-6 object-contain"
                />
                <span className="font-semibold text-slate-700 dark:text-slate-300">
                  SIMPASI - Universitas Tidar Magelang (Fakultas Teknik, Jurusan Teknik Sipil)
                </span>
              </div>
              <div className="text-center sm:text-right font-medium text-slate-600 dark:text-slate-300">
                Dibuat dan dikembangkan oleh <strong className="text-blue-600 dark:text-blue-400">Kintan Alifia Astari (Universitas Tidar)</strong>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

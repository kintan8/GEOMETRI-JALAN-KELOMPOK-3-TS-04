                        link.href = canvas.toDataURL('image/png');
                        link.click();
                      }}
                      className="px-3 py-1.5 font-semibold bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl border border-slate-200 dark:border-slate-700 transition flex items-center gap-1.5"
                      title="Unduh gambar PNG resolusi tinggi"
                    >
                      <span>📥</span> Unduh PNG
                    </button>

                    <button
                      onClick={() => {
                        // DXF Exporter logic
                        const g = cadGeom;
                        const R = g.R;
                        const delta = g.deltaDeg;
                        const Tc = g.Tc;
                        const Ec = g.Ec;
                        const Lc = g.Lc;
                        const Ls = g.Ls;

                        const dxfLines = [
                          "0", "SECTION",
                          "2", "HEADER",
                          "0", "ENDSEC",
                          "0", "SECTION",
                          "2", "TABLES",
                          "0", "TABLE",
                          "2", "LAYER",
                          "70", "6",
                          "0", "LAYER", "2", "GARIS_UTAMA", "70", "0", "62", "7", "6", "CONTINUOUS",
                          "0", "LAYER", "2", "GARIS_SUMBU", "70", "0", "62", "1", "6", "DASHED",
                          "0", "LAYER", "2", "GARIS_POTONG", "70", "0", "62", "4", "6", "DASHDOT",
                          "0", "LAYER", "2", "DIMENSI_NOTASI", "70", "0", "62", "2", "6", "CONTINUOUS",
                          "0", "LAYER", "2", "TITIK_KONTROL", "70", "0", "62", "3", "6", "CONTINUOUS",
                          "0", "LAYER", "2", "KOP_ETIKET", "70", "0", "62", "8", "6", "CONTINUOUS",
                          "0", "ENDTAB",
                          "0", "ENDSEC",
                          "0", "SECTION",
                          "2", "ENTITIES"
                        ];

                        // Helper to add DXF LINE
                        const addLine = (layer, x1, y1, x2, y2) => {
                          dxfLines.push(
                            "0", "LINE",
                            "8", layer,
                            "10", x1.toFixed(3), "20", y1.toFixed(3), "30", "0.0",
                            "11", x2.toFixed(3), "21", y2.toFixed(3), "31", "0.0"
                          );
                        };

                        // Helper to add DXF TEXT
                        const addText = (layer, x, y, h, str) => {
                          dxfLines.push(
                            "0", "TEXT",
                            "8", layer,
                            "10", x.toFixed(3), "20", y.toFixed(3), "30", "0.0",
                            "40", h.toFixed(3),
                            "1", str
                          );
                        };

                        const alpha = g.alpha;
                        const T = g.Tc;
                        const TC_x = -T * Math.cos(alpha);
                        const TC_y = -T * Math.sin(alpha);
                        const CT_x = T * Math.cos(alpha);
                        const CT_y = -T * Math.sin(alpha);

                        // Tangents
                        addLine("GARIS_UTAMA", TC_x * 1.3, TC_y * 1.3, 0, 0);
                        addLine("GARIS_UTAMA", 0, 0, CT_x * 1.3, CT_y * 1.3);

                        // Bisector axis
                        const O_y = -R / Math.cos(alpha);
                        addLine("GARIS_SUMBU", 0, 50, 0, O_y - 50);

                        // Radial lines
                        addLine("GARIS_POTONG", 0, O_y, TC_x, TC_y);
                        addLine("GARIS_POTONG", 0, O_y, CT_x, CT_y);

                        // Text annotations
                        addText("DIMENSI_NOTASI", 10, 10, 5, `PI (Delta: ${delta.toFixed(2)} deg)`);
                        addText("DIMENSI_NOTASI", TC_x - 30, TC_y, 4, `TC / TS (Tc: ${Tc.toFixed(2)}m)`);
                        addText("DIMENSI_NOTASI", CT_x + 10, CT_y, 4, `CT / ST`);
                        addText("DIMENSI_NOTASI", 0, -Ec / 2, 4, `Ec: ${Ec.toFixed(3)}m`);
                        addText("DIMENSI_NOTASI", 0, O_y + 20, 5, `R = ${R}m | Lc = ${Lc.toFixed(2)}m`);
                        addText("KOP_ETIKET", -100, O_y - 80, 7, `DETAIL TIKUNGAN (${cadCurveType}) - SKALA 1:${cadScale}`);
                        addText("KOP_ETIKET", -100, O_y - 95, 4, `UNIVERSITAS TIDAR - JURUSAN TEKNIK SIPIL`);

                        dxfLines.push("0", "ENDSEC", "0", "EOF");

                        const blob = new Blob([dxfLines.join("\n")], { type: "application/dxf" });
                        const link = document.createElement("a");
                        link.download = `Tikungan_${cadCurveType}_CAD_UNTIDAR.dxf`;
                        link.href = URL.createObjectURL(blob);
                        link.click();
                      }}
                      className="px-3 py-1.5 font-semibold bg-blue-50 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 hover:bg-blue-100 rounded-xl border border-blue-200 dark:border-blue-800 transition flex items-center gap-1.5"
                      title="Unduh file AutoCAD DXF standar"
                    >
                      <span>📐</span> Unduh DXF
                    </button>

                    <button
                      onClick={() => {
                        const el = cadContainerRef.current;
                        if (!el) return;
                        if (!document.fullscreenElement) {
                          el.requestFullscreen().then(() => setCadIsFullscreen(true)).catch(err => alert(err.message));
                        } else {
                          document.exitFullscreen().then(() => setCadIsFullscreen(false));
                        }
                      }}
                      className="px-3 py-1.5 font-semibold bg-slate-900 text-white dark:bg-slate-700 rounded-xl hover:bg-slate-800 transition flex items-center gap-1.5"
                      title="Mode Layar Penuh"
                    >
                      <span>⛶</span> Fullscreen
                    </button>
                  </div>
                </div>

                {/* AREA UTAMA: KANVAS CAD (KIRI) & PANEL SIDEBAR (KANAN) */}
                <div 
                  ref={cadContainerRef}
                  className="grid grid-cols-1 lg:grid-cols-12 gap-5 bg-white dark:bg-slate-950 p-2 rounded-2xl"
                >

                  {/* KANVAS CAD DRAWING (COL-SPAN-8 / 9) */}
                  <div className="lg:col-span-8 xl:col-span-9 bg-slate-100 dark:bg-slate-900/90 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden relative flex flex-col justify-center items-center shadow-inner min-h-[560px]">
                    
                    {/* Visual paper background layer */}
                    <canvas
                      ref={cadCanvasRef}
                      className="cursor-crosshair w-full h-[580px] block select-none touch-none"
                      onMouseDown={(e) => {
                        isDraggingCad.current = true;
                        dragStartPos.current = { x: e.clientX, y: e.clientY };
                        lastPanPos.current = { ...cadPan };
                      }}
                      onMouseMove={(e) => {
                        const canvas = cadCanvasRef.current;
                        if (!canvas) return;
                        const rect = canvas.getBoundingClientRect();
                        const clientX = e.clientX - rect.left;
                        const clientY = e.clientY - rect.top;

                        // Pan dragging
                        if (isDraggingCad.current) {
                          const dx = e.clientX - dragStartPos.current.x;
                          const dy = e.clientY - dragStartPos.current.y;
                          setCadPan({
                            x: lastPanPos.current.x + dx,
                            y: lastPanPos.current.y + dy
                          });
                        }

                        // World CAD Coordinate conversion
                        const origX = rect.width / 2 + cadPan.x;
                        const origY = rect.height * 0.28 + cadPan.y;
                        const scale = (rect.width / 1300) * (5000 / cadScale) * cadZoom;
                        const worldX = (clientX - origX) / scale;
                        const worldY = (origY - clientY) / scale;
                        setCursorCadCoords({ x: worldX, y: worldY });

                        // Hover cursor style check
                        let isNear = false;
                        for (const ent of cadHitEntitiesRef.current) {
                          if (ent.hitDist && ent.hitDist(clientX, clientY) < 18) {
                            isNear = true;
                            break;
                          }
                        }
                        canvas.style.cursor = isDraggingCad.current ? 'grabbing' : (isNear ? 'pointer' : 'crosshair');
                      }}
                      onMouseUp={() => {
                        isDraggingCad.current = false;
                      }}
                      onMouseLeave={() => {
                        isDraggingCad.current = false;
                      }}
                      onWheel={(e) => {
                        e.preventDefault();
                        const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
                        setCadZoom(prev => Math.max(0.2, Math.min(prev * zoomFactor, 8.0)));
                      }}
                      onClick={(e) => {
                        const canvas = cadCanvasRef.current;
                        if (!canvas) return;
                        const rect = canvas.getBoundingClientRect();
                        const clientX = e.clientX - rect.left;
                        const clientY = e.clientY - rect.top;

                        // Find closest entity
                        let closest = null;
                        let minDist = 22; // pixel tolerance

                        for (const ent of cadHitEntitiesRef.current) {
                          if (ent.hitDist) {
                            const d = ent.hitDist(clientX, clientY);
                            if (d < minDist) {
                              minDist = d;
                              closest = ent;
                            }
                          }
                        }

                        if (closest) {
                          setSelectedEntity(closest);
                        } else {
                          setSelectedEntity(null);
                        }
                      }}
                    ></canvas>

                    {/* Canvas Floating Overlay Controls */}
                    <div className="absolute bottom-3 left-3 bg-white/90 dark:bg-slate-900/90 backdrop-blur px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-800 text-[11px] text-slate-500 dark:text-slate-400 flex items-center space-x-3 shadow-sm pointer-events-none">
                      <span className="flex items-center">
                        <span className="w-2 h-2 rounded-full bg-emerald-500 mr-1.5"></span>
                        Pan: Drag Kiri Mouse
                      </span>
                      <span>|</span>
                      <span>Zoom: Scroll Roda Mouse</span>
                      <span>|</span>
                      <span>Klik: Seleksi Garis / Parameter</span>
                    </div>
                  </div>

                  {/* SIDEBAR KANAN: PANEL 1 (DETAIL GARIS) & PANEL 2 (LAYER CAD) (COL-SPAN-4 / 3) */}
                  <div className="lg:col-span-4 xl:col-span-3 space-y-4">
                    
                    {/* PANEL 1: DETAIL GARIS & NOTASI */}
                    <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-800">
                      <div className="flex items-center justify-between pb-3 mb-3 border-b border-slate-100 dark:border-slate-800">
                        <h4 className="text-xs font-bold text-slate-900 dark:text-white uppercase tracking-wider flex items-center">
                          <span className="w-2 h-2 rounded-full bg-blue-600 mr-2"></span>
                          DETAIL GARIS &amp; NOTASI
                        </h4>
                        {selectedEntity && (
                          <button
                            onClick={() => setSelectedEntity(null)}
                            className="text-[11px] text-blue-600 hover:text-blue-800 dark:text-blue-400 font-semibold"
                          >
                            Reset
                          </button>
                        )}
                      </div>

                      {/* Content of selected entity or default prompt */}
                      {!selectedEntity ? (
                        <div className="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-dashed border-slate-200 dark:border-slate-700 text-center">
                          <div className="text-2xl mb-2">🎯</div>
                          <p className="text-xs text-slate-600 dark:text-slate-400 leading-relaxed font-medium">
                            Klik garis tangen, lengkung, garis jari-jari (R), atau notasi (<span className="font-mono font-bold text-blue-600 dark:text-blue-400">Ts, Ls, K, Yc, Lc, θs, θc, Δ</span>) pada kanvas untuk melihat detail parameter &amp; hasil perhitungannya.
                          </p>
                        </div>
                      ) : (
                        <div className="space-y-3 animate-fadeIn">
                          <div>
                            <span className="text-[10px] uppercase font-bold tracking-wider text-slate-400 block mb-0.5">
                              Nama Elemen
                            </span>
                            <div className="text-sm font-extrabold text-slate-900 dark:text-white flex items-center justify-between">
                              <span>{selectedEntity.name}</span>
                              <span className="text-[10px] px-2 py-0.5 rounded-full font-mono font-semibold bg-blue-50 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300 border border-blue-200 dark:border-blue-800">
                                {selectedEntity.layer}
                              </span>
                            </div>
                          </div>

                          <div className="bg-slate-50 dark:bg-slate-800/80 p-3 rounded-xl border border-slate-200 dark:border-slate-700">
                            <span className="text-[10px] uppercase font-bold tracking-wider text-slate-400 block mb-0.5">
                              Nilai Terhitung (True Metric)
                            </span>
                            <span className="font-mono text-base font-black text-blue-600 dark:text-blue-400">
                              {selectedEntity.value}
                            </span>
                          </div>

                          {selectedEntity.formula && (
                            <div>
                              <span className="text-[10px] uppercase font-bold tracking-wider text-slate-400 block mb-0.5">
                                Rumus Matematis
                              </span>
                              <div className="p-2.5 rounded-lg bg-slate-900 text-emerald-400 font-mono text-xs overflow-x-auto">
                                {selectedEntity.formula}
                              </div>
                            </div>
                          )}

                          {selectedEntity.desc && (
                            <div>
                              <span className="text-[10px] uppercase font-bold tracking-wider text-slate-400 block mb-0.5">
                                Penjelasan Teknis &amp; Fungsi
                              </span>
                              <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed bg-blue-50/50 dark:bg-blue-950/20 p-2.5 rounded-xl border border-blue-100 dark:border-blue-900/40">
                                {selectedEntity.desc}
                              </p>
                            </div>
                          )}

                          {selectedEntity.standard && (
                            <div className="pt-1">
                              <span className="text-[10px] text-slate-400 block">
                                📚 Acuan: <span className="font-semibold text-slate-600 dark:text-slate-300">{selectedEntity.standard}</span>
                              </span>
                            </div>
                          )}
                        </div>
                      )}
                    </div>

                    {/* PANEL 2: LAYER CAD (ON / OFF) */}
                    <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-800">
                      <div className="flex items-center justify-between pb-3 mb-3 border-b border-slate-100 dark:border-slate-800">
                        <h4 className="text-xs font-bold text-slate-900 dark:text-white uppercase tracking-wider flex items-center">
                          <span className="w-2 h-2 rounded-full bg-indigo-600 mr-2"></span>
                          LAYER CAD (ON / OFF)
                        </h4>
                        <span className="text-[11px] text-slate-400 font-mono">6 Layers</span>
                      </div>

                      <div className="space-y-2.5 text-xs">
                        {[
                          { key: 'GARIS_UTAMA', label: 'GARIS_UTAMA', symbol: '—', count: '3', color: 'text-slate-900 dark:text-white', desc: 'Tangen, Busur Lengkung, Spiral' },
                          { key: 'GARIS_SUMBU', label: 'GARIS_SUMBU', symbol: '---', count: '3', color: 'text-red-500', desc: 'Sumbu Jalan & Sumbu Bagi' },
                          { key: 'GARIS_POTONG', label: 'GARIS_POTONG', symbol: '-•-', count: '2', color: 'text-cyan-500', desc: 'Garis Jari-jari Radial ke Titik Pusat O' },
                          { key: 'DIMENSI_NOTASI', label: 'DIMENSI_NOTASI', symbol: '📏', count: '5', color: 'text-amber-500', desc: 'Ukuran Ts, Es, Lc, Ls, R, Δ' },
                          { key: 'TITIK_KONTROL', label: 'TITIK_KONTROL', symbol: '📍', count: '4', color: 'text-emerald-500', desc: 'Titik PI, TC, CT, TS, SC, CS, ST' },
                          { key: 'KOP_ETIKET', label: 'KOP_ETIKET', symbol: '📋', count: '1', color: 'text-slate-500', desc: 'Batas Kertas, Kop Etiket & Skala Grafis' }
                        ].map((layer) => (
                          <label
                            key={layer.key}
                            className={`flex items-center justify-between p-2 rounded-xl border transition cursor-pointer ${
                              cadLayers[layer.key]
                                ? 'bg-slate-50 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white'
                                : 'bg-transparent border-transparent opacity-40 text-slate-400'
                            }`}
                          >
                            <div className="flex items-center space-x-2.5">
                              <input
                                type="checkbox"
                                checked={cadLayers[layer.key]}
                                onChange={(e) => setCadLayers(prev => ({ ...prev, [layer.key]: e.target.checked }))}
                                className="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 border-slate-300 dark:border-slate-700"
                              />
                              <span className={`font-mono font-bold ${layer.color}`}>{layer.symbol}</span>
                              <span className="font-semibold text-xs tracking-tight">{layer.label}</span>
                            </div>
                            <span className="text-[11px] font-mono text-slate-400 font-bold bg-white dark:bg-slate-900 px-2 py-0.5 rounded-md border border-slate-100 dark:border-slate-800">
                              {layer.count}
                            </span>
                          </label>
                        ))}
                      </div>
                    </div>

                  </div>

                </div>

              </div>
            )}


            {/* TAB 7: GOOGLE EARTH & CITRA SATELIT 3D */}
            {activeTab === 'earth' && (
              <div className="space-y-6">

                {/* BANNER UTAMA GOOGLE EARTH */}
                <div className="bg-gradient-to-r from-emerald-900 via-teal-900 to-slate-900 text-white rounded-2xl p-6 shadow-md flex flex-col md:flex-row items-center justify-between gap-4">
                  <div>
                    <div className="flex items-center space-x-2">
                      <span className="bg-emerald-400 text-slate-950 text-xs font-black uppercase px-2 py-0.5 rounded">
                        Integrasi 3D GIS &amp; WGS-84
                      </span>
                      <h3 className="text-base sm:text-lg font-bold">Sambungan Google Earth &amp; Citra Satelit Bumi</h3>
                    </div>
                    <p className="text-xs sm:text-sm text-emerald-100 mt-1">
                      Visualisasikan trase jalan rencana langsung di atas medan 3D nyata menggunakan file KML standar Google Earth Pro / Google Earth Web.
                    </p>
                  </div>

                  <div className="flex flex-wrap items-center gap-3 w-full md:w-auto">
                    <button
                      onClick={exportToKML}
                      className="flex-1 md:flex-initial px-4 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs sm:text-sm rounded-xl shadow transition flex items-center justify-center"
                    >
                      <IconGlobe /> Unduh KML 3D (.kml)
                    </button>
                    <a
                      href="https://earth.google.com/web/"
                      target="_blank"
                      rel="noopener noreferrer"
                      className="flex-1 md:flex-initial px-4 py-2.5 bg-white/10 hover:bg-white/20 border border-white/20 text-white font-semibold text-xs sm:text-sm rounded-xl transition flex items-center justify-center"
                    >
                      Buka Google Earth Web <IconExternal />
                    </a>
                  </div>
                </div>

                {/* PENGATURAN TITIK JANGKAR GEOGRAFIS (GEOGRAPHIC ANCHOR) */}
                <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-800">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-4 mb-4 border-b border-slate-100 dark:border-slate-800 gap-2">
                    <div>
                      <h4 className="text-sm font-bold text-slate-900 dark:text-white flex items-center">
                        <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 mr-2"></span>
                        Pengaturan Titik Acuan Lokasi Proyek (Datum Geografis WGS-84)
                      </h4>
                      <p className="text-xs text-slate-500 dark:text-slate-400">
                        Titik PI-0 (Awal) diproyeksikan ke koordinat dunia nyata. Titik PI selanjutnya dihitung otomatis berdasarkan vektor offset metrik.
                      </p>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    {/* Preset Lokasi */}
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                        Pilih Lokasi Wilayah Proyek:
                      </label>
                      <select
                        value={geoAnchor.locationPreset}
                        onChange={(e) => {
                          const selected = LOCATION_PRESETS.find(p => p.id === e.target.value);
                          if (selected) {
                            setGeoAnchor({
                              locationPreset: selected.id,
                              locationName: selected.name,
                              lat: selected.lat,
                              lon: selected.lon,
                              datumElevation: selected.elev
                            });
                          }
                        }}
                        className="w-full px-3 py-2 text-xs rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-emerald-500"
                      >
                        {LOCATION_PRESETS.map(p => (
                          <option key={p.id} value={p.id}>{p.name}</option>
                        ))}
                      </select>
                    </div>

                    {/* Latitude PI-0 */}
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                        Latitude Acuan PI-0 (Derajat Desimal):
                      </label>
                      <input
                        type="number"
                        step="0.000001"
                        value={geoAnchor.lat}
                        onChange={(e) => {
                          setGeoAnchor({ ...geoAnchor, locationPreset: 'custom', lat: Number(e.target.value) });
                        }}
                        className="w-full px-3 py-2 text-xs rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white font-mono"
                      />
                    </div>

                    {/* Longitude PI-0 */}
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                        Longitude Acuan PI-0 (Derajat Desimal):
                      </label>
                      <input
                        type="number"
                        step="0.000001"
                        value={geoAnchor.lon}
                        onChange={(e) => {
                          setGeoAnchor({ ...geoAnchor, locationPreset: 'custom', lon: Number(e.target.value) });
                        }}
                        className="w-full px-3 py-2 text-xs rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white font-mono"
                      />
                    </div>

                    {/* Elevasi Datum */}
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                        Elevasi Datum Permukaan Laut (m dpl):
                      </label>
                      <input
                        type="number"
                        step="1"
                        value={geoAnchor.datumElevation}
                        onChange={(e) => {
                          setGeoAnchor({ ...geoAnchor, datumElevation: Number(e.target.value) });
                        }}
                        className="w-full px-3 py-2 text-xs rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white font-mono"
                      />
                    </div>
                  </div>

                  {/* TABEL KOORDINAT HASIL PROYEKSI WGS84 */}
                  <div className="mt-5 overflow-x-auto">
                    <table className="min-w-full text-xs text-left">
                      <thead className="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 uppercase font-semibold">
                        <tr>
                          <th className="px-3 py-2 rounded-l-lg">Titik PI</th>
                          <th className="px-3 py-2">X Lokal (m)</th>
                          <th className="px-3 py-2">Y Lokal (m)</th>
                          <th className="px-3 py-2">Latitude (WGS84)</th>
                          <th className="px-3 py-2">Longitude (WGS84)</th>
                          <th className="px-3 py-2 rounded-r-lg">Google Maps Link</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                        {piList.map((pi, idx) => {
                          const geo = getGeoCoord(pi.x, pi.y);
                          const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${geo.lat.toFixed(6)},${geo.lon.toFixed(6)}`;
                          return (
                            <tr key={pi.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                              <td className="px-3 py-2 font-bold text-slate-900 dark:text-white">{pi.name}</td>
                              <td className="px-3 py-2 font-mono">{pi.x}</td>
                              <td className="px-3 py-2 font-mono">{pi.y}</td>
                              <td className="px-3 py-2 font-mono text-emerald-600 dark:text-emerald-400 font-semibold">{geo.lat.toFixed(6)}°</td>
                              <td className="px-3 py-2 font-mono text-emerald-600 dark:text-emerald-400 font-semibold">{geo.lon.toFixed(6)}°</td>
                              <td className="px-3 py-2">
                                <a
                                  href={gmapsUrl}
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  className="text-blue-600 dark:text-blue-400 hover:underline inline-flex items-center"
                                >
                                  Buka di Maps <IconExternal />
                                </a>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* PRATINJAU PETA SATELIT INTERAKTIF (LEAFLET + ESRI SATELLITE) */}
                <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-800">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-4 mb-4 border-b border-slate-100 dark:border-slate-800 gap-2">
                    <div>
                      <h4 className="text-sm font-bold text-slate-900 dark:text-white flex items-center">
                        <span className="w-2.5 h-2.5 rounded-full bg-blue-600 mr-2"></span>
                        Pratinjau Citra Satelit Bumi (ESRI World Imagery)
                      </h4>
                      <p className="text-xs text-slate-500 dark:text-slate-400">
                        Overlay trase alinyemen horizontal di atas foto satelit resolusi tinggi. Klik marker untuk melihat parameter tikungan.
                      </p>
                    </div>

                    <div className="flex items-center space-x-3 text-xs">
                      <div className="flex items-center space-x-1.5">
                        <span className="w-3.5 h-1 bg-amber-500 inline-block"></span>
                        <span className="text-slate-600 dark:text-slate-400">Garis Tangen PI</span>
                      </div>
                      <div className="flex items-center space-x-1.5">
                        <span className="w-3.5 h-1 bg-blue-600 inline-block"></span>
                        <span className="text-slate-600 dark:text-slate-400">Lengkung Jalan Rencana</span>
                      </div>
                    </div>
                  </div>

                  <div className="relative rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-800">
                    <div
                      ref={mapContainerRef}
                      style={{ height: '480px', width: '100%' }}
                      className="z-10"
                    ></div>
                  </div>
                </div>

                {/* PANDUAN IMPORT GOOGLE EARTH */}
                <div className="bg-slate-900 text-white rounded-2xl p-6 shadow-sm border border-slate-800 space-y-4">
                  <h4 className="text-sm font-bold text-amber-400 flex items-center">
                    📖 Panduan 4 Langkah Menampilkan Trase di Google Earth Pro / Web:
                  </h4>
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4 text-xs text-slate-300">
                    <div className="p-3 bg-slate-800/80 rounded-xl border border-slate-700/60">
                      <strong className="text-white block mb-1">1. Unduh Berkas KML</strong>
                      Klik tombol <strong>"Unduh KML 3D (.kml)"</strong> di atas untuk menyimpan file geometric road path Anda.
                    </div>
                    <div className="p-3 bg-slate-800/80 rounded-xl border border-slate-700/60">
                      <strong className="text-white block mb-1">2. Buka Google Earth</strong>
                      Buka aplikasi <strong>Google Earth Pro</strong> di komputer Anda atau akses <strong>earth.google.com</strong> pada browser.
                    </div>
                    <div className="p-3 bg-slate-800/80 rounded-xl border border-slate-700/60">
                      <strong className="text-white block mb-1">3. Import File KML</strong>
                      Pada menu samping, pilih <em>Projects</em> ➔ <em>Open</em> ➔ <em>Import KML / KMZ file from computer</em>.
                    </div>
                    <div className="p-3 bg-slate-800/80 rounded-xl border border-slate-700/60">
                      <strong className="text-white block mb-1">4. Nikmati Tampilan 3D!</strong>
                      Google Earth akan otomatis terbang ke koridor jalan dengan kemiringan 45° menampilkan pita trase jalan di atas kontur bumi nyata!
                    </div>
                  </div>
                </div>

              </div>
            )}

            {/* TAB 8: LAPORAN & EXPORT EXCEL/CSV */}
            {activeTab === 'export' && (
              <div className="space-y-6">

                {/* EXPORT ACTION CARD */}
                <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-800 flex flex-col md:flex-row items-center justify-between gap-4">
                  <div>
                    <h3 className="text-base font-bold text-slate-900 dark:text-white">
                      Unduh Rekapitulasi Data Geometrik (Excel / CSV)
                    </h3>
                    <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                      File CSV terstruktur siap dibuka di Microsoft Excel, Google Sheets, atau software analisis jalan sipil.
                    </p>
                  </div>
                  <div className="flex flex-wrap items-center gap-3">
                    <button
                      onClick={exportToKML}
                      className="flex items-center px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-bold rounded-xl shadow-md transition"
                    >
                      <IconGlobe /> Unduh KML 3D (Google Earth)
                    </button>
                    <button
                      onClick={exportToCSV}
                      className="flex items-center px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold rounded-xl shadow-md transition"
                    >
                      <IconDownload /> Unduh Laporan Lengkap (.CSV)
                    </button>
                  </div>
                </div>

                {/* TABEL LENGKAP STATION-BY-STATION */}
                <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-800">
                  <div className="flex items-center justify-between pb-4 mb-4 border-b border-slate-100 dark:border-slate-800">
                    <div>
                      <h4 className="text-sm font-bold text-slate-900 dark:text-white">
                        Daftar Stationing, Elevasi, dan Status Galian/Timbunan per STA
                      </h4>
                      <p className="text-xs text-slate-500 dark:text-slate-400">
                        Total {profileData.length} titik stationing dievaluasi sepanjang koridor jalan.
                      </p>
                    </div>
                  </div>

                  <div className="max-h-96 overflow-y-auto border border-slate-100 dark:border-slate-800 rounded-xl">
                    <table className="min-w-full text-xs text-left">
                      <thead className="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 uppercase font-semibold sticky top-0">
                        <tr>
                          <th className="px-4 py-2.5">Stationing (STA)</th>
                          <th className="px-4 py-2.5">Elevasi Tanah (m)</th>
                          <th className="px-4 py-2.5">Elevasi Rencana (m)</th>
                          <th className="px-4 py-2.5">Beda Tinggi ΔZ (m)</th>
                          <th className="px-4 py-2.5">Status Pekerjaan</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                        {profileData.map((p, idx) => (
                          <tr key={idx} className="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                            <td className="px-4 py-2 font-mono font-bold text-slate-900 dark:text-white">
                              {p.staFormatted}
                            </td>
                            <td className="px-4 py-2 font-mono">{p.zGround.toFixed(2)}</td>
                            <td className="px-4 py-2 font-mono font-semibold text-blue-600 dark:text-blue-400">
                              {p.zDesign.toFixed(2)}
                            </td>
                            <td className="px-4 py-2 font-mono">
                              {p.deltaZ > 0 ? `+${p.deltaZ.toFixed(2)}` : p.deltaZ.toFixed(2)}
                            </td>
                            <td className="px-4 py-2">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                p.status.includes('Timbunan')
                                  ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300'
                                  : p.status.includes('Galian')
                                  ? 'bg-rose-100 text-rose-800 dark:bg-rose-950/60 dark:text-rose-300'
                                  : 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300'
                              }`}>
                                {p.status}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>
            )}

          </main>

          {/* MODAL SARAN PAKAR (EXPERT SYSTEM POPUP) */}
          {/* MODAL PEMBAGIAN ZONA UTM INDONESIA (WGS-84) */}
        {showUtmZoneModal && (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm animate-fadeIn">
            <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-4xl w-full max-h-[90vh] overflow-y-auto p-6 shadow-2xl border border-slate-200 dark:border-slate-800">
              
              <div className="flex items-center justify-between pb-4 mb-4 border-b border-slate-100 dark:border-slate-800">
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-2xl bg-indigo-100 dark:bg-indigo-900/60 flex items-center justify-center text-xl">
                    🗺️
                  </div>
                  <div>
                    <h3 className="text-base font-extrabold text-slate-900 dark:text-white">
                      Pembagian Zona UTM Indonesia (WGS-84)
                    </h3>
                    <p className="text-xs text-slate-500 dark:text-slate-400">
                      Standar Sistem Koordinat Proyeksi Geodesi Badan Informasi Geospasial (BIG) &amp; Bina Marga
                    </p>
                  </div>
                </div>

                <button
                  onClick={() => setShowUtmZoneModal(false)}
                  className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center font-bold"
                >
                  ✕
                </button>
              </div>

              {/* ACTIVE ZONE HIGHLIGHT BANNER */}
              <div className="bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-800 rounded-2xl p-4 mb-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                  <span className="text-[10px] uppercase font-bold tracking-wider text-indigo-600 dark:text-indigo-400 block">
                    Zona Proyeksi Trase Saat Ini:
                  </span>
                  <span className="text-lg font-black text-indigo-950 dark:text-indigo-200 font-mono">
                    {activeUtm.zoneStr} &nbsp;({activeUtm.hemisphere === 'S' ? 'Belahan Bumi Selatan' : 'Belahan Bumi Utara'})
                  </span>
                  <span className="text-xs text-slate-600 dark:text-slate-400 block mt-0.5">
                    Meridian Tengah (CM): <strong>{activeUtm.centralMeridian}° BT</strong> &bull; Batas Bujur: <strong>{activeUtm.bounds}</strong> &bull; Zona Waktu: <strong>{activeUtm.timezone}</strong>
                  </span>
                </div>
                <div className="px-3 py-1.5 rounded-xl bg-white dark:bg-slate-900 border border-indigo-200 dark:border-indigo-700 text-xs font-bold text-indigo-700 dark:text-indigo-300 whitespace-nowrap self-start sm:self-auto">
                  📍 {geoAnchor.locationName}
                </div>
              </div>

              {/* TABLE OF ALL INDONESIAN UTM ZONES */}
              <div className="overflow-x-auto rounded-2xl border border-slate-200 dark:border-slate-800">
                <table className="min-w-full text-xs text-left">
                  <thead className="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 uppercase font-semibold">
                    <tr>
                      <th className="px-3.5 py-3 rounded-tl-xl">Zona UTM</th>
                      <th className="px-3.5 py-3">Meridian Tengah (CM)</th>
                      <th className="px-3.5 py-3">Batas Bujur (Longitude)</th>
                      <th className="px-3.5 py-3">Cakupan Wilayah Provinsi di Indonesia</th>
                      <th className="px-3.5 py-3 rounded-tr-xl">Zona Waktu</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                    {UTM_ZONES_INDONESIA.map((z, idx) => {
                      const isActive = activeUtm.zoneNumber === z.number;
                      return (
                        <tr 
                          key={idx}
                          className={isActive 
                            ? "bg-indigo-50/80 dark:bg-indigo-950/50 font-semibold border-l-4 border-indigo-600" 
                            : "hover:bg-slate-50 dark:hover:bg-slate-800/50"}
                        >
                          <td className="px-3.5 py-3 font-mono font-bold text-indigo-700 dark:text-indigo-300">
                            {z.zone} {isActive && <span className="ml-1.5 px-2 py-0.5 rounded text-[10px] bg-indigo-600 text-white font-sans font-bold">Aktif</span>}
                          </td>
                          <td className="px-3.5 py-3 font-mono font-bold text-slate-800 dark:text-slate-200">{z.cm}° BT</td>
                          <td className="px-3.5 py-3 font-mono text-slate-600 dark:text-slate-400">{z.bounds}</td>
                          <td className="px-3.5 py-3 text-slate-700 dark:text-slate-300">{z.provinces}</td>
                          <td className="px-3.5 py-3 font-semibold text-emerald-600 dark:text-emerald-400">{z.timezone}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>

              {/* TECHNICAL NOTE */}
              <div className="mt-4 p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-xs text-slate-600 dark:text-slate-400 space-y-1.5">
                <div className="font-bold text-slate-800 dark:text-slate-200 flex items-center gap-1.5">
                  <span>💡</span> Catatan Teknis Geodesi Trase Jalan (Bina Marga):
                </div>
                <p>
                  Indonesia terbagi ke dalam 9 zona UTM selebar masing-masing 6° bujur, mulai dari <strong>Zona 46 (90° - 96° BT)</strong> hingga <strong>Zona 54 (138° - 144° BT)</strong>. Wilayah Jawa Tengah, DI Yogyakarta, dan Kampus Universitas Tidar Magelang secara resmi berada pada <strong>UTM Zona 49S</strong> dengan Meridian Tengah 111° BT.
                </p>
                <p>
                  Pada belahan bumi selatan (S), false northing sebesar <strong>10.000.000 meter</strong> ditambahkan agar koordinat Y selalu bernilai positif, dan false easting sebesar <strong>500.000 meter</strong> diterapkan pada meridian tengah.
                </p>
              </div>

              <div className="mt-5 flex justify-end">
                <button
                  onClick={() => setShowUtmZoneModal(false)}
                  className="px-5 py-2 bg-slate-900 text-white dark:bg-slate-700 hover:bg-slate-800 rounded-xl font-bold text-xs shadow transition"
                >
                  Tutup Referensi
                </button>
              </div>

            </div>
          </div>
        )}

        
        {showExpertModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
              <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl border border-slate-200 dark:border-slate-800 max-h-[90vh] overflow-y-auto space-y-5">
                
                <div className="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800">
                  <div className="flex items-center space-x-3">
                    <div className="p-2.5 bg-amber-500 text-white rounded-xl shadow-md">
                      <IconBulb />
                    </div>
                    <div>
                      <h3 className="text-lg font-bold text-slate-900 dark:text-white">
                        💡 Rekomendasi Sistem Pakar Sipil
                      </h3>
                      <p className="text-xs text-slate-500 dark:text-slate-400">
                        Kajian Geometrik Berdasarkan PDGJ 2021 &amp; Silvia Sukirman
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowExpertModal(false)}
                    className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1 rounded-lg"
                  >
                    ✕
                  </button>
                </div>

                {/* Content Recommendations */}
                <div className="space-y-4 text-xs">
                  
                  {/* Rekomendasi R_min */}
                  <div className="p-4 bg-slate-50 dark:bg-slate-800/60 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-2">
                    <div className="flex items-center justify-between">
                      <strong className="text-sm font-bold text-slate-900 dark:text-white">
                        1. Jari-Jari Lengkung Horizontal (R_min = {Rmin} m)
                      </strong>
                      <span className="text-[11px] font-mono px-2 py-0.5 bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200 rounded">
                        Vd = {Vd} km/j
                      </span>
                    </div>
                    <p className="text-slate-600 dark:text-slate-300 leading-relaxed">
                      "Disarankan menggunakan R aktual yang jauh lebih besar dari <strong>{Rmin} m</strong>."
                    </p>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-2">
                      <div className="p-2.5 bg-emerald-50 dark:bg-emerald-950/50 rounded-xl text-emerald-900 dark:text-emerald-200">
                        <strong>Plus:</strong> Kendaraan tidak murni mengandalkan gaya gesek melintang maksimum sehingga jauh lebih aman, nyaman, dan superelevasi tidak ekstrem.
                      </div>
                      <div className="p-2.5 bg-rose-50 dark:bg-rose-950/50 rounded-xl text-rose-900 dark:text-rose-200">
                        <strong>Minus:</strong> Membutuhkan ruang pembebasan lahan yang lebih luas dan volume galian/timbunan berpotensi membesar pada medan berat.
                      </div>
                    </div>
                  </div>

                  {/* Rekomendasi Ls */}
                  <div className="p-4 bg-slate-50 dark:bg-slate-800/60 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-2">
                    <strong className="text-sm font-bold text-slate-900 dark:text-white block">
                      2. Panjang Lengkung Peralihan (Ls) - 3 Kriteria
                    </strong>
                    <p className="text-slate-600 dark:text-slate-300 leading-relaxed">
                      "Gunakan nilai Ls terbesar dari ketiga kriteria (Shortt, Kelandaian Relatif, dan Waktu Tempuh 3 Detik) dan <strong>bulatkan ke atas ke kelipatan 5 meter</strong> untuk kemudahan pelaksanaan pengukuran dan pematokan di lapangan."
                    </p>
                  </div>

                  {/* Rekomendasi Bentuk Tikungan */}
                  <div className="p-4 bg-slate-50 dark:bg-slate-800/60 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-2">
                    <strong className="text-sm font-bold text-slate-900 dark:text-white block">
                      3. Pemilihan Bentuk Tikungan (F-C vs S-C-S)
                    </strong>
                    <p className="text-slate-600 dark:text-slate-300 leading-relaxed">
                      Jika superelevasi butuh <strong>e &gt; 3%</strong>, rekomendasikan <strong>Spiral-Circle-Spiral (S-C-S)</strong>.
                      <br/>
                      <em>(Plus: transisi gaya sentrifugal halus, pengemudi mudah mengikuti lajur tanpa hentakan. Minus: hitungan lebih kompleks).</em>
                      <br/><br/>
                      Jika <strong>e ≤ 3%</strong> dan R sangat besar, sarankan <strong>Full Circle (F-C)</strong>.
                    </p>
                  </div>

                  {/* Rekomendasi Alinyemen Vertikal */}
                  <div className="p-4 bg-slate-50 dark:bg-slate-800/60 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-2">
                    <strong className="text-sm font-bold text-slate-900 dark:text-white block">
                      4. Peringatan Keamanan Alinyemen Vertikal (Lv)
                    </strong>
                    <p className="text-slate-600 dark:text-slate-300 leading-relaxed">
                      Pastikan panjang lengkung vertikal (Lv) memenuhi syarat kenyamanan visual minimal 3 detik perjalanan (<strong>Lv ≥ {Math.ceil((Vd * 3) / 3.6)} m</strong>) dan memenuhi batas jarak pandang henti (JPH = <strong>{sightDistances.JPH} m</strong>) agar tidak timbul blind-crest di puncak tanjakan.
                    </p>
                  </div>

                </div>

                <div className="pt-2 flex justify-end">
                  <button
                    onClick={() => setShowExpertModal(false)}
                    className="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow transition"
                  >
                    Tutup Saran Pakar
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* FOOTER AKADEMIK */}
          <footer className="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6 mt-12 transition-colors">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 dark:text-slate-400 gap-3">
              <div className="flex items-center space-x-2">
                <img 
                  src="https://upload.wikimedia.org/wikipedia/commons/4/43/Logo_UNTIDAR_%28Universitas_Tidar%29_Magelang.png" 
                  alt="Logo Untidar" 
                  className="h-6 w-6 object-contain"
                />
                <span className="font-semibold text-slate-700 dark:text-slate-300">
                  Universitas Tidar Magelang - Fakultas Teknik, Jurusan Teknik Sipil
                </span>
              </div>
              <div className="text-center sm:text-right">
                Berdasarkan Pedoman Desain Geometrik Jalan (PDGJ 2021 Ditjen Bina Marga) &amp; Buku Silvia Sukirman (1999)
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

      const exportToCSV = () => {
        let csv = "=== SID-JALAN UNTIDAR - LAPORAN PERENCANAAN GEOMETRIK JALAN ===\r\n";
        csv += `Standar Acuan: PDGJ 2021 (Bina Marga) & Silvia Sukirman (Dasar-Dasar Perencanaan Geometrik Jalan)\r\n`;
        csv += `Tanggal Export: ${new Date().toLocaleString('id-ID')}\r\n\r\n`;

        // 1. Parameter Umum
        csv += `--- 1. PARAMETER UMUM PERENCANAAN ---\r\n`;
        csv += `Kecepatan Rencana (Vd):,${Vd},km/jam\r\n`;
        csv += `Tipe Medan:,${terrain},\r\n`;
        csv += `Lebar Lajur (B):,${laneWidth},m\r\n`;
        csv += `Superelevasi Maksimum (emax):,${(emax * 100).toFixed(1)},%\r\n`;
        csv += `Kemiringan Normal (en):,${(en * 100).toFixed(1)},%\r\n`;
        csv += `Koefisien Gesek Melintang (fmax):,${fmax},\r\n`;
        csv += `Jari-Jari Minimum (Rmin):,${Rmin},m\r\n`;
        csv += `Jarak Pandang Henti (JPH):,${sightDistances.JPH},m\r\n`;
        csv += `Jarak Pandang Mendahului (JPM):,${sightDistances.JPM},m\r\n\r\n`;

        // 2. Alinyemen Horizontal
        csv += `--- 2. DATA ALINYEMEN HORIZONTAL (TIKUNGAN) ---\r\n`;
        csv += `PI,Sudut Tikungan (deg),Arah,Rencana R (m),Tipe Tikungan,e butuh (%),Ls Pakai (m),Lc (m),Ts (m),Es (m),L Total (m)\r\n`;
        horizCalc.curves.forEach(c => {
          csv += `"${c.piName}",${c.deltaDeg.toFixed(2)},${c.turnDirection},${c.R},"${c.curveType}",${c.e_butuh},${c.Ls},${c.Lc},${c.Ts},${c.Es},${c.Ltot}\r\n`;
        });
        csv += `\r\n`;

        // 3. Alinyemen Vertikal
        csv += `--- 3. DATA ALINYEMEN VERTIKAL ---\r\n`;
        csv += `PVI,STA,Elevasi PVI (m),g1 (%),g2 (%),Beda Aljabar A (%),Tipe Lengkung,Lv (m),Ev (m),STA PLV,STA PTV\r\n`;
        vertCalc.curves.forEach(c => {
          csv += `"${c.pviName}",${formatSTA(c.staPVI)},${c.zPVI},${c.g1},${c.g2},${c.A},"${c.curveType}",${c.Lv},${c.Ev},${formatSTA(c.staPLV)},${formatSTA(c.staPTV)}\r\n`;
        });
        csv += `\r\n`;

        // 4. Stationing dan Estimasi Cut/Fill
        csv += `--- 4. PROFIL MEMANJANG & ESTIMASI GALIAN/TIMBUNAN ---\r\n`;
        csv += `STA,Elevasi Tanah Asli (m),Elevasi Rencana Jalan (m),Beda Tinggi Delta Z (m),Status Pekerjaan\r\n`;
        profileData.forEach(p => {
          csv += `${p.staFormatted},${p.zGround.toFixed(2)},${p.zDesign.toFixed(2)},${p.deltaZ.toFixed(2)},"${p.status}"\r\n`;
        });
        csv += `\r\nEstimasi Total Volume Kasar: Galian = ${earthworkVolume.totalCut} m3 | Timbunan = ${earthworkVolume.totalFill} m3\r\n`;

        // Download Trigger
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `Perencanaan_Geometrik_Jalan_UNTIDAR_${Vd}kmh.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Bidirectional helper: Calculate X, Y from Latitude & Longitude relative to PI-0
      const syncXYFromLatLon = (lat, lon, basePI) => {
        const baseLat = basePI.lat || geoAnchor.lat;
        const baseLon = basePI.lon || geoAnchor.lon;
        const baseRad = (baseLat * Math.PI) / 180;
        const m_lat = 111132.954 - 559.822 * Math.cos(2 * baseRad) + 1.175 * Math.cos(4 * baseRad);
        const m_lon = 111412.84 * Math.cos(baseRad) - 93.5 * Math.cos(3 * baseRad);
        const dy = (lat - baseLat) * m_lat;
        const dx = (lon - baseLon) * m_lon;
        return {
          x: Math.round(basePI.x + dx),
          y: Math.round(basePI.y + dy)
        };
      };

      // Bidirectional helper: Calculate Latitude & Longitude from X, Y relative to PI-0
      const syncLatLonFromXY = (x, y, basePI) => {
        const baseLat = basePI.lat || geoAnchor.lat;
        const baseLon = basePI.lon || geoAnchor.lon;
        const baseRad = (baseLat * Math.PI) / 180;
        const m_lat = 111132.954 - 559.822 * Math.cos(2 * baseRad) + 1.175 * Math.cos(4 * baseRad);
        const m_lon = 111412.84 * Math.cos(baseRad) - 93.5 * Math.cos(3 * baseRad);
        const dx = x - basePI.x;
        const dy = y - basePI.y;
        return {
          lat: parseFloat((baseLat + dy / m_lat).toFixed(6)),
          lon: parseFloat((baseLon + dx / m_lon).toFixed(6))
        };
      };

      // Handler for Latitude change
      const handleLatChange = (id, newLat) => {
        const basePI = piList[0];
        setPiList(piList.map(p => {
          if (p.id === id) {
            const xy = syncXYFromLatLon(newLat, p.lon, basePI);
            return { ...p, lat: newLat, x: id === basePI.id ? p.x : xy.x, y: id === basePI.id ? p.y : xy.y };
          }
          return p;
        }));
      };

      // Handler for Longitude change
      const handleLonChange = (id, newLon) => {
        const basePI = piList[0];
        setPiList(piList.map(p => {
          if (p.id === id) {
            const xy = syncXYFromLatLon(p.lat, newLon, basePI);
            return { ...p, lon: newLon, x: id === basePI.id ? p.x : xy.x, y: id === basePI.id ? p.y : xy.y };
          }
          return p;
        }));
      };

      // Quick Paste Add from Google Earth coordinate string
      const handleQuickAdd = () => {
        if (!quickPasteText.trim()) return;
        // Match formats like "-7.472615, 110.222340" or "-7.472615 110.222340"
        const parts = quickPasteText.replace(/[,;]/g, ' ').trim().split(/\s+/);
        if (parts.length < 2) {
          alert("Format tidak valid! Harap masukkan format: Latitude, Longitude (contoh: -7.472615, 110.222340)");
          return;
        }
        const lat = parseFloat(parts[0]);
        const lon = parseFloat(parts[1]);
        if (isNaN(lat) || isNaN(lon)) {
          alert("Nilai angka koordinat Latitude atau Longitude tidak valid!");
          return;
        }

        const basePI = piList[0];
        const xy = syncXYFromLatLon(lat, lon, basePI);
        const last = piList[piList.length - 1];
        const newId = piList.length + 1;

        const newPoint = {
          id: newId,
          name: `PI-${piList.length - 1}`,
          lat,
          lon,
          x: xy.x,
          y: xy.y,
          R: 300,
          Ls: 50
        };

        const updated = [...piList.slice(0, -1), newPoint, { ...last, id: newId + 1, name: `PI-${piList.length} (Akhir)` }];
        setPiList(updated);
        setQuickPasteText('');
      };

      // Handler for adding new PI point
      const handleAddPI = () => {
        const last = piList[piList.length - 1];
        const basePI = piList[0];
        const newId = piList.length + 1;
        const newX = last.x + 600;
        const newY = last.y + (piList.length % 2 === 0 ? -300 : 350);
        const geo = syncLatLonFromXY(newX, newY, basePI);

        const newPoint = {
          id: newId,
          name: `PI-${piList.length - 1}`,
          lat: geo.lat,
          lon: geo.lon,
          x: newX,
          y: newY,
          R: 300,
          Ls: 50
        };

        const endX = last.x + 1200;
        const endY = last.y;
        const endGeo = syncLatLonFromXY(endX, endY, basePI);

        let updated = [
          ...piList.slice(0, -1),
          newPoint,
          { ...last, id: newId + 1, name: `PI-${piList.length} (Akhir)`, lat: endGeo.lat, lon: endGeo.lon, x: endX, y: endY }
        ];
        setPiList(updated);
      };

      // Handler for adding new PVI point
      const handleAddPVI = () => {
        const last = pviList[pviList.length - 1];
        const newId = pviList.length + 1;
        const newPoint = {
          id: newId,
          name: `PVI-${pviList.length - 1}`,
          sta: last.sta + 600,
          zDesign: last.zDesign + (pviList.length % 2 === 0 ? -12 : 15),
          zGround: last.zGround + (pviList.length % 2 === 0 ? -10 : 14),
          Lv: 120
        };
        let updated = [...pviList.slice(0, -1), newPoint, { ...last, id: newId + 1, name: `PVI-${pviList.length} (Akhir)`, sta: last.sta + 1200, zDesign: last.zDesign + 5, zGround: last.zGround + 5, Lv: 0 }];
        setPviList(updated);
      };

      // Load Preset
      const handleLoadPreset = (preset) => {
        setVd(preset.Vd);
        setTerrain(preset.terrain);
        setLaneWidth(preset.laneWidth);
        setEmax(preset.emax);
        setEn(preset.en);
        setC(preset.C);
        setPiList(preset.piList);
        setPviList(preset.pviList);
        if (preset.piList && preset.piList[0] && preset.piList[0].lat) {
          setGeoAnchor(prev => ({
            ...prev,
            lat: preset.piList[0].lat,
            lon: preset.piList[0].lon
          }));
        }
      };

      return (
        <div className="flex flex-col min-h-screen">
          
          {/* HEADER AKADEMIK & BRANDING */}
          <header className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40 shadow-sm transition-colors">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-20">
                
                {/* Logo & Academic Title */}
                <div className="flex items-center space-x-4">
                  <div className="bg-white p-1 rounded-xl shadow-sm border border-slate-100 flex-shrink-0">
                    <img 
                      src="https://upload.wikimedia.org/wikipedia/commons/4/43/Logo_UNTIDAR_%28Universitas_Tidar%29_Magelang.png" 
                      alt="Logo Universitas Tidar" 
                      className="h-12 w-12 object-contain"
                    />
                  </div>
                  <div>
                    <div className="flex items-center space-x-2">
                      <span className="font-extrabold text-lg sm:text-xl text-slate-900 dark:text-white tracking-tight">
                        SID-JALAN <span className="text-amber-500">UNTIDAR</span>
                      </span>
                      <span className="hidden sm:inline-block px-2 py-0.5 text-xs font-semibold bg-blue-100 text-blue-800 dark:bg-blue-900/60 dark:text-blue-300 rounded-full">
                        PDGJ 2021 & Sukirman
                      </span>
                    </div>
                    <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                      Sistem Pakar & Kalkulator Perencanaan Geometrik Jalan | Jurusan Teknik Sipil Universitas Tidar
                    </p>
                  </div>
                </div>

                {/* Right Actions: Expert Button & Dark Mode */}
                <div className="flex items-center space-x-3">
                  <button
                    onClick={() => setActiveTab('earth')}
                    className="flex items-center px-3 py-2 text-xs sm:text-sm font-semibold rounded-lg bg-emerald-50 text-emerald-900 border border-emerald-300 hover:bg-emerald-100 dark:bg-emerald-950/60 dark:text-emerald-200 dark:border-emerald-800 shadow-sm transition duration-150"
                  >
                    <IconGlobe />
                    <span className="hidden sm:inline font-bold">Google Earth (KML)</span>
                  </button>

                  <button
                    onClick={() => setShowExpertModal(true)}
                    className="flex items-center px-3.5 py-2 text-xs sm:text-sm font-semibold rounded-lg bg-amber-50 text-amber-900 border border-amber-300 hover:bg-amber-100 dark:bg-amber-950/60 dark:text-amber-200 dark:border-amber-800 shadow-sm transition duration-150"
                  >
                    <IconBulb />
                    <span className="ml-1.5 font-bold">💡 Saran Pakar</span>
                  </button>

                  <button
                    onClick={() => setDarkMode(!darkMode)}
                    title={darkMode ? "Ganti ke Light Mode" : "Ganti ke Dark Mode"}
                    className="p-2.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition"
                  >
                    {darkMode ? <IconSun /> : <IconMoon />}
                  </button>
                </div>

              </div>
            </div>

            {/* Sub-Header Navigation Tabs */}
            <div className="border-t border-slate-100 dark:border-slate-800 bg-slate-50/80 dark:bg-slate-900/80 backdrop-blur">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <nav className="flex space-x-2 sm:space-x-6 overflow-x-auto py-2 text-sm">
                  {[
                    { id: 'overview', label: '1. Parameter & Koordinat' },
                    { id: 'expert', label: '2. Analisis Pakar (Pros-Cons)' },
                    { id: 'horizontal', label: '3. Alinyemen Horizontal' },
                    { id: 'vertical', label: '4. Alinyemen Vertikal' },
                    { id: 'profile', label: '5. Grafik Profil 2D' },
                    { id: 'earth', label: '6. Google Earth & Satelit 3D' },
                    { id: 'export', label: '7. Laporan & Export' }
                  ].map((tab) => (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`whitespace-nowrap px-3 py-1.5 rounded-md font-medium text-xs sm:text-sm transition ${
                        activeTab === tab.id
                          ? 'bg-blue-600 text-white shadow-sm'
                          : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-200/50 dark:hover:bg-slate-800'
                      }`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </nav>
              </div>
            </div>
          </header>

          {/* MAIN CONTENT CONTAINER */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

            {/* TOP PRESET BANNER */}
            <div className="bg-gradient-to-r from-blue-900 to-indigo-900 text-white rounded-2xl p-5 shadow-md flex flex-col md:flex-row items-center justify-between gap-4">
              <div>
                <div className="flex items-center space-x-2">
                  <span className="bg-amber-400 text-slate-900 text-xs font-black uppercase px-2 py-0.5 rounded">
                    Studi Kasus Cepat
                  </span>
                  <h2 className="text-base sm:text-lg font-bold">Muat Contoh Konfigurasi Trase Geometrik</h2>
                </div>
                <p className="text-xs sm:text-sm text-blue-100 mt-1">
                  Pilih preset standar untuk memuat parameter desain kecepatan, medan, koordinat horizontal, dan profil vertikal seketika.
                </p>
              </div>
              <div className="flex flex-wrap gap-2.5 w-full md:w-auto">
                <button
                  onClick={() => handleLoadPreset(PRESET_PEGUNUNGAN)}
                  className="flex-1 md:flex-initial px-4 py-2 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center justify-center"
                >
                  ⛰️ Trase Berbukit (Vd = 60 km/j, e=10%)
                </button>
                <button
                  onClick={() => handleLoadPreset(PRESET_DATAR)}
                  className="flex-1 md:flex-initial px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs sm:text-sm transition flex items-center justify-center shadow"
                >
                  🛣️ Trase Datar (Vd = 80 km/j, e=8%)
                </button>
              </div>
            </div>

            {/* TAB 1: PARAMETER & KOORDINAT INPUT */}
            {activeTab === 'overview' && (
              <div className="space-y-6">

                {/* PARAMETER UMUM CARD */}
                <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-800">
                  <div className="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-4 mb-5">
                    <div>
                      <h3 className="text-base font-bold text-slate-900 dark:text-white flex items-center">
                        <span className="w-2.5 h-2.5 rounded-full bg-blue-600 mr-2"></span>
                        Parameter Utama Desain Jalan (PDGJ 2021)
                      </h3>
                      <p className="text-xs text-slate-500 dark:text-slate-400">
                        Input kecepatan rencana, medan, dan batas superelevasi sesuai klasifikasi fungsi jalan.
                      </p>
                    </div>
                    <span className="text-xs px-2.5 py-1 font-mono rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                      R_min Matematis = <strong className="text-blue-600 dark:text-blue-400">{Rmin} m</strong>
                    </span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    {/* Kecepatan Rencana Vd */}
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                        Kecepatan Rencana (Vd)
                      </label>
                      <select
                        value={Vd}
                        onChange={(e) => setVd(Number(e.target.value))}
                        className="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500"
                      >
                        {[30, 40, 50, 60, 70, 80, 90, 100, 110, 120].map((v) => (
                          <option key={v} value={v}>{v} km/jam</option>
                        ))}
                      </select>
                    </div>

                    {/* Tipe Medan */}
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                        Tipe Medan Topografi
                      </label>
                      <select
                        value={terrain}
                        onChange={(e) => setTerrain(e.target.value)}
                        className="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500"
                      >
                        <option value="Datar">Datar (Kemiringan &lt; 3%)</option>
                        <option value="Perbukitan">Perbukitan (Kemiringan 3% - 25%)</option>
                        <option value="Pegunungan">Pegunungan (Kemiringan &gt; 25%)</option>
                      </select>
                    </div>

                    {/* Lebar Lajur B */}
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                        Lebar Lajur Lalu Lintas (B)
                      </label>
                      <select
                        value={laneWidth}
                        onChange={(e) => setLaneWidth(Number(e.target.value))}
                        className="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500"
                      >
                        <option value={2.75}>2.75 meter (Jalan Lokal)</option>
                        <option value={3.00}>3.00 meter (Kolektor/Lokal)</option>
                        <option value={3.25}>3.25 meter (Kolektor)</option>
                        <option value={3.50}>3.50 meter (Arteri Standar)</option>
                        <option value={3.75}>3.75 meter (Bebas Hambatan)</option>
                      </select>
                    </div>

                    {/* Superelevasi Maksimum emax */}
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                        Superelevasi Maksimum (e_max)
                      </label>
                      <select
                        value={emax}
                        onChange={(e) => setEmax(Number(e.target.value))}
                        className="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500"
                      >
                        <option value={0.10}>10% (Luar Kota / Standar Bina Marga)</option>
                        <option value={0.08}>8% (Perkotaan / Datar Standar)</option>
                        <option value={0.06}>6% (Kawasan Khusus Padat)</option>
                      </select>
                    </div>
                  </div>

                  {/* Koefisien Otomatis & Standar Display */}
                  <div className="mt-5 grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-50 dark:bg-slate-800/60 p-3.5 rounded-xl text-xs">
                    <div>
                      <span className="text-slate-500 dark:text-slate-400 block">Koefisien Gesek f_max:</span>
                      <strong className="text-slate-900 dark:text-white font-mono">{fmax}</strong>
                    </div>
                    <div>
                      <span className="text-slate-500 dark:text-slate-400 block">Kemiringan Normal e_n:</span>
                      <strong className="text-slate-900 dark:text-white font-mono">{(en * 100).toFixed(0)}%</strong>
                    </div>
                    <div>
                      <span className="text-slate-500 dark:text-slate-400 block">JPH Standar:</span>
                      <strong className="text-slate-900 dark:text-white font-mono">{sightDistances.JPH} meter</strong>
                    </div>
                    <div>
                      <span className="text-slate-500 dark:text-slate-400 block">JPM Standar:</span>
                      <strong className="text-slate-900 dark:text-white font-mono">{sightDistances.JPM} meter</strong>
                    </div>
                  </div>
                </div>

                {/* TABEL KOORDINAT PI HORIZONTAL */}
                <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-800">
                  
                  {/* Header & Mode Switcher */}
                  <div className="flex flex-col lg:flex-row lg:items-center justify-between pb-4 mb-4 border-b border-slate-100 dark:border-slate-800 gap-3">
                    <div>
                      <div className="flex items-center space-x-2">
                        <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                        <h3 className="text-base font-bold text-slate-900 dark:text-white">
                          Tabel Point of Intersection (PI) Alinyemen Horizontal
                        </h3>
                        <span className="px-2 py-0.5 text-[10px] font-bold rounded bg-emerald-100 text-emerald-800 dark:bg-emerald-900/60 dark:text-emerald-300">
                          {coordMode === 'gps' ? '🌐 Format Google Earth (GPS)' : '📐 Format Metrik (X, Y)'}
                        </span>
                      </div>
                      <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                        {coordMode === 'gps'
                          ? 'Input koordinat Latitude & Longitude dari Google Earth (WGS-84). Jarak metrik, sudut defleksi tikungan, dan stasioning (STA) dihitung otomatis.'
                          : 'Input koordinat kartesian metrik lokal (X, Y meter). Sistem otomatis menyinkronkan koordinat Latitude & Longitude.'
                        }
                      </p>
                    </div>

                    <div className="flex flex-wrap items-center gap-2">
                      <div className="inline-flex p-1 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs">
                        <button
                          type="button"
                          onClick={() => setCoordMode('gps')}
                          className={`px-3 py-1.5 font-bold rounded-lg transition ${
                            coordMode === 'gps'
                              ? 'bg-emerald-600 text-white shadow-sm'
                              : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                          }`}
                        >
                          🌐 Google Earth (Lat/Lon)
                        </button>
                        <button
                          type="button"
                          onClick={() => setCoordMode('metric')}
                          className={`px-3 py-1.5 font-bold rounded-lg transition ${
                            coordMode === 'metric'
                              ? 'bg-blue-600 text-white shadow-sm'
                              : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                          }`}
                        >
                          📐 Metrik Lokal (X, Y)
                        </button>
                      </div>

                      <button
                        onClick={handleAddPI}
                        className="inline-flex items-center px-3 py-1.5 text-xs font-semibold rounded-lg bg-blue-50 text-blue-700 hover:bg-blue-100 dark:bg-blue-900/40 dark:text-blue-300 border border-blue-200 dark:border-blue-800 transition"
                      >
                        <IconPlus /> Tambah Titik PI
                      </button>
                    </div>
                  </div>

                  {/* QUICK PASTE BAR FROM GOOGLE EARTH */}
                  <div className="mb-4 p-3.5 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/60 rounded-xl flex flex-col sm:flex-row items-center justify-between gap-3 text-xs">
                    <div className="flex items-center space-x-2.5 w-full sm:w-auto">
                      <span className="font-bold text-emerald-950 dark:text-emerald-200 whitespace-nowrap flex items-center">
                        <IconGlobe /> Tempel Koordinat Google Earth:
                      </span>
                      <input
                        type="text"
                        value={quickPasteText}
                        onChange={(e) => setQuickPasteText(e.target.value)}
                        onKeyDown={(e) => { if (e.key === 'Enter') handleQuickAdd(); }}
                        placeholder="Contoh: -7.472615, 110.222340"
                        className="w-full sm:w-72 px-3 py-1.5 text-xs rounded-lg border border-emerald-300 dark:border-emerald-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white font-mono focus:ring-2 focus:ring-emerald-500"
                      />
                    </div>
                    <div className="flex items-center space-x-2 w-full sm:w-auto justify-end">
                      <button
                        onClick={handleQuickAdd}
                        className="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-sm transition whitespace-nowrap"
                      >
                        + Tambah Titik dari Koordinat Ini
                      </button>
                      <a
                        href="https://earth.google.com/web/"
                        target="_blank"
                        rel="noopener noreferrer"
                        className="px-2.5 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:text-emerald-600 font-semibold rounded-lg transition inline-flex items-center"
                        title="Buka Google Earth Web"
                      >
                        Google Earth <IconExternal />
                      </a>
                    </div>
                  </div>

                  {/* TABLE OF PI POINTS */}
                  <div className="overflow-x-auto">
                    <table className="min-w-full text-xs text-left">
                      <thead className="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 uppercase font-semibold">
                        <tr>
                          <th className="px-3 py-2.5 rounded-l-lg">Titik PI</th>
                          {coordMode === 'gps' ? (
                            <>
                              <th className="px-3 py-2.5">Latitude Lintang (°)</th>
                              <th className="px-3 py-2.5">Longitude Bujur (°)</th>
                            </>
                          ) : (
                            <>
                              <th className="px-3 py-2.5">Koordinat X (m)</th>
                              <th className="px-3 py-2.5">Koordinat Y (m)</th>
                            </>
                          )}
                          <th className="px-3 py-2.5">Jarak &amp; Arah</th>
                          <th className="px-3 py-2.5 bg-blue-50/70 dark:bg-blue-950/40 text-blue-900 dark:text-blue-300">Hasil Stationing (STA)</th>
                          <th className="px-3 py-2.5">Rencana R (m)</th>
                          <th className="px-3 py-2.5">Panjang Ls (m)</th>
                          <th className="px-3 py-2.5 rounded-r-lg text-center">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                        {piList.map((pi, idx) => {
                          const isEndpoint = idx === 0 || idx === piList.length - 1;
                          const nextSeg = horizCalc.segments[idx];
                          const curve = horizCalc.curves[idx - 1];
                          const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${pi.lat.toFixed(6)},${pi.lon.toFixed(6)}`;

                          return (
                            <tr key={pi.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                              <td className="px-3 py-2.5">
                                <span className="font-bold text-slate-900 dark:text-white block">
                                  {pi.name}
                                </span>
                                <span className="text-[10px] text-slate-400 font-mono">
                                  {coordMode === 'gps' ? `(X: ${pi.x}m, Y: ${pi.y}m)` : `(${pi.lat.toFixed(5)}°, ${pi.lon.toFixed(5)}°)`}
                                </span>
                              </td>

                              {coordMode === 'gps' ? (
                                <>
                                  <td className="px-3 py-2.5">
                                    <input
                                      type="number"
                                      step="0.000001"
                                      value={pi.lat}
                                      onChange={(e) => handleLatChange(pi.id, Number(e.target.value))}
                                      className="w-28 px-2 py-1 text-xs rounded border border-emerald-300 dark:border-emerald-700 bg-white dark:bg-slate-800 font-mono font-semibold text-emerald-700 dark:text-emerald-300 focus:ring-2 focus:ring-emerald-500"
                                    />
                                  </td>
                                  <td className="px-3 py-2.5">
                                    <input
                                      type="number"
                                      step="0.000001"
                                      value={pi.lon}
                                      onChange={(e) => handleLonChange(pi.id, Number(e.target.value))}
                                      className="w-28 px-2 py-1 text-xs rounded border border-emerald-300 dark:border-emerald-700 bg-white dark:bg-slate-800 font-mono font-semibold text-emerald-700 dark:text-emerald-300 focus:ring-2 focus:ring-emerald-500"
                                    />
                                  </td>
                                </>
                              ) : (
                                <>
                                  <td className="px-3 py-2.5">
                                    <input
                                      type="number"
                                      value={pi.x}
                                      onChange={(e) => {
                                        const val = Number(e.target.value);
                                        const basePI = piList[0];
                                        const geo = syncLatLonFromXY(val, pi.y, basePI);
                                        setPiList(piList.map(p => p.id === pi.id ? { ...p, x: val, lat: geo.lat, lon: geo.lon } : p));
                                      }}
                                      className="w-24 px-2 py-1 text-xs rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 font-mono text-blue-700 dark:text-blue-300 font-semibold focus:ring-2 focus:ring-blue-500"
                                    />
                                  </td>
                                  <td className="px-3 py-2.5">
                                    <input
                                      type="number"
                                      value={pi.y}
                                      onChange={(e) => {
                                        const val = Number(e.target.value);
                                        const basePI = piList[0];
                                        const geo = syncLatLonFromXY(pi.x, val, basePI);
                                        setPiList(piList.map(p => p.id === pi.id ? { ...p, y: val, lat: geo.lat, lon: geo.lon } : p));
                                      }}
                                      className="w-24 px-2 py-1 text-xs rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 font-mono text-blue-700 dark:text-blue-300 font-semibold focus:ring-2 focus:ring-blue-500"
                                    />
                                  </td>
                                </>
                              )}

                              {/* Jarak ke titik berikutnya */}
                              <td className="px-3 py-2.5 font-mono">
                                {nextSeg ? (
                                  <div>
                                    <span className="font-bold text-slate-800 dark:text-slate-200">
                                      {nextSeg.dist.toFixed(1)} m
                                    </span>
                                    <span className="text-[10px] text-slate-400 block">
                                      Az: {nextSeg.azimuth.toFixed(1)}°
                                    </span>
                                  </div>
                                ) : (
                                  <span className="text-slate-400 italic text-[11px]">- Ujung Trase -</span>
                                )}
                              </td>

                              {/* Hasil Stationing (STA) */}
                              <td className="px-3 py-2.5 font-mono bg-blue-50/40 dark:bg-blue-950/20">
                                {idx === 0 ? (
                                  <span className="px-2 py-0.5 rounded font-bold text-blue-700 dark:text-blue-300 bg-blue-100 dark:bg-blue-900/60">
                                    STA 0+000.00 (Awal)
                                  </span>
                                ) : idx === piList.length - 1 ? (
                                  <div>
                                    <span className="px-2 py-0.5 rounded font-bold text-emerald-700 dark:text-emerald-300 bg-emerald-100 dark:bg-emerald-900/60">
                                      STA {formatSTA(horizCalc.totalSTA)} (Akhir)
                                    </span>
                                    <span className="text-[10px] text-slate-500 block mt-0.5">
                                      Panjang Total: {horizCalc.totalSTA?.toFixed(1)} m
                                    </span>
                                  </div>
                                ) : curve ? (
                                  <div className="space-y-0.5 text-[11px]">
                                    <div className="font-bold text-blue-700 dark:text-blue-300">
                                      STA PI: {curve.staPIFormatted}
                                    </div>
                                    <div className="text-[10px] text-slate-500 dark:text-slate-400">
                                      TS: {curve.staTSFormatted} | ST: {curve.staSTFormatted}
                                    </div>
                                  </div>
                                ) : (
                                  '-'
                                )}
                              </td>

                              <td className="px-3 py-2.5">
                                {isEndpoint ? (
                                  <span className="text-slate-400 italic">- Titik Tangen -</span>
                                ) : (
                                  <input
                                    type="number"
                                    value={pi.R}
                                    placeholder={`Min: ${Rmin}`}
                                    onChange={(e) => {
                                      const val = Number(e.target.value);
                                      setPiList(piList.map(p => p.id === pi.id ? { ...p, R: val } : p));
                                    }}
                                    className="w-24 px-2 py-1 text-xs rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 font-mono"
                                  />
                                )}
                              </td>

                              <td className="px-3 py-2.5">
                                {isEndpoint ? (
                                  <span className="text-slate-400 italic">-</span>
                                ) : (
                                  <input
                                    type="number"
                                    value={pi.Ls}
                                    onChange={(e) => {
                                      const val = Number(e.target.value);
                                      setPiList(piList.map(p => p.id === pi.id ? { ...p, Ls: val } : p));
                                    }}
                                    className="w-20 px-2 py-1 text-xs rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 font-mono"
                                  />
                                )}
                              </td>

                              <td className="px-3 py-2.5 text-center">
                                <div className="flex items-center justify-center space-x-1.5">
                                  <a
                                    href={gmapsUrl}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="p-1.5 text-slate-500 hover:text-emerald-600 dark:hover:text-emerald-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded transition"
                                    title="Tinjau Titik Ini di Google Maps"
                                  >
                                    <IconExternal />
                                  </a>
                                  {!isEndpoint && piList.length > 3 && (
                                    <button
                                      onClick={() => setPiList(piList.filter(p => p.id !== pi.id))}
                                      className="p-1.5 hover:bg-red-50 dark:hover:bg-red-950 rounded transition"
                                      title="Hapus PI"
                                    >
                                      <IconTrash />
                                    </button>
                                  )}
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>

                </div>

                {/* JENDELA PRATINJAU POSISI KOORDINAT DI GOOGLE EARTH (LIVE PREVIEW WINDOW) */}
                <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-800">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-4 mb-4 border-b border-slate-100 dark:border-slate-800 gap-2">
                    <div>
                      <div className="flex items-center space-x-2">
                        <span className="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
                        <h4 className="text-base font-bold text-slate-900 dark:text-white">
                          Jendela Pratinjau Posisi Koordinat &amp; Denah Trase di Google Earth
                        </h4>
                        <span className="px-2 py-0.5 text-[10px] font-bold rounded bg-blue-100 text-blue-800 dark:bg-blue-900/60 dark:text-blue-300">
                          Live Satellite Window
                        </span>
                      </div>
                      <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                        Lihat langsung posisi koordinat yang Anda masukkan di atas citra satelit resolusi tinggi. <strong>Klik pada peta</strong> untuk menambah titik PI baru secara presisi!
                      </p>
                    </div>

                    <div className="flex items-center space-x-3 text-xs">
                      <div className="flex items-center space-x-1.5">
                        <span className="w-3.5 h-1 bg-amber-500 inline-block border-b border-dashed"></span>
                        <span className="text-slate-600 dark:text-slate-400">Garis Tangen</span>
                      </div>
                      <div className="flex items-center space-x-1.5">
                        <span className="w-3.5 h-1 bg-blue-600 inline-block"></span>
                        <span className="text-slate-600 dark:text-slate-400">Lengkung Jalan</span>
                      </div>
                    </div>
                  </div>

                  {/* MAP CONTAINER */}
                  <div className="relative rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-800 shadow-inner">
                    <div
                      ref={inputMapContainerRef}
                      style={{ height: '420px', width: '100%' }}
                      className="z-10"
                    ></div>

                    {/* LIVE CURSOR COORDINATE BAR */}
                    <div className="absolute bottom-2.5 left-2.5 z-20 bg-slate-900/85 text-white px-3 py-1.5 rounded-lg text-xs font-mono backdrop-blur pointer-events-none border border-slate-700/60 shadow">
                      {cursorCoords ? (
                        <span>
                          📍 Kursor: <strong>Lat: {cursorCoords.lat.toFixed(6)}°</strong> | <strong>Lon: {cursorCoords.lon.toFixed(6)}°</strong>
                        </span>
                      ) : (
                        <span className="text-slate-400">Gerakkan mouse di atas peta untuk membaca koordinat Google Earth</span>
                      )}
                    </div>
                  </div>
                </div>

                {/* TABEL RANGKUMAN STATIONING TITIK-TITIK KRITIS ALINYEMEN HORIZONTAL */}
                <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-800">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-4 mb-4 border-b border-slate-100 dark:border-slate-800 gap-2">
                    <div>
                      <div className="flex items-center space-x-2">
                        <span className="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
                        <h4 className="text-base font-bold text-slate-900 dark:text-white">
                          Rangkuman Hasil Stationing (STA) Titik-Titik Kritis Trase Jalan
                        </h4>
                        <span className="px-2 py-0.5 text-[10px] font-bold rounded bg-indigo-100 text-indigo-800 dark:bg-indigo-900/60 dark:text-indigo-300">
                          PDGJ 2021 &amp; Sukirman
                        </span>
                      </div>
                      <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                        Daftar stasioning resmi sepanjang sumbu jalan mulai dari Titik Awal (0+000) hingga Titik Akhir ({formatSTA(horizCalc.totalSTA)}).
                      </p>
                    </div>

                    <div className="text-right">
                      <span className="text-xs text-slate-500 dark:text-slate-400 block">Panjang Total Sumbu Jalan:</span>
                      <strong className="text-base font-mono font-bold text-blue-600 dark:text-blue-400">
                        {horizCalc.totalSTA ? `${horizCalc.totalSTA.toFixed(2)} meter (${formatSTA(horizCalc.totalSTA)})` : '-'}
                      </strong>
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="min-w-full text-xs text-left">
                      <thead className="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 uppercase font-semibold">
                        <tr>
                          <th className="px-3.5 py-2.5 rounded-l-lg">Titik Kritis</th>
                          <th className="px-3.5 py-2.5">Tipe Titik</th>
                          <th className="px-3.5 py-2.5 font-bold text-blue-900 dark:text-blue-300">Stationing Resmi (STA)</th>
                          <th className="px-3.5 py-2.5">Jarak Parsial (m)</th>
                          <th className="px-3.5 py-2.5">Jarak Kumulatif (m)</th>
                          <th className="px-3.5 py-2.5">Latitude (WGS84)</th>
                          <th className="px-3.5 py-2.5">Longitude (WGS84)</th>
                          <th className="px-3.5 py-2.5 rounded-r-lg">Keterangan Teknis Geometrik</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                        {(horizCalc.criticalStations || []).map((cs, cIdx) => (
                          <tr key={cIdx} className="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                            <td className="px-3.5 py-2 font-bold text-slate-900 dark:text-white font-mono">
                              {cs.code}
                            </td>
                            <td className="px-3.5 py-2">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-semibold ${
                                cs.pointType.includes('Awal') || cs.pointType.includes('Akhir')
                                  ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300'
                                  : cs.pointType.includes('TS') || cs.pointType.includes('ST')
                                  ? 'bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300'
                                  : 'bg-blue-100 text-blue-800 dark:bg-blue-950/60 dark:text-blue-300'
                              }`}>
                                {cs.pointType}
                              </span>
                            </td>
                            <td className="px-3.5 py-2 font-mono font-bold text-blue-600 dark:text-blue-400">
                              {cs.staFormatted}
                            </td>
                            <td className="px-3.5 py-2 font-mono text-slate-600 dark:text-slate-400">
                              {cs.partialDist > 0 ? `${cs.partialDist.toFixed(2)} m` : '-'}
                            </td>
                            <td className="px-3.5 py-2 font-mono text-slate-800 dark:text-slate-200">
                              {cs.cumulativeDist.toFixed(2)} m
                            </td>
                            <td className="px-3.5 py-2 font-mono text-emerald-600 dark:text-emerald-400">
                              {cs.lat ? `${cs.lat.toFixed(6)}°` : '-'}
                            </td>
                            <td className="px-3.5 py-2 font-mono text-emerald-600 dark:text-emerald-400">
                              {cs.lon ? `${cs.lon.toFixed(6)}°` : '-'}
                            </td>
                            <td className="px-3.5 py-2 text-slate-600 dark:text-slate-300 text-[11px]">
                              {cs.desc}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* TABEL KOORDINAT PVI VERTIKAL */}
                <div className="bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-800">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-4 mb-4 border-b border-slate-100 dark:border-slate-800 gap-2">
                    <div>
                      <h3 className="text-base font-bold text-slate-900 dark:text-white flex items-center">
                        <span className="w-2.5 h-2.5 rounded-full bg-indigo-500 mr-2"></span>
                        Tabel Point of Vertical Intersection (PVI) & Elevasi
                      </h3>
                      <p className="text-xs text-slate-500 dark:text-slate-400">
                        Input Stationing (STA), Elevasi Rencana Jalan (Z Design), dan Elevasi Tanah Asli (Z Ground).
                      </p>
                    </div>
                    <button
                      onClick={handleAddPVI}
                      className="inline-flex items-center px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-50 text-indigo-700 hover:bg-indigo-100 dark:bg-indigo-900/40 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800 transition"
                    >
                      <IconPlus /> Tambah Titik PVI
                    </button>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="min-w-full text-xs text-left">
                      <thead className="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 uppercase font-semibold">
                        <tr>
                          <th className="px-3 py-2.5 rounded-l-lg">Titik PVI</th>
                          <th className="px-3 py-2.5">Stationing (STA m)</th>
                          <th className="px-3 py-2.5">Elevasi Rencana Z (m)</th>
                          <th className="px-3 py-2.5">Elevasi Tanah Asli Z (m)</th>
                          <th className="px-3 py-2.5">Panjang Lv (m)</th>
                          <th className="px-3 py-2.5 rounded-r-lg text-center">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                        {pviList.map((pvi, idx) => {
                          const isEndpoint = idx === 0 || idx === pviList.length - 1;
                          return (
                            <tr key={pvi.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                              <td className="px-3 py-2 font-bold text-slate-900 dark:text-white">
                                {pvi.name}
                              </td>
                              <td className="px-3 py-2">
                                <input
                                  type="number"
                                  value={pvi.sta}
                                  onChange={(e) => {
                                    const val = Number(e.target.value);
                                    setPviList(pviList.map(p => p.id === pvi.id ? { ...p, sta: val } : p));
                                  }}
                                  className="w-24 px-2 py-1 text-xs rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 font-mono"
                                />
                                <span className="text-[10px] text-slate-400 ml-1">({formatSTA(pvi.sta)})</span>
                              </td>
                              <td className="px-3 py-2">
                                <input
                                  type="number"
                                  step="0.1"
                                  value={pvi.zDesign}
                                  onChange={(e) => {
                                    const val = Number(e.target.value);
                                    setPviList(pviList.map(p => p.id === pvi.id ? { ...p, zDesign: val } : p));
                                  }}
                                  className="w-24 px-2 py-1 text-xs rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 font-mono"
                                />
                              </td>
                              <td className="px-3 py-2">
                                <input
                                  type="number"
                                  step="0.1"
                                  value={pvi.zGround}
                                  onChange={(e) => {
                                    const val = Number(e.target.value);
                                    setPviList(pviList.map(p => p.id === pvi.id ? { ...p, zGround: val } : p));
                                  }}
